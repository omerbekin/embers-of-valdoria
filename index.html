<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Embers" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Embers of Valdoria</title>
    <!-- Yükleme ekranı arka planı (public/loading, tools/make-loading-bg.mjs): JS paketinden önce inmeye başlasın -->
    <link rel="preload" as="image" type="image/webp" href="./loading/loading-bg.webp" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="./loading/emblem.webp" fetchpriority="high" />
    <!-- Açılış yükleme ekranı (src/ui/boot-loader.ts): Phaser ve fontlardan önce görünsün diye düz HTML/CSS, satır içi. Tasarım kiti dili.
         "Dusk" (Ömer 2026-10-13): gün batımında uzak kale arka planı (asıl assets/source/loading/loading-bg.png, tools/make-loading-bg.mjs), sağ altta
         taç amblemi (public/loading/emblem.webp; asıl assets/source/branding/emblem.png) altın halka içinde, etrafında saat yönünde dönen alev şeridi.
         Yüzde ve çubuk GÖRÜNMEZ (öğeler boot-loader.ts için durur). Arka planın ilk karesi satır içi bulanık yer tutucu, asıl resim yüklenince solar;
         cover ile 16:9-21:9 arası kırpılır. Reduced motion: solma yok, halka yavaş döner. -->
    <style>
      html, body { margin: 0; background: #0d0a07; }
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; overflow: hidden;
        background: #0d0a07; color: #d9c8a2; font-family: Georgia, 'Palatino Linotype', serif;
        transition: opacity 0.4s ease; -webkit-user-select: none; user-select: none; }
      #boot > * { position: relative; z-index: 2; }
      #boot > .boot-bg, #boot > .boot-vig { position: absolute; inset: 0; pointer-events: none; }
      #boot > .boot-bg { z-index: 0; }
      #boot > .boot-vig { z-index: 1; }
      #boot .boot-bg::before, #boot .boot-bg::after { content: ''; position: absolute; background-position: 50% 50%; background-size: cover; background-repeat: no-repeat; }
      #boot .boot-bg::before { inset: -30px; background-image: /*boot-ph*/url(data:image/webp;base64,UklGRr4BAABXRUJQVlA4ILIBAAAQDQCdASpgADYAPrFMmkmnJKIiMVsa6OAWCWQAxxVxyS8wD1Lc/+BzFcPp5sJ9JkvBZSGVG2TgiLxHkWCFEo+G1zWSvFmfWotzDsW1ZystX+NZsOmAGQVgSDd4NYpi3PvXMJ+z/lBMzpocbuOSSZpYMAD+94EtzalvsapEF/ITKn3909em8++nrQ2oX2Ovaa/HfmeFbsWXQfqpUqIQqKdbRUP/S+C9eU41PBd/D8zUz9HQxqL5tkQ8PtzDTTsmXm86GUtQ1zPBd3DyBUrA30dJNreaIqrMr7DKLJLnTQzW8MzlgiDQY+v/U07Fpk239mxA1SivIZ2orRTJeIPixayMr0h97oQwexkqkHgqkakWfXyhqqElCOuF0cXmOTjvC8lE79mD8Q9alQiUZqDoiteRV6aFjnRhhMNUtdIwcpxB5wrYHSVFWKasE1k5yC8D277BsuvztEXMCsBYsDjPmUcTi8brsXC2JjvAjzHSplI+7S0ShTbFU+fQ6UBCij/r1pkJUjnpDhGv2SYUIMWmV1MKjD70xEAn/GnCiZf1BK4mzC7Rvin1ZTCTF0JmKjTfW9AAAA==)/*boot-ph*/; filter: blur(10px); }
      #boot .boot-bg::after { inset: 0; background-image: var(--boot-img, none); opacity: 0; transition: opacity 0.8s ease; }
      #boot.bg-ready .boot-bg::after { opacity: 1; }
      /* kenar karartması + amblemin durduğu sağ alt köşede hafif gölge */
      #boot .boot-vig { background:
          radial-gradient(ellipse 60% 60% at 85% 85%, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0) 70%),
          radial-gradient(ellipse 80% 75% at 50% 50%, rgba(5, 4, 3, 0) 60%, rgba(5, 4, 3, 0.35) 88%, rgba(3, 2, 1, 0.65) 100%); }
      #boot.boot-rm, #boot.boot-rm .boot-bg::after { transition: none; }
      #boot.boot-off { opacity: 0; pointer-events: none; }
      #boot.boot-hidden { display: none; }
      #boot .boot-badge { position: absolute; z-index: 2; aspect-ratio: 1; width: clamp(114px, 19.5vmin, 195px);
        right: calc(clamp(40px, 6.5vw, 120px) + env(safe-area-inset-right, 0px)); bottom: calc(clamp(40px, 9vh, 110px) + env(safe-area-inset-bottom, 0px)); }
      #boot .boot-badge::before { content: ''; position: absolute; inset: 13%; border-radius: 50%; z-index: 2; border: 2px solid rgba(217, 178, 106, 0.75);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.6), inset 0 0 18px rgba(0, 0, 0, 0.8);
        background: radial-gradient(circle, rgba(40, 20, 10, 0.85) 0%, rgba(10, 6, 4, 0.92) 70%); }
      #boot .boot-badge img { position: absolute; inset: 15%; width: 70%; height: 70%; object-fit: contain; z-index: 3; color: #e6c27a; font-size: 12px; }
      #boot .boot-ring { position: absolute; inset: 0; border-radius: 50%; z-index: 1;
        background: conic-gradient(from 0deg, rgba(255, 90, 20, 0) 0deg, rgba(255, 90, 20, 0) 200deg, rgba(255, 110, 30, 0.55) 290deg, #ffb347 340deg, #fff2c0 358deg, rgba(255, 90, 20, 0) 360deg);
        -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%, #000 71%, transparent 74%); mask: radial-gradient(circle, transparent 60%, #000 62%, #000 71%, transparent 74%);
        animation: boot-spin 1.8s linear infinite; }
      #boot .boot-ring.glow { filter: blur(6px); opacity: 0.9; z-index: 0; }
      #boot.boot-rm .boot-ring { animation-duration: 6s; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      #boot .boot-bar, #boot .boot-meta { display: none; }
      /* dikey tutulan dokunmatik cihazda oyun sahnesi gibi 90° döndürülür (src/style.css html.rotated #stage ile aynı yön); JS'ten önce, @media burada doğru:
         #boot döndürülmüş sahnenin dışında, fiziksel ekranı ölçer */
      @media (orientation: portrait) and (pointer: coarse) {
        html:not(.no-rotate) #boot { inset: auto; top: 0; left: 0; width: 100vh; height: 100vw; transform-origin: 0 0; transform: translateX(100vw) rotate(90deg); }
        @supports (height: 100dvh) { html:not(.no-rotate) #boot { width: 100dvh; } }
        html:not(.no-rotate) #boot .boot-badge { width: clamp(96px, 19.5vmin, 170px); right: clamp(28px, 6.5vh, 90px); bottom: clamp(28px, 9vw, 80px); }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-bg" aria-hidden="true"></div>
      <div class="boot-vig" aria-hidden="true"></div>
      <div class="boot-badge" aria-hidden="false"><div class="boot-ring glow"></div><div class="boot-ring"></div><img class="boot-emblem" src="./loading/emblem.webp" width="320" height="320" alt="Embers of Valdoria" decoding="async" fetchpriority="high" /></div>
      <div class="boot-bar"><div class="boot-fill"></div></div>
      <div class="boot-meta"><span class="boot-label">Loading</span><span class="boot-pct">0%</span></div>
    </div>
    <script>
      // Yükleme ekranı arka planı: asıl resim (public/loading) yüklenince bulanık yer tutucunun üstüne solar; Reduced motion (kayıtlı seçim ya da
      // işletim sistemi, src/ui/motion-pref.ts ile aynı anahtar) açıksa solma ve ışıma yok. Paket beklenmeden, ilk karede çalışır.
      (function () {
        var b = document.getElementById('boot');
        if (!b) return;
        if (/[?&]rotate=off\b/.test(location.search)) document.documentElement.classList.add('no-rotate'); // ?rotate=off: yükleme ekranı da dönmez
        var rm = false;
        try {
          var v = localStorage.getItem('eov.reducedMotion');
          if (v === null) v = localStorage.getItem('proto.reducedMotion'); // taşıma öncesi ilk açılış
          rm = v === '1' || (v !== '0' && !!window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
        } catch (e) {}
        if (rm) b.classList.add('boot-rm');
        var u = new URL('loading/loading-bg.webp', document.baseURI).href;
        b.style.setProperty('--boot-img', 'url("' + u + '")');
        // decode() tamamlanınca solar (telefonda büyük resmin çözülmesi ilk boyamayı geciktirmesin); yoksa onload
        var img = new Image();
        var ready = function () { b.classList.add('bg-ready'); };
        img.src = u;
        if (img.decode) img.decode().then(ready, function () { img.complete ? ready() : (img.onload = ready); });
        else img.onload = ready;
      })();
    </script>
    <div id="stage">
      <div id="game"></div>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
