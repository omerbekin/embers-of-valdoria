name: Test ve yayın (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Yalnız public/mockups altını değiştiren push'ta npm test atlanır (Ömer 2026-11-02). Ek güvence: bir önceki commit bu iş akışında BAŞARILI koşmuş olmalı;
  # iptal edilmiş, kırmızı ya da hiç koşmamış bir önceki commit varsa (süren oyun yayınını iptal eden mockup push'u dahil) tam test koşar. Her hata tam teste düşer.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          mode=full
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$SHA" || echo x)
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^public/mockups/'; then
              n=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?head_sha=$BEFORE&status=success" --jq '.total_count' || echo 0)
              if [ "${n:-0}" -gt 0 ]; then mode=mockup; fi
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Kapsam: $mode"

  build:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ needs.scope.outputs.mode != 'mockup' }}
        run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  # Harita 2-3 test kopyası (dal maps-2-3) /maps23/ altına, ana derlemeyle paralel.
  # Kırmızıysa yalnızca bu kısım yayınlanmaz; ana site ve iş akışı etkilenmez.
  maps:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maps-2-3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: ${{ needs.scope.outputs.mode != 'mockup' }}
        run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: maps23
          path: dist

  assemble:
    needs: [scope, build, maps]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: maps23
          path: dist/maps23
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: assemble
    if: always() && needs.assemble.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
