<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Gear Hero - telefon skill bloğu - mockup</title>
<!-- TASLAK (ui-dev, 2026-10-23). Oyun kodu DEĞİL. Adres: #a | #b | #c  (+ &class=cutthroat|warrior|archer  &size=844|740|fit  &clean = şerit gizli).
     Telefon yatay Gear > Hero sekmesi gerçek CSS ile skills-phone/frame.html içinde (html.short html.compact). Büyük ekran düzeni (C) değişmez. -->
<style>
@font-face{font-family:Cinzel;font-weight:400 900;font-display:swap;src:url(skills-phone/fonts/Cinzel-normal-latin.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-weight:400 800;font-display:swap;src:url(skills-phone/fonts/EBGaramond-normal-latin.woff2) format('woff2')}
*{box-sizing:border-box}
:root{--g-gold:#f3d999;--g-dim:#a8977a;--g-line:rgba(217,178,106,.16);--g-line2:rgba(217,178,106,.3);--g-disp:Cinzel,Georgia,serif;--g-body:'EB Garamond',Georgia,serif;--m-hover:170ms;--m-ease:cubic-bezier(.33,1,.68,1)}
html,body{margin:0;background:#070504;color:#d9c8a2;font-family:var(--g-body);font-style:normal}
body{padding:16px 20px 70px;min-height:100vh}
#top{display:flex;align-items:center;gap:14px;margin:0 0 12px;flex-wrap:wrap}
#top h1{font:600 18px var(--g-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--g-gold);margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:600 13px var(--g-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--g-dim);background:transparent;border:1px solid var(--g-line);padding:0 16px;min-height:44px;cursor:pointer;translate:0 0;transition:color var(--m-hover),border-color var(--m-hover),translate var(--m-hover) var(--m-ease)}
.tabs button:hover{color:var(--g-gold);border-color:var(--g-line2);translate:0 -2px}
.tabs button:active{translate:0 1px}
.tabs button.on{color:var(--g-gold);border-color:rgba(217,178,106,.55);background:rgba(217,178,106,.07)}
.note{font:18px/1.4 var(--g-body);color:var(--g-dim);max-width:900px;margin:0 0 14px}
.note b{color:var(--g-gold);font-weight:600}
#dev{display:inline-block;padding:10px;background:#000;border:1px solid var(--g-line2);box-shadow:0 0 0 3px #120d08,0 10px 30px rgba(0,0,0,.6)}
#dev iframe{display:block;border:0;background:#000}
#dev.fit{display:block;padding:0}
#dev.fit iframe{width:100%;height:calc(100vh - 220px);min-height:340px}
#strip{position:fixed;left:8px;bottom:8px;z-index:90;display:flex;flex-wrap:wrap;gap:4px;align-items:center;max-width:calc(100vw - 16px);padding:4px 6px;background:rgba(20,10,4,.94);border:1px dashed #e0702a;font:600 11px system-ui,sans-serif;color:#ffb35a}
#strip b{color:#e0702a;margin-right:4px}
#strip button{font:600 11px system-ui,sans-serif;color:#f3d999;background:#1b120a;border:1px solid rgba(224,112,42,.5);padding:3px 7px;cursor:pointer;min-height:26px}
#strip button.on{background:#e0702a;color:#1a0f06}
html.clean #strip{display:none}
#read{font:600 11px system-ui,sans-serif;color:#9a8a70;margin-left:6px}
#read.ok{color:#8fe39a}#read.bad{color:#ff8a7a}
</style></head>
<body>
<div id="top"><h1>Gear · Hero · telefon skill bloğu</h1><div class="tabs" id="vtabs"></div><div class="tabs" id="ctabs"></div></div>
<div class="note" id="note"></div>
<div id="dev"><iframe id="fr" title="Telefon Gear Hero"></iframe></div>
<div id="strip"><b>MOCKUP</b>Telefon skills &middot; boyut:
<button data-s="844">844x390</button><button data-s="740">740x360</button><button data-s="fit">Cihaz</button><span id="read"></span></div>
<script>
const NOTES={
 a:'<b>A · Madalyonlar:</b> beş büyük madalyon yan yana (pasif önce); altında ad, bedel çipleri ve ana altın rakam. Ayrıntı için madalyona dokun: A Band ipucu açılır (tekrar dokun ya da boşluğa dokun: kapanır). En az yer tutar, tüm skill\'ler tek bakışta.',
 b:'<b>B · Mini plakalar:</b> solda uzun pasif kartı (tam cümle + rakam), sağda 2×2 mini plaka (ikon, ad, bedel, altın rakam; ulti turuncu). Masaüstü C\'nin küçültülmüşü; pasif tam genişlik yerine solda, çünkü 44 px dokunma payı yetmiyor. Dokununca A Band ipucu.',
 c:'<b>C · Sekmeli tek kart:</b> üstte 5 ikon sekmesi (pasif ilk), altında seçili skill\'in büyük kartı: ikon, ad, bedel çipleri, iki satır açıklama, büyük altın rakamlar. Kartı sağa / sola kaydırınca sonraki skill; karta dokununca A Band ipucu.'};
const q=new URLSearchParams(location.hash.slice(1).replace(/^[abc]&?/,''));
const S={v:(location.hash.match(/^#([abc])/)||[])[1]||'a',cls:q.get('class')||'cutthroat',size:q.get('size')||(innerWidth<900?'fit':'844'),clean:q.has('clean')};
const $=s=>document.querySelector(s);
const CN={cutthroat:'Cutthroat',warrior:'Warrior',archer:'Archer'};
function frameSrc(){return 'skills-phone/frame.html#'+S.v+'&class='+S.cls;}
function render(reload){
  $('#note').innerHTML=NOTES[S.v];
  $('#vtabs').innerHTML=['a','b','c'].map(k=>`<button data-v="${k}" class="${k===S.v?'on':''}">${k.toUpperCase()}</button>`).join('');
  $('#ctabs').innerHTML=Object.keys(CN).map(k=>`<button data-c="${k}" class="${k===S.cls?'on':''}">${CN[k]}</button>`).join('');
  document.querySelectorAll('#strip button[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===S.size));
  document.documentElement.classList.toggle('clean',S.clean);
  const dev=$('#dev'),fr=$('#fr');
  dev.classList.toggle('fit',S.size==='fit');
  if(S.size==='844'){fr.style.width='844px';fr.style.height='390px';}
  else if(S.size==='740'){fr.style.width='740px';fr.style.height='360px';}
  else{fr.style.width='';fr.style.height='';}
  const src=frameSrc();
  if(reload||!fr.getAttribute('src')){fr.src=src;}else if(fr.contentWindow){try{fr.contentWindow.location.hash=src.split('#')[1];}catch(e){fr.src=src;}}
  history.replaceState(null,'','#'+S.v+'&class='+S.cls+'&size='+S.size+(S.clean?'&clean':''));
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.v){S.v=b.dataset.v;render(false);}
  else if(b.dataset.c){S.cls=b.dataset.c;render(false);}
  else if(b.dataset.s){S.size=b.dataset.s;render(false);}});
addEventListener('message',e=>{const d=e.data;if(!d)return;
  if(d.sp===2){S.cls=d.cls;$('#ctabs').innerHTML=Object.keys(CN).map(k=>`<button data-c="${k}" class="${k===S.cls?'on':''}">${CN[k]}</button>`).join('');}
  if(d.sp===1){const r=$('#read');r.textContent=d.vw+'x'+d.vh+' · skill bloğu '+d.w+' x '+d.h+' px'+(d.over>1?' · KAYDIRMA VAR (+'+d.over+' px)':' · kaydırma yok');r.className=d.over>1?'bad':'ok';}});
render(true);
</script></body></html>
