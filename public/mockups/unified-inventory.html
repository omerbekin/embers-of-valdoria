<title>Unified Inventory Mockups</title>
<!--
  ORTAK ENVANTER / KARAKTER EKRANI taslağı v2 (ui-dev, 2026-10-18). Oyun kodu DEĞİL; yalnızca seçim için.
  Görünüm BİREBİR oyun: oyunun kendi CSS dosyaları (unified-inventory/css/: src/style.css, src/ui/elegant.css, gear.css, battle-hud.css kopyası),
  oyunun ürettiği işaretleme (kahraman kartı, 7 yuva, level + stat puanı satırı, stat grupları, savaş skill hücreleri, item ipucu, torba hücresi,
  tüccar tezgâhı) ve oyunun gerçek görselleri (avatarlar, item ikonları, stat / UI / durum ikonları, Ashford, Valdoria haritası, Proving Grounds).
  Veri (data.js) oyunun kendi kodundan üretildi: statlar heroPanel (data/formulas.json), item zarları makeItem, ipuçları itemTipNodes, skill çubuğu skillBar.
  v3 (2026-10-18, Ömer): envanter YALNIZCA karakterle ilgili (kahramanlar, yuvalar, level / statlar, skill'ler, skill ağacı, torba).
  Dış etmenler (sefer haritası, kasaba, tüccar, Endless ödülü) envanterin içinde DEĞİL, kendi pencerelerindedir; taslak ikisini yan yana gösterir.
  Adresler (#düzen&enc=dış pencere, isteğe bağlı &clean = taslak şeridini gizle, ekran görüntüsü için; H tuşu aç/kapa):
    #v1   Triptych: kahramanlar | yuvalar + Stats/Skills/Skill tree sekmeleri | torba
    #v2   Tabbed Workbench: üstte kahraman şeridi, solda ikon sekmeler (Equipment / Attributes / Skill tree), ortada tek pano, sağda torba
    #v3   Ledger: iki sayfalık defter; sol kenarda kahraman yer imleri; sekmeler Hero / Sheet
    #v4   Stage: solda statlar, ortada büyük portre + yuva halkası, altta geniş torba rafı; "Hero sheet" tam pencere
    #v5   Squad Board: dört kahraman kartı yan yana (seçili geniş), altta torba
  SEÇİM (Ömer 2026-10-18): v3 Ledger. Bundan sonra yalnızca v3 geliştirilir; şerit ve adres varsayılanı v3 (v1, v2, v4, v5 duruyor, güncel değil).
  Dış etmen (&enc=):
    none     yalnız envanter.
    map      haritanın sol takım sütunu; kahraman satırına dokun = envanter O kahraman seçili açılır (ayrı kahraman paneli yok);
             sol altta Gear (envanteri aç / kapat) + Formation (küçük Formation penceresi, 4 x 3, ön sıra sağda; sürükle ya da dokun-dokun).
    town     oyundaki kasaba ekranı (Ashford): birleşik pencere YOK; resimdeki yerler kendi küçük penceresini açar (Campfire / Notice Board
             = kısa not, Odo's Stall = tüccar, Charcoal Burner = hikâye, Road Out = ayrıl); öndeki kahramana dokun = o kahramanın envanteri;
             sol altta Gear + Formation.
    merchant Odo penceresi: Wares (tezgâh) + iki sekme Sell (buraya sürükle = sat) / Buyback (bu ziyarette satılanlar); Back to town.
    reward   oyundaki Victory ekranı aynen (kartlar, bütün kart = al, View bag); yalnızca View bag artık ortak envanteri (v3) açar,
             ödüller solda küçük ikon (dokun = al), Close bag kartlara döner.
  v3 ayrıntıları (2026-10-18): stat satırı "değer · fark (+1) · [−] [+]" (+ hiç kaymaz); Sheet'te HP / MP altında savaş HUD çubuğu;
  skill ağacı kabı "Coming soon" (yer tutucu düğüm yok); skill sırası pasif önce; boş yuva simgesi unified-inventory/slot-icons/<slot>.webp
  (yoksa eski gölge simge). Kasabadaki kahraman görselleri oyunun idle pozları (unified-inventory/poses/).
  Ör.: #v3&enc=town, #v3&enc=reward&clean. (Eski &mode=... adresleri de açılır.)
-->
