html, body { margin: 0; padding: 0; background: #050302; overflow-x: hidden; }
body { min-height: 100vh; }
#wrap { position: relative; overflow: hidden; }
#tag { position: fixed; top: 4px; right: 6px; z-index: 99; font: 11px/1 'EB Garamond', serif; color: #a8977a; opacity: .55; pointer-events: none; letter-spacing: .04em; }
#stage {
  --u: var(--gu, 1px);
  --g-text: #d9c8a2; --g-dim: #a8977a; --g-gold: #f3d999; --g-edge: rgba(217,178,106,.42); --g-line: rgba(217,178,106,.16); --g-line2: rgba(217,178,106,.3);
  --g-ember: #e0702a; --g-ember2: #ffb35a; --g-disp: Cinzel, Georgia, 'Palatino Linotype', serif; --g-body: 'EB Garamond', Georgia, 'Palatino Linotype', serif;
  --ok: #9fd88a; --bad: #e0907a;
  position: absolute; left: 0; top: 0; transform-origin: 0 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  padding: max(44px, calc(84 * var(--u))) max(8px, calc(20 * var(--u))) max(8px, calc(20 * var(--u)));
  background: radial-gradient(ellipse at 50% 30%, #2a1d12 0%, #120c08 55%, #070403 100%);
  color: var(--g-text); font-family: var(--g-body); font-style: normal;
}
#stage * { box-sizing: border-box; font-style: normal; }
:where(#stage) button { font: inherit; color: inherit; cursor: pointer; text-align: left; }
.gr-panel { display: flex; flex-direction: column; gap: calc(14 * var(--u)); width: min(100%, calc(1700 * var(--u))); height: 100%; max-height: calc(1000 * var(--u)); padding: calc(26 * var(--u)) calc(32 * var(--u));
  background: linear-gradient(180deg, rgba(30,22,14,.97), rgba(12,9,6,.97)); border: 1px solid var(--g-edge); box-shadow: 0 0 0 3px rgba(8,6,4,.7), 0 calc(18 * var(--u)) calc(40 * var(--u)) rgba(0,0,0,.6); overflow: hidden; }
.gr-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: calc(16 * var(--u)); border-bottom: 1px solid var(--g-line); padding-bottom: calc(10 * var(--u)); }
.gr-title { margin: 0; font: 600 max(22px, calc(42 * var(--u))) var(--g-disp); letter-spacing: .12em; text-transform: uppercase; background: linear-gradient(180deg, #fbe7b0 0%, #e6c27a 55%, #b88a42 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 3px rgba(0,0,0,.9)); }
.ec-sub { font: 600 max(12px, calc(20 * var(--u))) var(--g-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--g-dim); }
.ec-body { flex: 1 1 0; display: flex; flex-direction: column; gap: calc(16 * var(--u)); min-height: 0; overflow-y: auto; overflow-x: hidden; padding: calc(4 * var(--u)) calc(6 * var(--u)) calc(6 * var(--u)) 0; scrollbar-width: thin; scrollbar-color: rgba(217,178,106,.4) transparent; }
.ec-rule { margin: 0; font: max(14px, calc(22 * var(--u))) var(--g-body); color: var(--g-dim); }
.ec-lab { margin: 0; font: 600 max(12px, calc(17 * var(--u))) var(--g-disp); letter-spacing: .14em; text-transform: uppercase; color: var(--g-gold); padding-bottom: calc(6 * var(--u)); border-bottom: 1px solid var(--g-line); display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.ec-lab small { font: max(12px, calc(17 * var(--u))) var(--g-body); letter-spacing: 0; text-transform: none; color: var(--g-dim); }
.ec-note { font: max(13px, calc(19 * var(--u))) var(--g-body); color: var(--g-dim); }
.ec-why { font: max(12px, calc(18 * var(--u))) var(--g-body); color: var(--bad); }
.ec-foot { flex: none; display: flex; flex-wrap: nowrap; gap: calc(10 * var(--u)); justify-content: flex-end; align-items: center; border-top: 1px solid var(--g-line); padding-top: calc(12 * var(--u)); }
.ec-foot .ec-note { flex: 1; min-width: 0; }
.gr-btn { position: relative; flex: none; min-height: 44px; padding: 0 calc(26 * var(--u)); background: linear-gradient(180deg, rgba(30,22,14,.82), rgba(12,9,6,.86)); border: 1px solid var(--g-line2); border-radius: 0; box-shadow: 0 0 0 3px rgba(12,8,5,.6);
  font: 600 max(13px, calc(19 * var(--u))) var(--g-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--g-text); text-shadow: 0 2px 4px rgba(12,8,5,.95); transition: border-color .18s, color .18s, transform .25s cubic-bezier(.33,1,.68,1); text-align: center !important; }
.gr-btn:hover { border-color: var(--g-gold); color: var(--g-gold); transform: translateY(-2px); }
.gr-btn::before, .gr-btn::after { content: ''; position: absolute; top: 50%; width: 8px; height: 8px; margin-top: -4px; transform: rotate(45deg); background: #1a130c; box-shadow: 0 0 0 1px rgba(217,178,106,.45); }
.gr-btn::before { left: -5px; } .gr-btn::after { right: -5px; }
.gr-btn.primary { border: 2px solid #d9b26a; color: var(--g-gold); background: linear-gradient(180deg, rgba(38,27,17,.9), rgba(12,9,6,.94)); box-shadow: 0 0 0 3px rgba(12,8,5,.8), 0 10px 24px rgba(0,0,0,.45); }
.gr-btn.primary::before, .gr-btn.primary::after { background: var(--g-ember); box-shadow: 0 0 0 1px var(--g-ember2), 0 0 10px rgba(240,140,40,.7); }
.gr-btn:disabled { opacity: .4; cursor: default; transform: none; }

/* --- today's camp cards (econ.css) --- */
.ec-fire { display: flex; align-items: center; gap: calc(16 * var(--u)); }
.ec-fire img { width: max(36px, calc(64 * var(--u))); height: max(36px, calc(64 * var(--u))); object-fit: contain; flex: none; }
.ec-cards4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(16 * var(--u)); }
.ec-card { display: flex; flex-direction: column; gap: calc(8 * var(--u)); padding: calc(18 * var(--u)) calc(16 * var(--u)); min-width: 0; min-height: 44px; background: linear-gradient(180deg, rgba(30,22,14,.95), rgba(9,6,4,.95)); border: 1px solid var(--g-line2); }
.ec-card.on { border-color: var(--g-gold); box-shadow: inset 0 0 22px rgba(240,140,40,.25), 0 0 16px rgba(240,140,40,.3); }
.ec-card:disabled { opacity: .45; cursor: default; }
.ec-card-ico { width: max(40px, calc(64 * var(--u))); height: max(40px, calc(64 * var(--u))); display: flex; align-items: center; justify-content: center; border: 1px solid var(--g-edge); background: radial-gradient(circle at 50% 45%, rgba(224,112,42,.22), rgba(8,6,4,.8)); font: 700 max(16px, calc(28 * var(--u))) var(--g-disp); color: var(--g-gold); }
.ec-card-ico img { width: 78%; height: 78%; object-fit: contain; }
.ec-card h4 { margin: 0; font: 600 max(15px, calc(24 * var(--u))) var(--g-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--g-gold); }
.ec-card p { margin: 0; font: max(14px, calc(21 * var(--u))) var(--g-body); color: var(--g-text); }
.ec-card small { font: max(12px, calc(18 * var(--u))) var(--g-body); color: var(--g-dim); }
.ec-plates { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, calc(560 * var(--u))), 1fr)); gap: calc(12 * var(--u)); }
.ec-plates .gr-slot.gr-plate { width: 100%; }
.ec-plates .own { margin-left: auto; flex: none; font: max(13px, calc(19 * var(--u))) var(--g-body); color: var(--g-dim); padding-left: 10px; }
html.short .ec-cards4 { grid-template-columns: 1fr; }

const SLOTS = ['weapon', 'offhand', 'helm', 'armor', 'gloves', 'boots', 'ring', 'trinket'];
const SLOT_LBL = { weapon: 'Weapon', offhand: 'Offhand', helm: 'Head', armor: 'Chest', gloves: 'Hands', boots: 'Feet', ring: 'Ring', trinket: 'Trinket' };
const RARITY = { common: 'Common', uncommon: 'Uncommon', rare: 'Rare', epic: 'Epic', legendary: 'Legendary' };
const SIZES = { 169: [1920, 1080, 1], 219: [2580, 1080, 1], phone: [844, 390, 390 / 1080] };

/* ---------- data ---------- */
const ALL = [];
D.heroes.forEach((h) => h.items.forEach((it) => ALL.push(Object.assign(it, { heroName: h.name, heroLvl: h.lvl, col: h.cls }))));
D.bag.forEach((it) => ALL.push(Object.assign(it, { heroName: 'Bag', heroLvl: null, col: 'bag' })));
const byUid = {}; ALL.forEach((i) => (byUid[i.uid] = i));
const HERO = {}; D.heroes.forEach((h) => (HERO[h.cls] = h));
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const NUM = /\d+(?:\.\d+)?/g;
function diffText(b, a) {
  if (a == null) return esc(b);
  if (b === a) return esc(b);
  const nb = b.match(NUM) || [], na = a.match(NUM) || [];
  if (b.replace(NUM, '#') !== a.replace(NUM, '#') || nb.length !== na.length) return esc(b) + '<span class="ar">→</span>' + esc(a);
  let i = 0;
  return esc(a.replace(NUM, () => '\u0001' + i++ + '\u0002')).replace(/\u0001(\d+)\u0002/g, (_, k) => (nb[k] === na[k] ? nb[k] : '<span class="df"><s>' + nb[k] + '</s><span class="ar">→</span><b>' + na[k] + '</b></span>'));
}
const fnum = (n) => (Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10));
/* rows: every line of the item with before and after */
function rows(it) {
  const b = it.before, a = it.after, out = [];
  if (b.power != null) out.push({ k: 'Power', b: 'Power ' + fnum(b.power), a: a ? 'Power ' + fnum(a.power) : null, main: true });
  if (b.block != null) out.push({ k: 'Block', b: 'Block ' + fnum(b.block) + '%', a: a ? 'Block ' + fnum(a.block) + '%' : null, main: true });
  if (b.implicit) out.push({ k: 'impl', b: b.implicit, a: a ? a.implicit : null });
  b.aff.forEach((x, i) => out.push({ k: 'aff', b: x.text, a: a ? a.aff[i].text : null }));
  out.forEach((r) => (r.chg = r.a != null && r.a !== r.b));
  return out;
}
const firstChange = (it) => rows(it).find((r) => r.chg);
const gain = (it) => (it.after ? it.after.val - it.before.val : -1);
const reqUp = (it) => it.after && it.after.req !== it.before.req;
const short = (r) => '<span class="gp-aff">' + diffText(r.b, r.a) + '</span>';

/* ---------- pieces ---------- */
const img = (k) => IMG[k] || '';
const icoItem = (it) => '<span class="gp-ico"><img alt="" src="' + img('i/' + it.id) + '"></span>';
const slotLbl = (it) => '<div class="gp-lbl"><img alt="" src="' + img('s/' + it.slot) + '">' + SLOT_LBL[it.slot] + '</div>';
const face = (cls) => '<span class="ec-face' + (cls === 'bag' ? ' bag' : '') + '" style="background-image:url(' + img(cls === 'bag' ? 'bag' : 'a/' + cls) + ')"></span>';
const ilTxt = (it) => 'iL <b>' + it.before.ilvl + '</b>' + (it.after ? '<span class="ar">→</span><b class="to">' + it.after.ilvl + '</b>' : '');

/* today's plate (full lines, owner right) */
function plateNow(it) {
  const b = it.before;
  let main = '';
  if (b.power != null) main = '<span class="gp-main">Power <b>' + fnum(b.power) + '</b></span>';
  else if (b.block != null) main = '<span class="gp-main">Block <b>' + fnum(b.block) + '%</b></span>';
  const aff = b.aff.slice(0, 2).map((x) => '<span class="gp-aff">' + esc(x.text) + '</span>').join('');
  return '<button class="gr-slot gr-plate' + (it.blocked ? ' dim' : '') + '" style="--rc:' + it.color + '" data-uid="' + it.uid + '">' + icoItem(it) +
    '<div class="gr-slot-text gp-tx">' + slotLbl(it) + '<div class="gr-slot-name">' + it.name + '</div><div class="gp-l2">' + main + '<span class="gp-il">iL <b>' + b.ilvl + '</b></span>' + aff + '</div></div>' +
    (it.hero ? '<span class="own">' + HERO[it.hero].name + '</span>' : '') + '</button>';
}
/* new plate: iL a -> b and the first changed line */
function plateNew(it, on) {
  const c = firstChange(it);
  let l2 = '<span class="gp-il">' + ilTxt(it) + '</span>';
  if (it.blocked) l2 += '<span class="gp-why">' + (it.after ? 'Needs Lv ' + (it.after.req) : 'At region cap') + '</span>';
  else if (c) l2 += short(c);
  else l2 += '<span class="gp-aff">No stat change</span>';
  return '<button class="gr-slot gr-plate' + (on ? ' on' : '') + (it.blocked ? ' dim' : '') + '" style="--rc:' + it.color + '" data-uid="' + it.uid + '">' + icoItem(it) +
    '<div class="gr-slot-text gp-tx">' + slotLbl(it) + '<div class="gr-slot-name">' + it.name + '</div><div class="gp-l2">' + l2 + '</div></div></button>';
}
const plateEmpty = (slot) => '<button class="gr-slot gr-plate empty" style="--rc:#5b4a33" tabindex="-1"><span class="gp-ico"><img alt="" src="' + img('s/' + slot) + '"></span><div class="gr-slot-text gp-tx"><div class="gp-lbl">' + SLOT_LBL[slot] + '</div><div class="gr-slot-name">Empty</div></div></button>';

/* detail: one item, every line before -> after */
function detail(it, wide) {
  if (!it) return '<div class="dt"><div class="dt-note">Pick an item.</div></div>';
  const rs = rows(it);
  const anyChg = rs.some((r) => r.chg);
  const head = '<div class="dt-head" style="--rc:' + it.color + '"><span class="gp-ico big" style="--rc:' + it.color + '"><img alt="" src="' + img('i/' + it.id) + '"></span><div><div class="dt-name" style="--rc:' + it.color + '">' + it.name + '</div>' +
    '<div class="dt-sub">' + (it.hero ? HERO[it.hero].name + ' · ' : 'In the bag · ') + SLOT_LBL[it.slot] + ' · ' + RARITY[it.rarity] + '</div><div class="dt-il">' + ilTxt(it) + '</div></div></div>';
  const li = rs.map((r) => '<li class="' + (r.chg ? 'chg' : 'same') + '">' + diffText(r.b, r.a) + (it.after ? '<span class="tg">' + (r.chg ? 'up' : 'same') + '</span>' : '') + '</li>').join('');
  let foot = '';
  if (it.blocked) foot += '<div class="dt-block">' + esc(it.blocked) + '</div>';
  else {
    if (!anyChg) foot += '<div class="dt-note">No stat changes at this level; only the item level and requirement rise.</div>';
    if (reqUp(it)) foot += '<div class="dt-req">Level requirement ' + it.before.req + '<span class="ar">→</span><b class="to">' + it.after.req + '</b>' + (it.heroLvl ? ' (' + it.heroName + ' is Lv ' + it.heroLvl + ')' : '') + '</div>';
  }
  const st = ' style="--rc:' + it.color + '"';
  if (wide) return '<div class="dt wide"' + st + '><div class="dt-l">' + head + '</div><div class="dt-r"><ul class="dt-rows">' + li + '</ul>' + foot + '</div></div>';
  return '<div class="dt"' + st + '>' + head + '<ul class="dt-rows">' + li + '</ul>' + foot + '</div>';
}

/* ---------- chrome ---------- */
const CAMP_TABS = [['Rest', 'img', 'rest', false], ['Tend wounds', 'txt', '+', true], ['Sharpen', 'img', 'stone', false], ['Train', 'txt', 'XP', false]];
function tabs() {
  return '<div class="ct">' + CAMP_TABS.map((t) => '<button class="ct-b' + (t[0] === 'Sharpen' ? ' on' : '') + '"' + (t[3] ? ' disabled' : '') + '>' + (t[1] === 'img' ? '<img alt="" src="' + img(t[2]) + '">' : '<i>' + t[2] + '</i>') + '<span>' + t[0] + '</span></button>').join('') + '</div>';
}
function head(phone, withTabs) {
  return '<div class="gr-head"><h2 class="gr-title">Camp</h2>' + (phone && withTabs ? tabs() : '') + '<span class="ec-sub">Riverside Camp</span></div>';
}
function foot(sel, phone) {
  const why = !sel ? 'Pick an item first' : sel.blocked;
  return '<div class="ec-foot">' + (phone ? '' : '<span class="ec-note">One choice only: the camp is spent afterwards. You may leave and come back.</span>') +
    (why ? '<span class="ec-why">' + esc(why) + '</span>' : '') +
    '<button class="gr-btn">Gear</button><button class="gr-btn primary"' + (why ? ' disabled' : '') + '>Sharpen' + (sel && !phone ? ' · ' + sel.name : '') + '</button></div>';
}
function panel(phone, headHtml, body, f) { return '<div class="gr-panel">' + headHtml + '<div class="ec-body" style="overflow:hidden">' + body + '</div>' + f + '</div>'; }

/* ---------- state ---------- */
let V = { opt: 'a', size: '169' };
let S = {};
function reset() {
  S = { a: { hero: 'paladin', uid: null }, b: { uid: null }, c: { uid: null, all: false } };
  S.a.uid = HERO.paladin.items[0].uid;               // Great Mace
  S.b.uid = HERO.paladin.items[1].uid;               // Oak Tower Shield
  S.c.uid = null;                                     // first of the sorted list
  S.n = { uid: null };
}

/* ---------- screens ---------- */
function screenNow(phone) {
  const cards = [['Rest', 'rest', 'Every living hero recovers 50% max HP.', 'Whole company'], ['Tend wounds', '+', 'Heal one wound of a hero.', 'This hero has no wounds'], ['Sharpen', 'stone', 'Temper one item by one level for free.', 'Pick an item'], ['Train', 'XP', 'One hero gains bonus experience.', 'Pick a hero']];
  const cardsH = '<div class="ec-cards4">' + cards.map((c) => '<button class="ec-card' + (c[0] === 'Sharpen' ? ' on' : '') + '"' + (c[0] === 'Tend wounds' ? ' disabled' : '') + '><span class="ec-card-ico">' + (c[1].length > 2 ? '<img alt="" src="' + img(c[1]) + '">' : c[1]) + '</span><h4>' + c[0] + '</h4><p>' + c[2] + '</p><small>' + c[3] + '</small></button>').join('') + '</div>';
  // today's order: bag items first, then each hero's equipment in slot order (two columns fill row by row)
  const list = D.bag.concat(...D.heroes.map((h) => h.items));
  const sel = S.n.uid ? byUid[S.n.uid] : null;
  const body = '<div class="ec-fire"><img alt="" src="' + img('rest') + '"><p class="ec-rule">Make camp once. Choose one.</p></div>' + cardsH +
    '<h4 class="ec-lab">Sharpen · which item?</h4><div class="ec-plates">' + list.map((it) => plateNow(it).replace('class="gr-slot gr-plate', 'class="gr-slot gr-plate' + (sel && sel.uid === it.uid ? ' on' : ''))).join('') + '</div>';
  return '<div class="gr-panel">' + head(phone, false) + '<div class="ec-body" id="nowBody">' + body + '</div>' + foot(null, phone).replace('Sharpen', 'Choose') + '</div>';
}

function screenA(phone) {
  const st = S.a, h = HERO[st.hero], sel = byUid[st.uid];
  const nElig = (items) => items.filter((i) => !i.blocked).length;
  const heroBtn = (id, name, sub, cls, on) => '<button class="ec-hero' + (on ? ' on' : '') + '" data-hero="' + id + '">' + face(cls) + '<div class="ec-ht"><div class="ec-hn">' + name + '</div><div class="ec-hm">' + sub + '</div></div></button>';
  const rail = D.heroes.map((x) => heroBtn(x.cls, x.name, 'Lv ' + x.lvl + ' · ' + nElig(x.items) + (phone ? '' : ' to sharpen'), x.cls, x.cls === st.hero)).join('') + heroBtn('bag', 'Bag', D.bag.length + ' items', 'bag', st.hero === 'bag');
  let plates = '';
  if (st.hero === 'bag') plates = D.bag.map((it) => plateNew(it, it.uid === st.uid)).join('');
  else plates = SLOTS.map((s) => { const it = h.items.find((x) => x.slot === s); return it ? plateNew(it, it.uid === st.uid) : plateEmpty(s); }).join('');
  const title = (st.hero === 'bag' ? 'Bag' : h.name + ' · Lv ' + h.lvl);
  const body = (phone ? '' : '<h4 class="ec-lab">Sharpen · who gains most? <small>Tap a hero, then an item. Every plate already shows what +1 gives.</small></h4>') +
    '<div class="a-grid"><div class="a-rail">' + rail + '</div><div class="a-plates">' + plates + '</div><div class="a-detail">' + detail(sel, !phone) + '</div></div>';
  return '<div class="gr-panel">' + head(phone, true) + (phone ? '' : tabs()) + '<div class="ec-body" style="overflow:hidden">' + body + '</div>' + foot(sel, phone) + '</div>';
}

function screenB(phone) {
  const st = S.b, sel = byUid[st.uid];
  const heroes = D.heroes.concat([{ cls: 'bag', name: 'Bag', lvl: null, items: D.bag }]);
  let m = '';
  const at = (h, s) => h.items.find((x) => x.slot === s);
  const cell = (it, s) => {
    if (!it) return '<div class="mc none">' + (phone ? '<img alt="" src="' + img('s/' + s) + '">' : '<span class="ch">–</span>') + '</div>';
    const tag = it.blocked ? (it.after ? 'Lv ' + it.after.req : 'Cap') : '<b>' + it.before.ilvl + '</b><span class="ar">→</span><b class="to">' + it.after.ilvl + '</b>';
    return '<button class="mc' + (it.uid === st.uid ? ' on' : '') + (it.blocked ? ' dim' : '') + '" style="--rc:' + it.color + '" data-uid="' + it.uid + '" data-hov="1"><img alt="" src="' + img('i/' + it.id) + '"><span class="ch">' + tag + '</span></button>';
  };
  if (!phone) {
    m += '<div></div>' + heroes.map((h) => '<div class="mx-h">' + face(h.cls) + '<div>' + h.name + '<small>' + (h.lvl ? 'Lv ' + h.lvl : D.bag.length + ' items') + '</small></div></div>').join('');
    SLOTS.forEach((s) => { m += '<div class="mx-s"><img alt="" src="' + img('s/' + s) + '">' + SLOT_LBL[s] + '</div>' + heroes.map((h) => cell(at(h, s))).join(''); });
  } else {
    heroes.forEach((h) => { m += '<div class="mx-h">' + face(h.cls) + '<div>' + h.name + '<small>' + (h.lvl ? 'Lv ' + h.lvl : 'items') + '</small></div></div>' + SLOTS.map((s) => cell(at(h, s), s)).join(''); });
  }
  const body = (phone ? '' : '<h4 class="ec-lab">Sharpen · who gains most? <small>Each cell shows item level now → after. Hover or tap for every line.</small></h4>') +
    '<div class="b-grid"><div class="mx" id="mx">' + m + '</div><div class="b-side" id="bside">' + detail(sel, false) + '</div></div>';
  return '<div class="gr-panel">' + head(phone, true) + (phone ? '' : tabs()) + '<div class="ec-body" style="overflow:hidden">' + body + '</div>' + foot(sel, phone) + '</div>';
}

function screenC(phone) {
  const st = S.c;
  const ok = ALL.filter((i) => !i.blocked).sort((x, y) => gain(y) - gain(x) || x.name.localeCompare(y.name));
  const lock = ALL.filter((i) => i.blocked);
  const topN = 4, top = ok.slice(0, topN), rest = ok.slice(topN);
  if (!st.uid) st.uid = top[0].uid;
  const sel = byUid[st.uid];
  const who = (it) => '<span class="cr-who">' + face(it.col) + (it.hero ? HERO[it.hero].name + ' · Lv ' + it.heroLvl : 'Bag') + '</span>';
  const row = (it, kind) => {
    const c = firstChange(it);
    const open = it.uid === st.uid && kind === 'top';
    const rs = open ? '<div class="cr-more"><ul class="dt-rows">' + rows(it).map((r) => '<li class="' + (r.chg ? 'chg' : 'same') + '">' + diffText(r.b, r.a) + '</li>').join('') + '</ul>' + (reqUp(it) ? '<div class="dt-req">Level requirement ' + it.before.req + '<span class="ar">→</span><b class="to">' + it.after.req + '</b></div>' : '') + '</div>' : '';
    const main = kind === 'lock' ? esc(it.blocked) : c ? diffText(c.b, c.a) : 'No stat change';
    return '<div class="cr' + (open ? ' on' : '') + (kind === 'lock' ? ' lock' : '') + '" style="--rc:' + it.color + '"><button class="cr-top" data-uid="' + it.uid + '"' + (kind === 'lock' ? ' data-lock="1"' : '') + '>' + icoItem(it) +
      '<span class="cr-nm"><span class="gr-slot-name">' + it.name + '</span>' + who(it) + '</span><span class="cr-il">' + ilTxt(it) + '</span><span class="cr-main">' + main + '</span>' +
      (kind === 'lock' ? '<span class="cr-val"></span>' : '<span class="cr-val">+' + gain(it) + '<small>value</small></span>') + '</button>' + rs + '</div>';
  };
  const small = (it) => '<button class="cs' + (it.uid === st.uid ? ' on' : '') + '" style="--rc:' + it.color + '" data-uid="' + it.uid + '">' + icoItem(it) + '<span class="cs-n">' + it.name + '<small>' + (it.hero ? HERO[it.hero].name : 'Bag') + '</small></span><span class="cs-il">' + ilTxt(it) + '</span></button>';
  const noChg = rest.filter((i) => !firstChange(i)).length;
  const body = (phone ? '' : '<h4 class="ec-lab">Sharpen · biggest gain first <small>Sorted by item value gained. Every row shows what +1 gives.</small></h4>') +
    '<div class="c-list" id="clist">' + top.map((i) => row(i, 'top')).join('') +
    (lock.length ? '<h4 class="ec-lab" style="margin-top:6px">Cannot sharpen now · ' + lock.length + '</h4>' + lock.map((i) => row(i, 'lock')).join('') : '') +
    '<div><button class="c-all" data-all="1">All other items · ' + rest.length + ' <small>' + (st.all ? 'hide' : 'show') + (noChg ? ' · ' + noChg + ' without stat change' : '') + '</small></button></div>' +
    (st.all ? '<div class="c-all-g">' + rest.map(small).join('') + '</div>' : '') + '</div>';
  const sel2 = byUid[st.uid];
  return '<div class="gr-panel">' + head(phone, true) + (phone ? '' : tabs()) + '<div class="ec-body" style="overflow-y:auto">' + body + '</div>' + foot(sel2.blocked ? null : sel2, phone) + '</div>';
}

/* ---------- render ---------- */
const stage = document.getElementById('stage');
function layout() {
  const [W, H, u] = SIZES[V.size];
  const phone = V.size === 'phone';
  document.documentElement.classList.toggle('short', phone);
  stage.classList.toggle('new', V.opt !== 'now');
  const s = window.innerWidth / W;
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  stage.style.setProperty('--gu', u + 'px');
  stage.style.transform = 'scale(' + s + ')';
  const wrap = document.getElementById('wrap');
  wrap.style.width = '100%'; wrap.style.height = Math.ceil(H * s) + 'px';
  document.getElementById('tag').textContent = V.opt.toUpperCase() + ' · ' + V.size + ' · ' + W + 'x' + H;
}
function render() {
  const phone = V.size === 'phone';
  layout();
  const keep = (document.getElementById('clist') || {}).parentElement;
  const sc = keep ? keep.scrollTop : 0;
  stage.innerHTML = V.opt === 'now' ? screenNow(phone) : V.opt === 'a' ? screenA(phone) : V.opt === 'b' ? screenB(phone) : screenC(phone);
  const k2 = document.getElementById('clist'); if (k2) k2.parentElement.scrollTop = sc;
}
function parse() {
  const m = /^#(now|a|b|c)-(169|219|phone)$/.exec(location.hash);
  V = m ? { opt: m[1], size: m[2] } : { opt: 'a', size: '169' };
  reset(); render();
}
stage.addEventListener('click', (e) => {
  const t = e.target.closest('[data-uid],[data-hero],[data-all]');
  if (!t) return;
  if (t.dataset.all) { S.c.all = !S.c.all; return render(); }
  if (t.dataset.hero) { S.a.hero = t.dataset.hero; const h = t.dataset.hero === 'bag' ? D.bag : HERO[t.dataset.hero].items; S.a.uid = (h.find((i) => !i.blocked) || h[0]).uid; return render(); }
  const it = byUid[t.dataset.uid]; if (!it) return;
  if (V.opt === 'a') S.a.uid = it.uid; else if (V.opt === 'b') S.b.uid = it.uid; else if (V.opt === 'c') { if (t.dataset.lock) return; S.c.uid = it.uid; } else S.n.uid = it.uid;
  render();
});
stage.addEventListener('mouseover', (e) => {
  if (V.opt !== 'b') return;
  const t = e.target.closest('[data-hov]'); const side = document.getElementById('bside');
  if (t && side) side.innerHTML = detail(byUid[t.dataset.uid], false);
});
stage.addEventListener('mouseleave', () => { const side = document.getElementById('bside'); if (V.opt === 'b' && side) side.innerHTML = detail(byUid[S.b.uid], false); });
window.addEventListener('hashchange', parse);
window.addEventListener('resize', layout);
parse();
</script>
</body>
</html>
