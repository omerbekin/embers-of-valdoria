<title>Valdoria Map Variants</title>
<!--
  Valdoria haritası yerleşim TASLAKLARI (campaign-dev, 2026-10-10; Ömer seçimi için). Oyun kodu DEĞİL, oyun verisine dokunmaz.
  Belge: docs/design/campaign/valdoria-2x.md (bölüm "Yayılmış varyantlar"). Sayfa canlı sefer haritasını taklit eder: dünya birimi
  (eski 16:9 harita bölgesi = 1920 x 1080), sahne yüksekliği 1080 birim, yakınlaştırma 1,0-1,4 (src/game/map-view.ts), düğüm yarıçapı 24
  (boss 30), boyalı düğüm ikonları (assets/misc-icons/node), ad 15 birim Cinzel, dokunma alanı 96 birim çap, HUD sütunları / üst bant /
  alt kontroller CampaignMapScene.renderHud ölçüleriyle. Yazı çakışmaları sayfada GERÇEK yazı genişliğiyle ölçülür (sol panel).
  3. tur (2026-10-11): Ömer A'yı seçti; kaydırma her yakınlaştırmada açık. Varyantlar: 1 Current, 4 Spread A, A1 / A2 / A3 (A + kuzeye
  uzanan yol, final boss dağlarda). HUD ölçümü: kamera her düğüme ortalanınca (21:9 çerçevede sınırlanarak) 1,0-1,4x'te o düğüm ve
  seçilebilir sonraki düğümleri; 16:9, 21:9 ve telefon (844 x 390, compact HUD, 24 birim ad). Düğüme tıkla = bulunulan düğüm.
-->
<style>
@font-face { font-family: 'Cinzel'; font-weight: 400 900; font-display: block; src: url('valdoria-map/fonts/Cinzel-normal-latin.woff2') format('woff2'); }
@font-face { font-family: 'EB Garamond'; font-weight: 400 800; font-display: block; src: url('valdoria-map/fonts/EBGaramond-normal-latin.woff2') format('woff2'); }
@font-face { font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: block; src: url('valdoria-map/fonts/EBGaramond-italic-latin.woff2') format('woff2'); }
:root { color-scheme: dark; --gold: 217,178,106; --on: #f3d999; --txt: #d9c8a2; --muted: #a8977a; --dim: #7d705a; --ember: #e0702a; --ember2: #ffb35a;
  --cin: Cinzel, Georgia, serif; --gar: 'EB Garamond', Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #050403; color: var(--txt); font-family: var(--gar); overflow: hidden; touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#map.drag { cursor: grabbing; }
.edge { fill: none; stroke: rgba(242,220,170,.8); stroke-width: 3; stroke-linecap: round; }
.edge.dash { stroke-dasharray: 10 9; }
.disc { fill: rgba(20,14,9,.95); stroke: rgba(var(--gold),.7); stroke-width: 1.5; }
.node.big .ring2 { fill: none; stroke: rgba(255,179,90,.7); stroke-width: 1; }
.node.new .disc { stroke: var(--ember2); stroke-width: 2.5; }
.lbl { font: 600 15px var(--cin); letter-spacing: .06em; text-transform: uppercase; fill: var(--txt); paint-order: stroke; stroke: rgba(8,5,3,.95); stroke-width: 5px; stroke-linejoin: round; }
.lblbg { fill: rgba(0,0,0,.42); }
.startTag { font: 600 12px var(--cin); letter-spacing: .2em; fill: var(--muted); paint-order: stroke; stroke: rgba(8,5,3,.9); stroke-width: 4px; }
.node { cursor: pointer; }
.node:hover .disc { stroke: var(--on); stroke-width: 2.5; }
.hit { fill: transparent; }
.showHit .hit { fill: rgba(120,200,255,.10); stroke: rgba(120,200,255,.45); stroke-width: 1; stroke-dasharray: 3 3; }
.coll .lblbox { fill: none; stroke: #ff4a3a; stroke-width: 2; }
.coll.hudbad .lblbox, .hudbad .lblbox { fill: none; stroke: #4ab0ff; stroke-width: 2; stroke-dasharray: 5 3; }
.lblbox { fill: none; stroke: none; }
.phone .lbl { font-size: 24px; stroke-width: 7px; }
.lbl.hide { display: none; }
.mark { fill: none; stroke: none; }
.node.opt .mark { stroke: var(--ember2); stroke-width: 2; stroke-dasharray: 5 4; }
.node.sel .mark { fill: rgba(255,179,90,.16); stroke: var(--ember2); stroke-width: 3; stroke-dasharray: none; }
.node.cur .mark { stroke: #fbe7b0; stroke-width: 3.5; stroke-dasharray: none; }
.phone .startTag { font-size: 18px; }
/* HUD taklidi (sahne birimi; JS ölçekler) */
#hud { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
#hud.off { display: none; }
.hud-shade { position: absolute; top: 0; }
.hud-panel { position: absolute; border: 1px solid rgba(var(--gold),.3); background: linear-gradient(180deg, rgba(24,17,11,.82), rgba(10,7,5,.82)); }
.hud-panel h5 { margin: 0; padding: 14px 18px 6px; font: 600 14px var(--cin); letter-spacing: .24em; color: rgba(var(--gold),.85); text-transform: uppercase; }
.hud-panel p { margin: 0; padding: 0 18px; font: italic 17px var(--gar); color: var(--muted); }
.hud-title { position: absolute; left: 48px; top: 22px; font: 600 30px var(--cin); letter-spacing: .12em; color: #fbe7b0; text-transform: uppercase; white-space: nowrap; }
.hud-title span { font: italic 19px var(--gar); letter-spacing: 0; color: var(--muted); text-transform: none; margin-left: 8px; }
.hud-ctrl { position: absolute; display: flex; gap: 12px; align-items: center; pointer-events: auto; }
.hud-ctrl button { all: unset; width: 52px; height: 52px; display: grid; place-items: center; cursor: pointer; font: 600 24px var(--cin); color: var(--on); border: 1px solid rgba(var(--gold),.4); background: rgba(10,7,5,.85); }
.hud-ctrl i { font: 600 12px var(--cin); letter-spacing: .24em; color: var(--dim); font-style: normal; width: 60px; text-align: center; }
.hud-menu { position: absolute; top: 18px; font: 600 16px var(--cin); letter-spacing: .14em; color: var(--txt); border: 1px solid rgba(var(--gold),.35); padding: 8px 16px; background: rgba(10,7,5,.7); }
/* Taslak araçları (oyunda yok): kor rengi çerçeve */
#bar { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); display: flex; gap: 4px; z-index: 20; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); }
#bar button, #tools button { all: unset; cursor: pointer; padding: 7px 11px; font: 600 12px var(--cin); letter-spacing: .08em; color: var(--muted); background: rgba(10,7,5,.92); border: 1px solid rgba(255,179,90,.45); white-space: nowrap; }
#bar button.on, #tools button.on { color: #1a0f06; background: var(--ember); border-color: var(--ember2); }
#tools { position: fixed; left: 50%; top: 40px; transform: translateX(-50%); display: flex; gap: 4px; z-index: 20; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); }
#stats { position: fixed; left: 8px; top: 18vh; z-index: 20; /* Party sütununun yerinde: harita içeriğini örtmez */ padding: 8px 12px; background: rgba(10,7,5,.92); border: 1px solid rgba(255,179,90,.45); font-size: 14px; line-height: 1.35; max-width: 300px; }
#stats b { font: 600 11px var(--cin); letter-spacing: .14em; color: var(--on); }
#stats .bad { color: #ff7a63; } #stats .ok { color: #9ad08a; }
#stats small { color: var(--muted); }
#tip { position: fixed; pointer-events: none; z-index: 30; min-width: 200px; max-width: 320px; padding: 10px 14px; background: linear-gradient(180deg, rgba(30,22,14,.97), rgba(12,9,6,.97)); border: 1px solid rgba(var(--gold),.5); box-shadow: 0 10px 28px rgba(0,0,0,.6); display: none; }
#tip b { display: block; font: 600 16px var(--cin); letter-spacing: .06em; color: var(--on); }
#tip i { display: block; font-size: 15px; color: var(--muted); }
#tip span { display: block; font-size: 15px; margin-top: 4px; }
@media (max-width: 900px), (max-height: 500px) { #bar, #tools { gap: 2px; } #bar button, #tools button { padding: 3px 5px; font-size: 8px; letter-spacing: .02em; } #tools { top: 26px; } #stats { font-size: 9px; line-height: 1.25; max-width: 190px; padding: 4px 6px; } #stats small { display: none; } }
</style>

"to":"9"},{"from":"9","to":"10"},{"from":"10","to":"11A"},{"from":"10","to":"11B"},{"from":"11A","to":"12"},{"from":"11B","to":"12"}],"start":"1"},"v4":{"nodes":[{"id":"mill","name":"Mill Road","type":"battle","sub":"Start · Battle · tutorial (unchanged)","w":[280,914],"tut":true},{"id":"raven","name":"Ravenwood","type":"battle","sub":"Battle · Outlaw Pack · tutorial (unchanged)","w":[530,785],"tut":true},{"id":"watch","name":"Ruined Watchtower","type":"elite","sub":"Elite · Bandit Chief · tutorial (unchanged)","w":[651,638],"tut":true,"label":"above"},{"id":"ash","name":"Ashford Village","type":"town","sub":"Town · Rest, Recruits · tutorial (unchanged)","w":[795,694],"tut":true},{"id":"iron","name":"Iron Pass","type":"battle","sub":"Battle · Ambush","w":[870,470],"terrain":"pass between the two snow peaks"},{"id":"mine","name":"Dwarven Mine","type":"treasure","sub":"Treasure · Guarded","w":[1040,413],"terrain":"east slope of the snow peak","label":"above"},{"id":"marsh","name":"Misty Marsh","type":"battle","sub":"Battle · Bog Ambush","w":[870,845],"terrain":"marsh pools"},{"id":"witch","name":"Witch's Hut","type":"event","sub":"Event · Cursed Merchant","w":[975,737],"terrain":"marsh edge"},{"id":"valdren","name":"Valdren Keep","type":"town","sub":"City · Rest, Recruits","w":[1050,583],"terrain":"fields by the river","label":"above"},{"id":"pilgrim","name":"Pilgrim Road","type":"battle","sub":"Battle · Highwaymen","w":[1150,435],"terrain":"road under the forest"},{"id":"abbey","name":"St. Brann's Abbey","type":"treasure","sub":"Treasure · Relic Vault","w":[1261,254],"terrain":"mountain abbey"},{"id":"cath","name":"Black Cathedral","type":"elite","sub":"Elite · The Undying","w":[1095,692],"terrain":"fields","label":"above"},{"id":"grave","name":"Grave Field","type":"battle","sub":"Battle · Graveyard","w":[1200,571],"terrain":"fields"},{"id":"river","name":"Riverside Camp","type":"rest","sub":"Rest point · before the boss","w":[1319,550],"terrain":"river bank","label":"above"},{"id":"bridge","name":"King's Bridge","type":"boss","sub":"Boss · The Bridge Warden","w":[1300,678],"terrain":"ON the river (the crossing)"},{"id":"ashen","name":"Ashen Plain","type":"battle","sub":"Battle · Cursed Ground","w":[1460,790],"terrain":"open grass east of the river"},{"id":"thorn","name":"Thornwood Hollow","type":"elite","sub":"Elite · hidden lair (was Dragon's Spine)","w":[1320,880],"terrain":"south-east forest"},{"id":"cache","name":"Hermit's Cache","type":"treasure","sub":"Treasure · unguarded chest (was Ice Cave)","w":[1480,933],"terrain":"forest"},{"id":"siege","name":"Siege Line","type":"battle","sub":"Battle","w":[1620,780],"terrain":"grass"},{"id":"camp","name":"Forward Camp","type":"merchant","sub":"Merchant · last supplies","w":[1790,790],"terrain":"grass"},{"id":"gate","name":"Gate of Cinders","type":"battle","sub":"Battle · castle gate","w":[1649,905],"terrain":"forest edge"},{"id":"castle","name":"Castle Morvane","type":"boss","sub":"Final Boss","w":[1801,927],"terrain":"eastern moor"}],"edges":[{"from":"mill","to":"raven"},{"from":"raven","to":"watch"},{"from":"watch","to":"ash"},{"from":"ash","to":"iron"},{"from":"iron","to":"mine"},{"from":"mine","to":"valdren"},{"from":"ash","to":"marsh"},{"from":"marsh","to":"witch"},{"from":"witch","to":"valdren"},{"from":"valdren","to":"pilgrim"},{"from":"pilgrim","to":"abbey"},{"from":"abbey","to":"river"},{"from":"valdren","to":"cath"},{"from":"cath","to":"grave"},{"from":"grave","to":"river"},{"from":"river","to":"bridge"},{"from":"bridge","to":"ashen"},{"from":"ashen","to":"thorn"},{"from":"thorn","to":"cache"},{"from":"cache","to":"gate"},{"from":"ashen","to":"siege"},{"from":"siege","to":"camp"},{"from":"camp","to":"gate"},{"from":"gate","to":"castle"}],"start":"mill"}};
// ---- A1 / A2 / A3 (Ömer 2026-10-11: A tabanı; Forward Camp'tan kuzeye 3-6 yeni düğüm, final boss dağlarda; kaydırma her yakınlaştırmada açık)
// Ortak güneydoğu: Ashen Plain -> [Siege Line | Thornwood Hollow] -> Forward Camp (birleşme). Hermit's Cache, Gate of Cinders ve
// Castle Morvane kuzeye, dağlara taşınır; yeni düğümler "new: true" (kor çerçeve).
(() => {
  const A = VARIANTS.v4;
  const keep = A.nodes.filter((n) => !['cache', 'gate', 'castle'].includes(n.id)).map((n) => ({ ...n }));
  const thorn = keep.find((n) => n.id === 'thorn'); thorn.w = [1600, 905]; thorn.terrain = 'south-east forest (east end)';
  const siege = keep.find((n) => n.id === 'siege'); siege.w = [1610, 745]; siege.terrain = 'grass at the forest edge';
  const baseEdges = A.edges.filter((e) => !['thorn>cache', 'cache>gate', 'camp>gate', 'gate>castle'].includes(e.from + '>' + e.to))
    .concat([{ from: 'thorn', to: 'camp' }]);
  const N = (id, name, type, sub, w, terrain, extra = {}) => ({ id, name, type, sub, w, terrain, ...extra });
  const cache = (w, terrain, extra) => N('cache', "Hermit's Cache", 'treasure', "Treasure · hermit's hoard (moved north from the forest)", w, terrain, extra);
  const gate = (w, terrain, extra) => N('gate', 'Gate of Cinders', 'battle', 'Battle · gate of the castle road (moved north)', w, terrain, extra);
  const castle = (w, terrain, extra) => N('castle', 'Castle Morvane', 'boss', 'Final Boss (moved into the mountains)', w, terrain, extra);
  const E = (...pairs) => pairs.map(([from, to]) => ({ from, to }));
  const mk = (nodes, edges) => ({ nodes: keep.concat(nodes), edges: baseEdges.concat(E(...edges)), start: 'mill' });
  // A1: düz tırmanış (3 yeni): Forward Camp -> Ember Road -> Shepherd's Fold -> Riverhead -> Gate of Cinders -> Castle Morvane
  // (Hermit's Cache haritadan çıkar: kolu birleşmeyle kalktı; yeri olmayan 6. düğüm telefonda sığmadı)

  ], [['camp', 'road'], ['road', 'fold'], ['fold', 'head'], ['head', 'gate'], ['gate', 'castle']]);
  // A2: çatal ve birleşme (4 yeni): Ember Road -> [Greywater Ford -> Hermit's Cache | Shepherd's Fold -> Frostfall Ridge] -> Gate -> Castle
  VARIANTS.a2 = mk([
    N('road', 'Ember Road', 'battle', 'Battle · raiders on the road north', [1765, 670], 'grass, the road north from the camp', { new: true }),
    N('ford', 'Greywater Ford', 'battle', 'Battle · fight in the shallows', [1630, 555], "ON the river (the crossing, like King's Bridge)", { new: true }),

  ], [['camp', 'road'], ['road', 'ford'], ['ford', 'cache'], ['road', 'fold'], ['fold', 'frost'], ['cache', 'gate'], ['frost', 'gate'], ['gate', 'castle']]);
  // A3: iki yollu tırmanış (5 yeni): Forward Camp'ta ayrılır, yalnızca Gate of Cinders'ta birleşir
  VARIANTS.a3 = mk([
    N('ford', 'Greywater Ford', 'battle', 'Battle · fight in the shallows', [1615, 590], "ON the river (the crossing, like King's Bridge)", { new: true }),

const META = {
  v1: { key: '1', name: 'Current', note: "Today's live Valdoria (data/campaign/valdoria.json), positions as in the game." },
  v4: { key: '4', name: 'Spread A', note: 'Base chosen by Ömer (2026-10-11): 22 stops, 3 choices, tutorial = today, final boss on the eastern moor. For comparison.' },

// Dünya: eski 16:9 harita bölgesi = 0..1920 x 0..1080; geniş görsel bu bölgeye göre yerleşir (valdoria.json > backgroundWide.region)
const REG = [0.08229, 0.00077, 0.79804, 0.94083];
const IMG = { w: 1920 / (REG[2] - REG[0]), h: 1080 / (REG[3] - REG[1]) };
IMG.x = -REG[0] * IMG.w; IMG.y = -REG[1] * IMG.h;
const FRAME = { left: Math.min(0, IMG.x), right: Math.max(1920, IMG.x + IMG.w), top: Math.min(0, IMG.y), bottom: Math.max(1080, IMG.y + IMG.h) };

const VKEYS = Object.keys(META);
const hashV = () => { const h = location.hash.slice(1).toLowerCase(); return VKEYS.includes(h) ? h : null; };
// cur = bulunulan düğüm (kamera ona ortalanır, canlı haritadaki gibi), sel = seçili sonraki durak
const state = { v: hashV() || 'a1', z: 1, mid: { x: 960, y: 540 }, overview: false, hud: true, phone: false, relevant: true, hit: false, coll: true, cur: null, sel: null };
const graph = (V) => { const out = {}, inn = {}; for (const e of V.edges) { (out[e.from] ??= []).push(e.to); (inn[e.to] ??= []).push(e.from); } return { out, inn }; };
const byId = (V) => Object.fromEntries(V.nodes.map((n) => [n.id, n]));

function resetCur() { const V = VARIANTS[state.v]; state.cur = V.start; state.sel = graph(V).out[V.start]?.[0] ?? null; centreOn(state.cur); }
function relevantSet(V, cur = state.cur, sel = state.sel) { const s = new Set([cur, ...(graph(V).out[cur] ?? [])]); if (sel) s.add(sel); return s; }

// ---------------------------------------------------------------- çizim
let world, layer;

// Yazı çakışması: yazı-yazı (6 birim pay), yazı-dokunma alanı, iki dokunma alanı iç içe

function analyse() {

// Canlı görünüm: HUD altına giren düğümler mavi kesik, çakışan adlar kırmızı çerçeve

const tools = document.getElementById('tools');
const tool = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; tools.append(b); return b; };
tool('Centre on current', () => { centreOn(state.cur); sync(); camera(); });
tool('March ▸', () => { const { out } = graph(VARIANTS[state.v]); if (!state.sel) return; state.cur = state.sel; state.sel = out[state.cur]?.[0] ?? null; centreOn(state.cur); draw(); });
tool('Restart', () => { resetCur(); state.z = 1; sync(); draw(); });
const toggles = [
  ['overview', 'Overview (not in game)'], ['hud', 'HUD overlay'], ['phone', 'Phone labels 24'], ['relevant', 'Phone: names of current + next only'], ['hit', 'Tap areas'], ['coll', 'Mark collisions'],
];
for (const [k, label] of toggles) {
  const b = document.createElement('button'); b.textContent = label; b.dataset.k = k;
  b.onclick = () => { state[k] = !state[k]; sync(); if (k === 'phone' || k === 'hit' || k === 'relevant') draw(); else camera(); };
  tools.append(b);
}
function sync() {
  bar.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.v));
  tools.querySelectorAll('button[data-k]').forEach((b) => b.classList.toggle('on', !!state[b.dataset.k]));
}
addEventListener('hashchange', () => { const h = hashV(); if (h && h !== state.v) { state.v = h; resetCur(); sync(); draw(); } });
resetCur();
sync();
document.fonts.ready.then(draw);
</script>
</body>
</html>
