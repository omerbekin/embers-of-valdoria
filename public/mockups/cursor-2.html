<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta name="darkreader-lock" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cursor Mockups 2</title>
<!-- TASLAK (ui-dev, 2026-11-01). Oyun kodu DEGIL. Imlecler SVG ile cizilmis taslaktir.
     Adres: #now | #1..#5 ; &z=169 | 219 ; &bg=ember | sunny ; &mk=0 (isaretleri gizle). Ornek: #3&z=219&bg=sunny -->
<style>
@font-face { font-family: Cinzel; font-weight: 400 900; font-display: swap; src: url('cursor-2/Cinzel-normal-latin.woff2') format('woff2'); }
@font-face { font-family: 'EB Garamond'; font-weight: 400 800; font-display: swap; src: url('cursor-2/EBGaramond-normal-latin.woff2') format('woff2'); }
* { box-sizing: border-box; }
:root { --g-text: #d9c8a2; --g-dim: #a8977a; --g-gold: #f3d999; --g-line: rgba(217,178,106,.16); --g-line2: rgba(217,178,106,.3); --g-edge: rgba(217,178,106,.42); --g-disp: Cinzel, Georgia, serif; --g-body: 'EB Garamond', Georgia, serif; --ember: #e0702a; --ember2: #ffb35a; }
html, body { margin: 0; background: #070504; color: var(--g-text); font-family: var(--g-body); font-style: normal; }
body { padding: 0 0 24px; }
.top { padding: 8px 14px 6px; border-bottom: 1px solid var(--g-line2); background: #0b0806; }
.row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.ttl { font: 600 15px var(--g-disp); letter-spacing: .14em; text-transform: uppercase; color: var(--g-gold); margin-right: 8px; }
.grp { display: flex; gap: 4px; align-items: center; }
.sep { width: 1px; height: 22px; background: var(--g-line2); margin: 0 4px; }
.btn { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 system-ui, sans-serif; letter-spacing: .04em; color: #f3d999; background: #1b120a; border: 1px solid rgba(224,112,42,.45); padding: 7px 10px; text-decoration: none; min-height: 28px; }
.btn.on { background: var(--ember); color: #1a0f06; border-color: var(--ember); }
.btn i { font: 700 9px system-ui, sans-serif; font-style: normal; padding: 2px 4px; background: var(--ember); color: #1a0f06; letter-spacing: .08em; }
.btn.on i { background: #1a0f06; color: var(--ember2); }
.line { margin: 6px 0 0; font: 17px/1.3 var(--g-body); }
.line b { font: 600 15px var(--g-disp); letter-spacing: .08em; text-transform: uppercase; color: var(--g-gold); }
.line .ph { color: var(--g-dim); font-size: 15px; white-space: nowrap; }
.line .rec { font: 700 10px system-ui, sans-serif; letter-spacing: .1em; padding: 2px 6px; background: var(--ember); color: #1a0f06; margin: 0 6px; vertical-align: middle; }
.main { padding: 10px 14px 0; }
.scenes { display: grid; gap: 12px; }
.cap { font: 600 11px system-ui, sans-serif; letter-spacing: .08em; color: var(--ember2); text-transform: uppercase; margin: 0 0 4px; }
.wrap { position: relative; overflow: hidden; border: 1px solid var(--g-line2); background: #000; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
.marks { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.mk { position: absolute; }
.mk img.cu { position: absolute; display: block; }
.mk .hs { position: absolute; width: 5px; height: 5px; margin: -2px 0 0 -2px; border: 1px solid #4fd1ff; border-radius: 50%; background: rgba(79,209,255,.35); }
.mk .lb { position: absolute; white-space: nowrap; font: 600 10px/1.2 system-ui, sans-serif; color: #ffd99a; background: rgba(8,5,3,.85); border: 1px solid rgba(224,112,42,.5); padding: 1px 4px; }
/* ---- game look (battle) ---- */
.cell { position: absolute; width: 190px; height: 48px; margin: -24px 0 0 -95px; border: 1.5px solid rgba(217,178,106,.55); background: rgba(217,178,106,.09); border-radius: 50%; }
.cell.en { border-color: rgba(200,90,70,.6); background: rgba(200,90,70,.09); }
.spr { position: absolute; height: 310px; transform: translateX(-50%); filter: drop-shadow(0 6px 6px rgba(0,0,0,.5)); }
.hit { position: absolute; width: 220px; margin-left: -110px; }
.bar { position: absolute; display: flex; gap: 8px; justify-content: center; }
.eb { font: 600 26px var(--g-disp); letter-spacing: .12em; text-transform: uppercase; color: var(--g-gold); padding: 14px 30px; border: 1px solid var(--g-edge); background: linear-gradient(180deg, rgba(24,17,10,.88), rgba(9,6,4,.88)); text-shadow: 0 1px 2px #000; }
.eb.off { opacity: .45; color: var(--g-dim); }
.eb.pri { border-color: var(--ember); }
/* ---- game look (merchant) ---- */
.bgimg { position: absolute; inset: 0; background: #120d09 url('cursor-2/town.webp') center / cover; }
.ov { position: absolute; inset: 0; background: rgba(5,3,2,.72); }
.panel { position: absolute; top: 14px; bottom: 20px; padding: 16px 32px 26px; background: linear-gradient(180deg, rgb(30,22,14), rgb(12,9,6)); border: 1px solid var(--g-edge); box-shadow: 0 0 0 3px rgba(8,6,4,.7), 0 18px 40px rgba(0,0,0,.6); }
.ph1 { font: 600 30px var(--g-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--g-gold); }
.phs { font: 20px var(--g-body); color: var(--g-dim); }
.plate { position: absolute; display: flex; align-items: center; gap: 16px; height: 96px; padding: 8px 16px 8px 8px; background: linear-gradient(180deg, rgba(24,17,10,.9), rgba(9,6,4,.9)); border: 1px solid color-mix(in srgb, var(--rc) 60%, rgba(217,178,106,.3)); box-shadow: inset 0 0 26px color-mix(in srgb, var(--rc) 16%, transparent), 0 0 0 2px rgba(8,6,4,.6); }
.plate::before, .plate::after { content: ''; position: absolute; width: 10px; height: 10px; transform: rotate(45deg); background: #130d07; border: 1px solid color-mix(in srgb, var(--rc) 70%, #fff); }
.plate::before { left: -6px; top: -6px; } .plate::after { right: -6px; bottom: -6px; }
.plate.dim { opacity: .55; }
.plate img.ic { width: 78px; height: 78px; object-fit: contain; background: rgba(0,0,0,.4); border: 1px solid var(--g-line2); }
.plate .nm { font: 600 22px var(--g-disp); letter-spacing: .05em; text-transform: uppercase; color: #e8dcc0; white-space: nowrap; }
.plate .sb { font: 19px var(--g-body); color: var(--g-dim); white-space: nowrap; }
.plate .pr { margin-left: auto; display: flex; align-items: center; gap: 8px; font: 600 24px var(--g-disp); color: var(--g-gold); }
.plate .pr img { width: 28px; height: 28px; }
.plate.empty { border-style: dashed; border-color: var(--g-line2); box-shadow: none; opacity: .8; }
.plate.empty::before, .plate.empty::after { display: none; }
.plate.hl { border-color: var(--ember); box-shadow: 0 0 0 2px rgba(224,112,42,.4), inset 0 0 26px rgba(224,112,42,.2); }
.av { position: absolute; object-fit: contain; filter: drop-shadow(0 6px 8px rgba(0,0,0,.6)); }
/* ---- enlarged sheet ---- */
.sheet { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; }
.sc { padding: 6px 8px 8px; border: 1px solid var(--g-line); background: rgba(20,14,9,.6); }
.sc .sn { font: 600 12px var(--g-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--g-gold); margin-bottom: 4px; }
.sc .sn small { display: block; font: 12px var(--g-body); letter-spacing: 0; text-transform: none; color: var(--g-dim); }
.pair { display: flex; gap: 4px; }
.sw { position: relative; display: flex; align-items: center; justify-content: center; }
.sw.dk { background: #14100c; } .sw.br { background: #efe6cf; }
.sw.big { width: 112px; height: 112px; } .sw.sm { width: 56px; height: 44px; margin-top: 4px; }
.sw .cu { display: block; }
.sw .hs { position: absolute; width: 5px; height: 5px; margin: -2px 0 0 -2px; border: 1px solid #4fd1ff; border-radius: 50%; background: rgba(79,209,255,.35); }
</style>
</head>
<body>
<div class="top">
  <div class="row1" id="bar"></div>
  <div class="line" id="line"></div>
</div>
<div class="main">
  <div class="scenes" id="scenes"></div>
  <div class="cap" style="margin-top:10px">Enlarged states (3x) on dark and bright, then real size (1x)</div>
  <div class="sheet" id="sheet"></div>
</div>
<script src="cursor-2/app.js"></script>
</body>
</html>
