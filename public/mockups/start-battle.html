<!--
  "START BATTLE?" onay penceresi taslağı (ui-dev, 2026-10-18). Oyun kodu DEĞİL; yalnızca seçim için. Görünüm oyunla aynı CSS'ten
  (unified-inventory/css: style.css, elegant.css, gear.css), gerçek mob / kahraman portreleri, düğüm ikonları, Valdoria haritası.
  Adresler: #v1..#v5 &enc=battle|elite|boss|town (town = savaşsız düğüm örneği, yalnız v3)  &fork (yol kapanır uyarısı)  &clean (şeridi gizle; H tuşu aç/kapa)
    v1 Classic   bugünkü pencere + düşman portreleri (elit / boss işareti, Lv), "Then" satırı ikonlu, Cancel + Fight
    v2 Versus    sol takımın, sağda düşmanlar, ortada VS; yalnız Fight (kapatma = sağ üst X)
    v3 Anchored  düğümün yanında küçük kart (harita parlak kalır); "Then" ve "yollar kapanır" satırları YOK (Ömer), yerine var olan oyun metninden tek bilgi satırı; yalnız Fight + X
    v4 Dossier   sağdan yan sayfa: lider büyük portre, eşlikçiler, yol (bu savaş -> sonraki durak)
    v5 Banner    altta ince şerit: düğüm | düşmanlar | Then | Fight
  Veri: valdoria.json düğümü (ad, alt başlık, tür, konum), encounters.json düşmanları (ad, elit/boss), nodeLevel (Lv), outgoing (Then).
  Takım satırı (v2) ÖRNEK durumdur: gerçekte sefer takımından (sınıf, level, can oranı) gelir.
-->
