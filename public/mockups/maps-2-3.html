<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta name="darkreader-lock" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Campaign maps II and III: node layout</title>
<!-- HARITA 2 / 3 DUGUM YERLESIMI taslagi (ui-dev, 2026-10-21). Oyun kodu DEGIL. Adres: #v1 = Harita 2 (The Drowned Reach) | #v2 = Harita 3 (The Hollow Crown); &clean = etiketsiz, &nonames = adsiz. Veri: maps-2-3/data.js -->
<link rel="stylesheet" href="maps-2-3/band-tip.css" />
<link rel="stylesheet" href="maps-2-3/m.css" />
</head>
<body>
<div class="pg">
  <div class="top">
    <h1 id="ttl"></h1>
    <div class="tools">
      <button class="tog on" data-t="names" type="button" title="Show or hide node names">Names</button>
      <button class="tog on" data-t="nums" type="button" title="Show or hide node numbers">Numbers</button>
      <button class="tog on" data-t="reg" type="button" title="Show or hide region labels">Regions</button>
    </div>
    <div class="tabs">
      <button class="tab" data-v="m2" type="button">Map II · Drowned Reach</button>
      <button class="tab" data-v="m3" type="button">Map III · Hollow Crown</button>
    </div>
  </div>
  <div class="stage" id="stage"><div class="tipbox" id="tip"></div></div>
  <div class="legend" id="legend"></div>
  <div class="stats" id="stats"></div>
</div>
<div class="mockstrip">Mockup · not the game</div>
<script src="maps-2-3/data.js"></script>
<script src="maps-2-3/m.js"></script>
</body>
</html>
