<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta name="darkreader-lock" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Campaign maps I-III</title>
<!-- HARITA 1 / 2 / 3 BOLGE BAZLI YAKINLASMA taslagi (ui-dev, 2026-10-21). Oyun kodu DEGIL. Adres: #v0 = Harita 1 (Valdoria) | #v1 = Harita 2 (The Drowned Reach) | #v2 = Harita 3 (The Hollow Crown); &r=II = o bolgeye yakin acilir (ornek #v1&r=III); &clean = adsiz ve numarasiz, &nonames = adsiz. Veri: maps-2-3/data.js -->
<link rel="stylesheet" href="maps-2-3/band-tip.css" />
<link rel="stylesheet" href="maps-2-3/m.css" />
</head>
<body>
<div class="pg">
  <div class="top">
    <h1 id="ttl"></h1>
    <div class="tools">
      <button class="tog on" data-t="names" type="button" title="Show or hide node names">Names</button>
      <button class="tog on" data-t="nums" type="button" title="Show or hide node numbers">Numbers</button>
    </div>
    <div class="tabs">
      <button class="tab" data-v="m1" type="button">Map I · Valdoria</button>
      <button class="tab" data-v="m2" type="button">Map II · Drowned Reach</button>
      <button class="tab" data-v="m3" type="button">Map III · Hollow Crown</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="world" id="world"></div>
    <button class="back" id="back" type="button" aria-hidden="true" title="Back to the full map (Esc)"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 L7 12 L15 20"/></svg><span>Back to map</span></button>
    <div class="crumb" id="crumb"></div>
    <div class="hint" id="hint">Pick a region to zoom in</div>
    <div class="tipbox" id="tip"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="stats" id="stats"></div>
</div>
<div class="mockstrip">Mockup · not the game</div>
<script src="maps-2-3/data.js"></script>
<script src="maps-2-3/m.js"></script>
</body>
</html>
