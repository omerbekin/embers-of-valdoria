<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta name="darkreader-lock" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill tree: Moments scheme (mockup)</title>
<!-- MOMENTS skill agaci dogrulama taslagi (ui-dev, 2026-10-21). Oyun kodu DEGIL. Belge: docs/design/skill-tree-moments.md.
  Adres: #c=w|h &lv=1..50 &focus=A-B (0..3, orn. focus=0-1: Focus check'i otomatik calistirir) &clean (mockup seridi gizli).
  Icerik GECICI: skill-mastery-v2/data/v3, v5, v6, v7, v8 dosyalarindan eslenir (content.js). -->
<link rel="stylesheet" href="skill-tree-moments/moments.css" />
<script src="skill-mastery-v2/data/v3.js"></script>
<script src="skill-mastery-v2/data/v5.js"></script>
<script src="skill-mastery-v2/data/v6.js"></script>
<script src="skill-mastery-v2/data/v7.js"></script>
<script src="skill-mastery-v2/data/v8.js"></script>
</head>
<body>
<div class="page">
  <div class="top">
    <h1>Skill tree · Moments <small>şema doğrulama · tıklanabilir · içerik geçici</small></h1>
    <div class="ctl">
      <div class="cls-sel" id="cls-sel"></div>
      <div class="lvbox"><span class="lt">Level<b id="lvv">30</b></span><input type="range" id="lv" min="1" max="50" step="1" value="30" aria-label="Level" /><span class="lp">free <b id="lvp">29 / 29</b></span></div>
      <button class="rs" type="button" id="reset" title="Reset: refund every point"><img src="skill-tree-moments/gold.webp" alt="">Reset</button>
    </div>
    <div class="st-info" id="st-info"></div>
    <div class="focus" id="focus"></div>
  </div>
  <div class="sheet" id="sheet"></div>
</div>
<div id="tip"></div>
<div id="toast"></div>
<div id="mk-strip"><b>MOCKUP</b> oyun değil</div>
<script src="skill-tree-moments/core.js"></script>
<script src="skill-tree-moments/content.js"></script>
<script src="skill-tree-moments/app.js"></script>
</body>
</html>
