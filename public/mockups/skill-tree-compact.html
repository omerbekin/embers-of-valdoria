<!--
  SKILL AGACI SIKISTIRMA taslagi (ui-dev, 2026-10-31). Oyun kodu DEGIL; yalnizca secim icin. Istek (Omer): agac tek sayfaya, scroll'suz sigsin; yukaridan asagi akis; ult icin alternatif gorunum. 5 yapi.
  Gercek oyun gorunumu: Gear "Ledger" kabugu (GEAR basligi, Hero / Sheet / Tree sekmeleri, soldaki portre sutunu, altin), oyunun kendi CSS dosyalari (skill-tree-compact/css), gercek Warrior agaci
  (Omer'in secimi: Berserker, Double Strike, Whirlwind, Charge, Headsman's Blow; data/ ve views.js skill-tree-gear taslagindan), A Band ipuclari, kural motoru (core.js + tree-logic.js).
  Adres: #v1 | #v2 | #v3 | #v4 | #v5   [&lv=1..50]  [&ult (v3: ult paneli acik, v4: ult gorunumu)]  [&sel=0..3 (v3 secili skill)].
    #v1 Columns: her skill bir dikey sutun, tier'lar asagi, ult altta genis bant.
    #v2 Strips:  her skill bir yatay satir, ult sagda dar dikey panel.
    #v3 Picker:  skill secilir, yalniz onun dali acilir; ult madalyon + acilir panel.
    #v4 Grid:    siki izgara, ayrinti sabit aciklama alaninda, ult ayri gorunum.
    #v5 Spine:   merkez omurga, dallar iki yana, ult omurganin dibinde haca.
-->
