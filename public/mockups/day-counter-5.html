<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta name="darkreader-lock" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Day Counter 5</title>
<!-- GUN SAYACI taslagi v4 (ui-dev, 2026-10-26). N-W: minimal, mevcut sefer HUD'inin dogal parcasi. Oyun kodu DEGIL. Adres: #N ... #W (+ &phone). Tum olaylar ORNEK. Varliklar: kit-v2/ -->
<link rel="stylesheet" href="kit-v2/css/style.css" />
<link rel="stylesheet" href="kit-v2/css/elegant.css" />
<link rel="stylesheet" href="kit-v2/css/band-tip.css" />
<link rel="stylesheet" href="kit-v2/css/valor.css" />
<link rel="stylesheet" href="kit-v2/mk.css" />
<link rel="stylesheet" href="map-hud/mh.css" />
<style>
:root { --gold:#f3d999; --dim:#a8977a; --ember:#e0702a; --ember2:#ffb35a; --sc:.8333; --hk:1; --ex:0px; }
html.mk-phone { --hk:1.45; --ex:209px; }
html, body { background:#0b0806; }
.pg { max-width:1700px; margin:0 auto; padding:14px 16px 40px; }
h1 { margin:0 0 4px; font:600 22px var(--g-disp); letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
.tabs { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 8px; }
.tabs button { min-width:44px; padding:0 10px; height:44px; font:700 15px var(--g-disp); color:#d9c8a2; background:rgba(8,6,4,.7); border:1px solid rgba(217,178,106,.3); cursor:pointer; transition:border-color .2s,color .2s; }
.tabs button:hover { border-color:rgba(243,217,153,.85); color:var(--gold); }
.tabs button.on { color:#1a0f05; background:linear-gradient(180deg,#f3d999,#d9b26a); border-color:#f3d999; }
.vtag { margin:4px 0 2px; font:600 15px var(--g-disp); letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
.vnote { margin:0 0 8px; font:17px/1.35 var(--g-body); color:#cdb88d; max-width:1100px; }
.ctl { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 10px; padding:6px 8px; border:1px dashed var(--ember); width:fit-content; max-width:100%; }
.ctl b { font:700 11px system-ui,sans-serif; letter-spacing:.06em; color:var(--ember); }
.ctl button { min-height:44px; padding:0 14px; font:600 12px system-ui,sans-serif; letter-spacing:.04em; color:var(--gold); background:#1b120a; border:1px solid rgba(224,112,42,.55); cursor:pointer; }
.ctl button:hover { background:#2a1a0e; }
.ctl button.on { background:var(--ember); color:#1a0f06; }
.ctl .ro { font:600 12px system-ui,sans-serif; color:#cdb88d; }
[hidden] { display:none !important; }
.zw { width:100%; overflow:hidden; }
html, body { overflow-x:hidden; max-width:100%; }

/* ---------- HUD katmani: cerceve kenarina kilitli (telefonda --ex kadar genis) ---------- */
.dc-hud { position:absolute; left:calc(-1 * var(--ex)); top:0; width:calc(1920px + 2 * var(--ex)); height:1080px; pointer-events:none; }
.dc-hud * { font-style:normal; }
.dc-top { position:absolute; left:0; right:0; top:0; height:130px; background:linear-gradient(180deg,rgba(4,6,10,.55),rgba(4,6,10,0)); }
.dc-leftg { position:absolute; left:0; top:0; bottom:0; width:560px; background:linear-gradient(90deg,rgba(4,6,10,.88),rgba(4,6,10,.55) 60%,rgba(4,6,10,0)); }
.dc-l, .dc-r, .dc-c { position:absolute; top:0; width:0; height:1080px; }
.dc-l { left:0; } .dc-r { right:0; } .dc-c { left:50%; }
.dc-l, .dc-r { white-space:nowrap; }
.dc-ttl { position:absolute; left:0; top:52px; transform:translate(-50%,-50%); white-space:nowrap; }
.dc-ttl .t { position:relative; display:inline-block; font:600 31px var(--g-disp); letter-spacing:.2em; text-transform:uppercase; color:rgba(243,217,153,.78); text-shadow:0 2px 8px #000; }
.dc-band { position:absolute; left:max(112px, calc(58px / var(--sc))); top:56px; transform:translateY(-50%); display:flex; align-items:center; gap:18px; padding:4px 14px 4px 8px; background:linear-gradient(90deg,rgba(12,9,6,.62),rgba(12,9,6,.38) 70%,rgba(12,9,6,0)); border-left:1px solid rgba(217,178,106,.3); pointer-events:auto; }
.dc-band .vl-meter { --vl-h:44px; }
.dc-band .vl-lbl { font-size:12px; }
.dc-info { position:absolute; left:48px; top:812px; width:400px; color:var(--dim); }
.dc-info .rg { font:600 18px var(--g-disp); letter-spacing:.06em; color:var(--gold); line-height:22px; white-space:nowrap; }
.dc-info .pb { position:relative; height:5px; margin:8px 0 0; background:rgba(8,6,4,.85); border:1px solid rgba(217,178,106,.28); }
.dc-info .pb i { position:absolute; left:1px; top:0; bottom:0; width:15%; background:#e8c47e; }
.dc-info .cl, .dc-info .md { font:17px/1 var(--g-body); margin-top:14px; display:flex; justify-content:space-between; align-items:center; }
.dc-info .gd { display:inline-flex; align-items:center; gap:6px; font:600 20px var(--g-disp); letter-spacing:.04em; color:var(--gold); }
.dc-info .gd img { width:26px; height:26px; }
.mh-row .ro, .mh-here .s { font-style:normal; }
.mh-row .call { font-style:normal; }
.mh-legend { pointer-events:auto; }

/* ---------- ortak sayac parcalari ---------- */
.anc { position:absolute; transform:var(--ty,none) scale(var(--hk)); transform-origin:var(--o,0 0); cursor:help; pointer-events:auto; outline:none; }
.anc::before { content:''; position:absolute; inset:-8px -6px; }
.anc:focus-visible { box-shadow:0 0 0 1px rgba(243,217,153,.8); }
.P, .S, .V { transform:none; }
.num { display:inline-block; }
.num.roll { animation:dcroll .24s ease-out; }
@keyframes dcroll { 0% { transform:translateY(-55%); opacity:0; } 100% { transform:none; opacity:1; } }
.anc.glow { animation:dcglow .9s ease-out; }
@keyframes dcglow { 0% { filter:drop-shadow(0 0 0 rgba(255,214,130,0)); } 28% { filter:drop-shadow(0 0 8px rgba(255,214,130,.95)); } 100% { filter:drop-shadow(0 0 0 rgba(255,214,130,0)); } }
.evdot { width:8px; height:8px; border-radius:50%; background:var(--ember); box-shadow:0 0 8px rgba(224,112,42,.8); flex:none; }
.evn { min-width:18px; height:18px; padding:0 4px; border-radius:9px; display:inline-grid; place-items:center; font:700 12px var(--g-disp); color:#1a120a; background:var(--ember); border:1px solid var(--ember2); line-height:1; flex:none; }
.pr { color:var(--dim); }

/* A Band ipucu kutusu */
.dc-pop { position:absolute; z-index:40; display:none; pointer-events:none; width:max-content; text-transform:none; letter-spacing:0; white-space:normal; text-shadow:none; font-weight:400; cursor:default; }
.dc-pop .bt { --bu:1.1px; }
html.mk-phone .dc-pop .bt { --bu:1.4px; }
.anc:hover > .dc-pop, .anc:focus-within > .dc-pop, .anc.tipon > .dc-pop { display:block; animation:dcpop .16s ease-out; }
@keyframes dcpop { 0% { opacity:0; margin-top:4px; } 100% { opacity:1; } }
.dc-pop.below-l { top:100%; left:0; margin-top:14px; } .dc-pop.below-c { top:100%; left:50%; translate:-50% 0; margin-top:14px; } .dc-pop.below-r { top:100%; right:0; margin-top:14px; }
.dc-pop.above-l { bottom:100%; left:0; margin-bottom:14px; } .dc-pop.above-r { bottom:100%; right:0; margin-bottom:14px; }
.dc-pop.right { left:100%; top:0; margin-left:14px; } .dc-pop.left { right:100%; top:50%; translate:0 -50%; margin-right:14px; }

/* ---- U ailesi: ust kenar ortada cetvel ---- */
.U { left:0; top:6px; width:760px; height:30px; --ty:translateX(-50%); --o:50% 0; display:flex; align-items:center; gap:18px; }
.U .rl { position:relative; flex:1; height:2px; background:linear-gradient(90deg,rgba(217,178,106,0),rgba(217,178,106,.5)); }
.U .rl.r { background:linear-gradient(270deg,rgba(217,178,106,0),rgba(217,178,106,.5)); }
.U .rl b { position:absolute; inset:0; opacity:0; transition:opacity .25s; background:linear-gradient(90deg,rgba(243,217,153,0),#f3d999); box-shadow:0 0 8px rgba(243,217,153,.55); }
.U .rl.r b { background:linear-gradient(270deg,rgba(243,217,153,0),#f3d999); }
.U .rl b.on { opacity:1; }
.U .ul { font:600 17px var(--g-disp); letter-spacing:.24em; text-transform:uppercase; color:rgba(243,217,153,.9); text-shadow:0 0 4px #000,0 1px 4px #000; white-space:nowrap; }
.U .ul .num { margin-left:4px; font-size:19px; }
.U .uev { position:absolute; left:50%; top:27px; width:6px; height:6px; margin-left:-3px; border-radius:50%; background:var(--ember); box-shadow:0 0 8px rgba(224,112,42,.8); }
@keyframes uspark { 0% { opacity:1; box-shadow:0 0 0 0 #ffb35a,0 0 0 0 #ffd890,0 0 0 0 #ffb35a,0 0 0 0 #ffd890; } 100% { opacity:0; box-shadow:-16px -12px 0 -1px #ffb35a,-10px 13px 0 -1px #ffd890,-24px 3px 0 -1px #ffb35a,-6px -16px 0 -1px #ffd890; } }
@keyframes uflick { 0% { opacity:.75; transform:scale(.92); } 50% { opacity:1; transform:scale(1.08); } 100% { opacity:.85; transform:scale(.97); } }
@keyframes ubreath { 0%,100% { text-shadow:0 0 4px #000,0 1px 4px #000; } 50% { text-shadow:0 0 4px #000,0 0 12px rgba(243,217,153,.65); } }
.U .uev { animation:uflick .9s ease-in-out infinite alternate; }
/* U8 cift satir + safak dalgasi */
.U.u8 { height:26px; }
html.u8 .dc-ttl { top:70px; }
.U.u8 .cap { position:absolute; left:50%; top:24px; transform:translateX(-50%); font:600 11px var(--g-disp); letter-spacing:.26em; text-transform:uppercase; color:var(--dim); white-space:nowrap; text-shadow:0 1px 3px #000; }
.U.u8 .uev { top:42px; }
.U.u8 .wv { position:absolute; left:0; right:0; top:10px; height:6px; pointer-events:none; opacity:0; background:linear-gradient(90deg,transparent,#c85a4a 30%,#f3d999 50%,#e8a050 70%,transparent) -40% 0/35% 100% no-repeat; filter:blur(3px); }
.U.u8.glow .wv { animation:uwave .6s ease-out; }
@keyframes uwave { 0% { opacity:0; background-position:-40% 0; } 25% { opacity:.95; } 100% { opacity:0; background-position:140% 0; } }
/* ================= R ailesi: sag ust kose ================= */
.k-quest { --kc:#f3d999; } .k-gate { --kc:#7fb0e0; } .k-market { --kc:#9fd88a; } .k-threat { --kc:#e8705a; } .k-inn { --kc:#6fd0c0; }
svg.ic { width:22px; height:22px; flex:none; color:var(--kc); }
.ex { font:600 10px var(--g-disp); letter-spacing:.18em; text-transform:uppercase; color:#1a0f05; background:#e0b24a; padding:2px 6px; flex:none; }
.plate, .cp { background:linear-gradient(180deg,rgba(24,17,10,.9),rgba(9,6,4,.9)); border:1px solid rgba(217,178,106,.42); box-shadow:0 0 0 2px rgba(8,6,4,.55); }
.cp { display:flex; align-items:center; gap:10px; height:42px; padding:0 12px 0 14px; color:var(--gold); font:inherit; cursor:pointer; text-shadow:0 1px 3px #000; position:relative; transition:border-color .18s, transform .18s; }
.cp:hover { border-color:rgba(243,217,153,.85); transform:translateY(-2px); }
.cp .lb { font:600 12px var(--g-disp); letter-spacing:.22em; color:var(--dim); text-transform:uppercase; }
.cp .num { font:600 23px var(--g-disp); color:var(--gold); }
.cp .car { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2; transition:transform .2s; }
.xp.open .cp .car { transform:rotate(180deg); }
.xp.open .cp { border-color:rgba(243,217,153,.85); }
.cp .evn { position:absolute; right:-8px; top:-9px; }
.tally { display:flex; gap:5px; }
.tally i { width:3px; height:18px; background:rgba(217,178,106,.25); transition:background .22s, box-shadow .22s; }
.tally i.on { background:var(--gold); box-shadow:0 0 7px rgba(243,217,153,.7); }

/* acilir panel */
.pn { position:absolute; z-index:45; box-sizing:border-box; padding:16px 18px 14px; background:linear-gradient(180deg,rgba(30,22,14,.97),rgba(12,9,6,.97)); border:1px solid rgba(217,178,106,.42); box-shadow:0 0 0 3px rgba(8,6,4,.7),0 16px 36px rgba(0,0,0,.6); opacity:0; visibility:hidden; pointer-events:none; transform:translateY(-6px); transition:opacity .22s ease-out, transform .22s ease-out, visibility .22s; white-space:normal; text-align:left; cursor:default; color:#e6dcc6; font:19px/1.3 var(--g-body); text-shadow:none; max-height:calc((1080px - 150px) / var(--hk)); overflow-y:auto; overflow-x:hidden; text-transform:none; letter-spacing:0; }
.pn::before { content:''; position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg,#a8742a,#f3d999,#a8742a); }
.xp.open > .pn { opacity:1; visibility:visible; pointer-events:auto; transform:none; }
.pn.below-r { top:100%; right:0; margin-top:12px; } .pn.left { right:100%; top:0; margin-right:12px; }
.ph { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid rgba(217,178,106,.2); }
.ph .k { font:600 13px var(--g-disp); letter-spacing:.24em; color:var(--dim); text-transform:uppercase; }
.nx { display:flex; align-items:center; gap:12px; margin:0 0 4px; }
.nx .big { font:600 28px var(--g-disp); letter-spacing:.08em; color:var(--gold); white-space:nowrap; }
.nx .bar { position:relative; flex:1; height:5px; background:rgba(0,0,0,.6); border:1px solid rgba(217,178,106,.3); }
.nx .bar i { position:absolute; left:0; top:0; bottom:0; width:calc(var(--f) * 100%); background:linear-gradient(90deg,#a8742a,#e8c47e); transition:width .25s ease-out; }
.nx .bar u { position:absolute; left:50%; top:-3px; bottom:-3px; width:1px; background:rgba(217,178,106,.6); }
.nx .pr { font:600 14px var(--g-disp); letter-spacing:.1em; color:var(--dim); }
.pf { margin-top:10px; padding-top:8px; border-top:1px solid rgba(217,178,106,.2); font:600 11px var(--g-disp); letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
.gh { font:600 12px var(--g-disp); letter-spacing:.24em; color:var(--dim); text-transform:uppercase; margin:12px 0 2px; }
.evr { display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid rgba(217,178,106,.14); }
.evr .t { flex:1; font-size:18px; }
.evr .d { font:700 12px var(--g-disp); letter-spacing:.1em; color:var(--kc); border:1px solid currentColor; padding:2px 7px; white-space:nowrap; }
.evr.now .d { background:var(--kc); color:#1a0f05; }
.none { padding:8px 0; color:var(--dim); font-size:17px; }

/* R1 liste */
.R1 { right:calc(112px / var(--sc)); top:calc(28px / var(--sc)); --ty:translateY(-50%); --o:100% 0; }
.R1 .pn { width:400px; }
/* R2 takvim */
.R2 { right:0; top:calc(56px / var(--sc) + 12px); --o:100% 0; }
.R2 .cp { flex-direction:column; justify-content:center; gap:3px; width:64px; height:72px; padding:0; border-right:0; }
.R2 .cp .num { font-size:26px; line-height:1; }
.R2 .pn { width:470px; }
.cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:4px 0 10px; }
.cc { height:64px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:7px 0; background:rgba(40,28,16,.55); border:1px solid rgba(217,178,106,.25); font:600 16px var(--g-disp); color:#d9c8a2; cursor:pointer; transition:border-color .16s, background .16s; }
.cc:hover { border-color:rgba(243,217,153,.8); }
.cc.today { border-color:var(--gold); background:rgba(120,80,30,.5); }
.cc.sel { outline:1px solid var(--gold); outline-offset:1px; }
.dots { display:flex; gap:3px; min-height:7px; } .dots i { width:7px; height:7px; border-radius:50%; background:var(--kc); }
/* R3 zaman cizgisi */
.R3 { right:calc(112px / var(--sc)); top:calc(28px / var(--sc)); --ty:translateY(-50%); --o:100% 0; }
.R3 .pn { width:380px; }
.R3 .mini { position:relative; width:84px; height:20px; }
.R3 .mini::before { content:''; position:absolute; left:0; right:0; top:9px; height:2px; background:linear-gradient(90deg,#e0702a,rgba(217,178,106,.3)); }
.R3 .mini .tk { position:absolute; top:3px; width:2px; height:14px; margin-left:-1px; background:var(--kc); }
.R3 .mini .me { position:absolute; left:0; top:5px; width:10px; height:10px; margin-left:-3px; transform:rotate(45deg); background:var(--ember); border:1px solid var(--ember2); box-shadow:0 0 8px rgba(224,112,42,.8); }
.tl { position:relative; padding-left:24px; margin-top:6px; }
.tl::before { content:''; position:absolute; left:6px; top:8px; bottom:14px; width:2px; background:linear-gradient(180deg,#e0702a,rgba(217,178,106,.25)); }
.tn { position:relative; padding:0 0 14px; }
.tn .dt { position:absolute; left:-24px; top:6px; width:10px; height:10px; border:2px solid var(--kc,#d9b26a); background:#130d07; transform:rotate(45deg); }
.tn.now .dt { background:var(--ember); border-color:var(--ember2); box-shadow:0 0 8px rgba(224,112,42,.8); }
.tn .td { font:600 12px var(--g-disp); letter-spacing:.2em; color:var(--dim); text-transform:uppercase; margin-bottom:3px; }
.tn .tt { display:flex; align-items:center; gap:10px; font-size:18px; }
/* R4 madalyon + sekmeler */
.R4 { right:calc(10px / var(--sc)); top:calc(56px / var(--sc) + 12px); --o:100% 0; }
.R4 .md { position:relative; width:68px; height:68px; padding:0; background:none; border:0; cursor:pointer; color:var(--gold); font:inherit; transition:transform .18s; }
.R4 .md:hover { transform:translateY(-2px); }
.R4 .md svg { position:absolute; inset:0; overflow:visible; }
.R4 .md .bd { fill:rgba(12,9,6,.82); stroke:rgba(217,178,106,.45); stroke-width:1; }
.R4 .md .arc { fill:none; stroke:rgba(217,178,106,.4); stroke-width:3; stroke-linecap:round; transition:stroke .22s, filter .22s; }
.R4 .md .arc.on { stroke:#f3d999; filter:drop-shadow(0 0 4px rgba(243,217,153,.7)); }
.R4 .md .qd { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
.R4 .md small { font:600 9px var(--g-disp); letter-spacing:.2em; color:var(--dim); text-transform:uppercase; }
.R4 .md .num { font:600 24px/1 var(--g-disp); }
.R4 .md .evn { position:absolute; right:-2px; top:-2px; }
.R4 .pn { width:420px; }
.tbs { display:flex; margin:0 -18px 8px; border-bottom:1px solid rgba(217,178,106,.2); }
.tb { flex:1; height:44px; font:600 13px var(--g-disp); letter-spacing:.18em; text-transform:uppercase; background:none; border:0; border-bottom:2px solid transparent; color:var(--dim); cursor:pointer; transition:color .16s, border-color .16s; }
.tb:hover { color:var(--gold); } .tb.on { color:var(--gold); border-bottom-color:var(--gold); }
/* R5 kartlar */
.R5 { right:calc(112px / var(--sc)); top:calc(28px / var(--sc)); --ty:translateY(-50%); --o:100% 0; }
.R5 .cp { height:48px; gap:12px; }
.R5 .cp .num { font-size:28px; }
.R5 .cp .tx { display:flex; flex-direction:column; gap:2px; align-items:flex-start; }
.R5 .cp .l1 { font:600 11px var(--g-disp); letter-spacing:.2em; color:var(--dim); text-transform:uppercase; }
.R5 .cp .l2 { font-size:16px; color:#d9c8a2; max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.R5 .pn { width:420px; }
.cd { display:flex; align-items:center; gap:14px; padding:10px 12px; margin-bottom:8px; background:linear-gradient(180deg,rgba(24,17,10,.93),rgba(9,6,4,.93)); border:1px solid rgba(217,178,106,.34); border-left:3px solid var(--kc); }
.cd .cm { width:44px; height:44px; flex:none; display:grid; place-items:center; background:#0a0605; border:1px solid rgba(217,178,106,.5); }
.cd .cm svg { width:26px; height:26px; }
.cd .cx { flex:1; min-width:0; }
.cd .ck { font:600 11px var(--g-disp); letter-spacing:.22em; color:var(--kc); text-transform:uppercase; }
.cd .ct { font:600 18px var(--g-disp); letter-spacing:.04em; color:var(--gold); }
.cd .cs { font-size:16px; color:var(--dim); }
.cd .cn { font:600 26px/1 var(--g-disp); color:var(--kc); text-align:center; min-width:44px; }
.cd .cn small { display:block; margin-top:3px; font:600 10px var(--g-disp); letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }
/* sabit: R6 safak yayi */
.R6 { right:calc(10px / var(--sc)); top:calc(56px / var(--sc) + 12px); width:340px; padding:12px 16px 12px; --o:100% 0; overflow:hidden; }
.R6.anc::before { inset:0; }
.R6 .r6h { display:flex; align-items:baseline; justify-content:space-between; }
.R6 .big { font:600 30px var(--g-disp); letter-spacing:.1em; color:var(--gold); text-shadow:0 1px 4px #000; }
.R6 .nd { font:600 12px var(--g-disp); letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
.R6 .arc { display:block; width:100%; height:auto; margin:4px 0 2px; overflow:visible; }
.R6 .hz { stroke:rgba(217,178,106,.35); stroke-width:1; fill:none; }
.R6 .ar { stroke:rgba(217,178,106,.55); stroke-width:1.5; stroke-dasharray:3 5; fill:none; }
.R6 .sun { transform:translate(var(--sx,10px),var(--sy,52px)); transition:transform .5s ease-in-out; }
.R6 .sun circle { fill:#f3d999; } .R6 .sun .halo { fill:rgba(255,170,80,.28); }
.chs { display:flex; gap:8px; }
.chip { display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 5px; border:1px solid var(--kc); color:var(--kc); font:700 12px var(--g-disp); letter-spacing:.06em; }
.chip svg { width:16px; height:16px; }
.R6 .wv, .R8 .wv { position:absolute; left:0; right:0; top:0; bottom:0; pointer-events:none; opacity:0; background:linear-gradient(90deg,transparent,rgba(200,90,74,.5) 30%,rgba(243,217,153,.6) 50%,rgba(232,160,80,.5) 70%,transparent) -40% 0/40% 100% no-repeat; }
.R6.glow .wv, .R8.glow .wv { animation:uwave .6s ease-out; }
/* sabit: R7 sutun */
.R7 { right:calc(8px / var(--sc)); top:calc(56px / var(--sc) + 12px); width:62px; padding:10px 0 12px; display:flex; flex-direction:column; align-items:center; gap:8px; --o:100% 0; }
.R7 .lb { font:600 11px var(--g-disp); letter-spacing:.22em; color:var(--dim); text-transform:uppercase; margin-right:-.22em; }
.R7 .num { font:600 28px/1 var(--g-disp); color:var(--gold); text-shadow:0 1px 3px #000; }
.R7 .rail { position:relative; width:10px; height:120px; background:rgba(0,0,0,.6); border:1px solid rgba(217,178,106,.35); }
.R7 .rail i { position:absolute; left:0; right:0; bottom:0; height:calc(var(--f) * 100%); background:linear-gradient(0deg,#a8742a,#f3d999); box-shadow:0 0 8px rgba(243,217,153,.45); transition:height .3s ease-out; }
.R7 .rail u { position:absolute; left:-3px; right:-3px; top:50%; height:1px; background:rgba(217,178,106,.7); }
.R7 .pr { font:600 12px var(--g-disp); letter-spacing:.08em; color:var(--dim); }
.R7 .mk { display:flex; flex-direction:column; gap:6px; align-items:center; margin-top:2px; padding-top:8px; border-top:1px solid rgba(217,178,106,.2); width:44px; }
.R7 .mk span { display:flex; align-items:center; gap:3px; color:var(--kc); font:700 12px var(--g-disp); }
.R7 .mk svg { width:15px; height:15px; }
/* sabit: R8 cift satir + akan olay */
.R8 { right:calc(112px / var(--sc)); top:calc(28px / var(--sc)); --ty:translateY(-50%); width:310px; padding:8px 14px 9px; --o:100% 50%; overflow:visible; }
.R8 .r1 { display:flex; align-items:center; gap:10px; }
.R8 .lb { font:600 12px var(--g-disp); letter-spacing:.22em; color:var(--dim); text-transform:uppercase; }
.R8 .num { font:600 23px var(--g-disp); color:var(--gold); }
.R8 .lks { display:flex; gap:4px; margin-left:auto; }
.R8 .lk { width:20px; height:10px; border:2px solid rgba(217,178,106,.5); border-radius:6px; transition:background .22s, border-color .22s, box-shadow .22s; }
.R8 .lk.on { background:var(--gold); border-color:var(--gold); box-shadow:0 0 7px rgba(243,217,153,.6); }
.R8 .pr { font:600 13px var(--g-disp); color:var(--dim); letter-spacing:.08em; }
.R8 .tick { display:flex; align-items:center; gap:8px; margin-top:6px; padding-top:6px; border-top:1px solid rgba(217,178,106,.18); font-size:16px; color:#d9c8a2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.R8 .tick svg { width:18px; height:18px; }
.R8 .tick.sw { animation:tickin .3s ease-out; }
.R8 .evn { position:absolute; right:-8px; top:-9px; }
.wvw { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
@keyframes tickin { 0% { opacity:0; transform:translateY(5px); } 100% { opacity:1; transform:none; } }
/* R9 muhur + defter */
.R9 { right:calc(112px / var(--sc)); top:calc(28px / var(--sc)); --ty:translateY(-50%); --o:100% 0; }
.R9 .cp { border-radius:22px; padding:0 16px; }
.R9 .pn { width:560px; display:grid; grid-template-columns:150px 1fr; gap:18px; }
.R9 .lgl { text-align:center; padding-right:16px; border-right:1px solid rgba(217,178,106,.22); }
.R9 .lgl .k { font:600 12px var(--g-disp); letter-spacing:.24em; color:var(--dim); text-transform:uppercase; margin-right:-.24em; }
.R9 .lgl .num { display:block; font:600 72px/1.05 var(--g-disp); color:var(--gold); text-shadow:0 0 18px rgba(224,112,42,.4); }
.R9 .lgl .ph9 { display:flex; justify-content:center; gap:8px; margin:8px 0 6px; }
.R9 .lgl .ph9 i { width:10px; height:10px; transform:rotate(45deg); border:1px solid var(--gold); transition:background .22s, box-shadow .22s; }
.R9 .lgl .ph9 i.on { background:var(--ember); border-color:var(--ember2); box-shadow:0 0 8px rgba(224,112,42,.8); }
.R9 .lgl .pr { font:600 13px var(--g-disp); letter-spacing:.14em; color:var(--dim); }
.R9 .pf { grid-column:1 / -1; margin-top:0; }
/* R10 2x2 */
.R10 { right:calc(10px / var(--sc)); top:calc(56px / var(--sc) + 12px); --o:100% 0; }
.R10 .cp { gap:9px; }
.R10 .fl { width:15px; height:21px; overflow:visible; }
.R10 .fl path { fill:rgba(217,178,106,0); stroke:rgba(217,178,106,.55); stroke-width:1.3; stroke-linejoin:round; transition:fill .25s, stroke .25s; }
.R10 .fl.on path { fill:#e8782e; stroke:#ffb35a; filter:drop-shadow(0 0 5px rgba(255,140,50,.8)); }
.R10 .pn { width:460px; }
.gr { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.gb { padding:10px 12px 10px; background:rgba(8,6,4,.5); border:1px solid rgba(217,178,106,.28); border-top:2px solid var(--kc); }
.gb .gk { display:flex; align-items:center; gap:8px; font:600 12px var(--g-disp); letter-spacing:.2em; color:var(--kc); text-transform:uppercase; }
.gb .gk svg { width:18px; height:18px; }
.gb .gn { margin:6px 0 2px; font:600 30px/1 var(--g-disp); color:var(--gold); }
.gb .gn small { font:600 11px var(--g-disp); letter-spacing:.18em; color:var(--dim); margin-left:6px; text-transform:uppercase; }
.gb .gt { font-size:16px; color:#cdb88d; line-height:1.2; }
@media (prefers-reduced-motion: reduce) { .num.roll, .anc.glow, .anc:hover > .dc-pop, .U, .U *, .pn, .R6 .sun, .R8 .tick, .cp, .tb, .cc { animation:none !important; transition:none !important; } .U *::after, .R6 .wv, .R8 .wv { animation:none !important; } }
</style>
</head>
<body>
<div class="pg">
<h1>Day counter · R1 - R10</h1>
<div class="tabs" id="tabs"></div>
<div class="vtag" id="vtag"></div>
<p class="vnote" id="vnote"></p>
<div class="ctl"><b>MOCKUP</b><button id="bSim" type="button">Simulate victory</button><button id="bRst" type="button">Reset</button><button id="bDesk" type="button" data-m="desk">1600x900</button><button id="bPhone" type="button" data-m="phone">844x390</button><span class="ro" id="ro"></span></div>
<div class="zw" id="zw"><div class="mk-zoom" id="zoom"><div class="mk-frame" id="frame"><div class="mk-bg" id="bg"></div><div class="mk-ui" id="ui"></div></div></div></div>
</div>
<script src="kit-v2/mk.js"></script>
<script>
(function () {
  const PARTY = [
    { id: 'warrior', name: 'Warrior', role: 'Melee Bruiser', lv: 6, hp: 1 },
    { id: 'archer', name: 'Archer', role: 'Marksman', lv: 6, hp: 0.7, pts: 2 },
    { id: 'druid', name: 'Druid', role: 'Nature Summoner', lv: 5, hp: 0, fallen: true },
    { id: 'mage', name: 'Mage', role: 'Elemental Mage', lv: 5, hp: 0.55 },
  ];
  const st = { day: 7, vic: 0, busy: false, tab: 'R1', phone: false, sub: 'Agenda', sel: 7, tick: 0, open: false };
  const roman = (n) => n;
  const pop = (pos) => `<div class="dc-pop ${pos}"></div>`;
  const num = (f) => `<span class="num" data-f="${f || 'd'}"></span>`;
  const anc = (cls, inner, extra) => `<div class="anc ${cls}" tabindex="0" ${extra || ''}>${inner}</div>`;

  const IC = {
    quest: '<path d="M6 3V22M6 4H19L15 9L19 14H6"/>',
    gate: '<path d="M4 22V11a8 8 0 0 1 16 0V22ZM12 14V22"/>',
    market: '<circle cx="12" cy="12" r="8"/><path d="M8.5 12H15.5M12 8.5V15.5"/>',
    threat: '<path d="M4 4L20 20M20 4L4 20M3 8L8 3M16 21L21 16"/>',
    inn: '<path d="M12 2C13 8 18 10 18 15A6 6 0 0 1 6 15C6 12 8 10.5 9 8C10 9 10.5 9.5 11 10C11.5 7 11.5 4.5 12 2Z"/>',
  };
  const ico = (k) => `<svg class="ic k-${k}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
  const KN = { quest: 'Quest', gate: 'Gate', market: 'Market', threat: 'Threat', inn: 'Inn' };
  const plu = (n) => `${n} ${n === 1 ? 'day' : 'days'}`;

  /* ---- ornek olaylar (hepsi ORNEK) ---- */
  function agenda() {
    const d = st.day; const L = [];
    const add = (day, k, title, sub, text) => { if (day >= d) L.push({ day, dd: day - d, k, title, sub, text }); };
    add(10, 'quest', 'Rescue the captive', 10 === d ? 'last day' : `${plu(10 - d)} left`, 10 === d ? 'Rescue the captive: last day' : `Rescue the captive: ${plu(10 - d)} left`);
    add(9, 'gate', 'Sunken Crypt opens', d === 9 ? 'today' : 'on Day 9', d === 9 ? 'Sunken Crypt opens today' : 'Sunken Crypt opens on Day 9');
    const sd = d + ((4 - (d % 4)) % 4);
    add(sd, 'market', 'Smith restocks', sd === d ? 'today' : `in ${plu(sd - d)}`, sd === d ? 'Smith restocks today' : `Smith restocks in ${plu(sd - d)}`);
    add(11, 'threat', 'Bandit raid on Ravenwood', d === 11 ? 'today' : `in ${plu(11 - d)}`, d === 11 ? 'Bandit raid on Ravenwood today' : `Bandit raid on Ravenwood in ${plu(11 - d)}`);
    const cd = d + ((6 - (d % 6)) % 6);
    add(cd, 'market', 'Odo brings new stock', cd === d ? 'today' : `in ${plu(cd - d)}`, cd === d ? 'Odo brings new stock today' : `Odo brings new stock in ${plu(cd - d)}`);
    add(d + 1, 'inn', 'Inn: heroes heal at dawn', 'every dawn', 'Inn: heroes heal at dawn');
    return L.sort((a, b) => a.day - b.day);
  }
  const soon = (ag) => ag.filter((e) => e.k !== 'inn' && e.dd <= 2).length;
  const dchip = (e) => (e.dd === 0 ? 'Today' : `Day ${e.day}`);
  const row = (e) => `<div class="evr k-${e.k}${e.dd === 0 ? ' now' : ''}">${ico(e.k)}<span class="t">${e.text}</span><span class="d">${dchip(e)}</span></div>`;
  const tipHtml = (ag) => MK.tip({ kind: 'Calendar', title: `Day ${st.day}`, value: `${st.vic}/2`, valueLabel: `to day ${st.day + 1}`, chips: [{ text: 'Example' }], lines: ag.slice(0, 4).map((e) => e.text), foot: '2 victories = 1 day' });

  const FILL = {
    list: (ag) => {
      const g = [['Today', (e) => e.dd === 0], ['Tomorrow', (e) => e.dd === 1], ['Later', (e) => e.dd >= 2]];
      return g.map(([n, f]) => { const r = ag.filter(f); return r.length ? `<div class="gh">${n}</div>${r.map(row).join('')}` : ''; }).join('') || '<div class="none">Nothing planned.</div>';
    },
    cal: (ag) => {
      let h = '<div class="cal">';
      for (let i = 0; i < 7; i++) {
        const day = st.day + i; const es = ag.filter((e) => e.day === day && e.k !== 'inn');
        h += `<button class="cc${i === 0 ? ' today' : ''}${st.sel === day ? ' sel' : ''}" data-cal="${day}"><b>${day}</b><span class="dots">${es.map((e) => `<i class="k-${e.k}"></i>`).join('')}</span></button>`;
      }
      const sel = ag.filter((e) => e.day === st.sel && e.k !== 'inn');
      return h + `</div><div class="gh" style="margin-top:0">Day ${st.sel}</div>${sel.map(row).join('') || '<div class="none">Nothing planned.</div>'}<div class="evr k-inn">${ico('inn')}<span class="t">Inn: heroes heal at dawn</span></div>`;
    },
    tl: (ag) => {
      let h = `<div class="tl"><div class="tn now"><i class="dt"></i><div class="td">Now · Day ${st.day}</div><div class="tt" style="color:var(--dim)">Win 2 battles to end the day</div></div>`;
      h += ag.map((e) => `<div class="tn k-${e.k}"><i class="dt"></i><div class="td">Day ${e.day} · ${e.dd === 0 ? 'today' : e.dd === 1 ? 'tomorrow' : `in ${e.dd} days`}</div><div class="tt">${ico(e.k)}<span>${e.text}</span></div></div>`).join('');
      return h + '</div>';
    },
    tabs: (ag) => {
      const T = { Agenda: ['quest', 'gate'], Town: ['market', 'inn'], Danger: ['threat'] };
      const rows = ag.filter((e) => T[st.sub].includes(e.k));
      return `<div class="tbs">${Object.keys(T).map((t) => `<button class="tb${t === st.sub ? ' on' : ''}" data-tab="${t}">${t}</button>`).join('')}</div>${rows.map(row).join('') || '<div class="none">Nothing planned.</div>'}`;
    },
    cards: (ag) => ag.filter((e) => e.k !== 'inn').slice(0, 4).map((e) => `<div class="cd k-${e.k}"><span class="cm">${ico(e.k)}</span><div class="cx"><div class="ck">${KN[e.k]}</div><div class="ct">${e.title}</div><div class="cs">${e.sub}</div></div><div class="cn">${e.dd === 0 ? 'Now' : e.dd}<small>${e.dd === 0 ? 'today' : e.dd === 1 ? 'day' : 'days'}</small></div></div>`).join('') + `<div class="evr k-inn">${ico('inn')}<span class="t">Inn: heroes heal at dawn</span></div>`,
    grid: (ag) => {
      const G = [['quest', 'Quests'], ['gate', 'Gates'], ['market', 'Shops'], ['threat', 'Threats']];
      return '<div class="gr">' + G.map(([k, n]) => { const e = ag.find((x) => x.k === k); return `<div class="gb k-${k}"><div class="gk">${ico(k)}${n}</div>${e ? `<div class="gn">${e.dd === 0 ? 'Now' : e.dd}<small>${e.dd === 0 ? '' : e.dd === 1 ? 'day' : 'days'}</small></div><div class="gt">${e.title}</div>` : '<div class="gn">-</div><div class="gt">Quiet</div>'}</div>`; }).join('') + `</div><div class="evr k-inn" style="margin-top:10px">${ico('inn')}<span class="t">Inn: heroes heal at dawn</span></div>`;
    },
    ticks: (ag) => `<i class="me"></i>${ag.filter((e) => e.k !== 'inn' && e.dd <= 6).map((e) => `<i class="tk k-${e.k}" style="left:${(e.dd / 6) * 100}%"></i>`).join('')}`,
    chips: (ag) => ag.filter((e) => e.k !== 'inn').slice(0, 4).map((e) => `<span class="chip k-${e.k}">${ico(e.k)}${e.dd === 0 ? 'now' : e.dd + 'd'}</span>`).join(''),
    rail: (ag) => ag.filter((e) => e.k !== 'inn').slice(0, 4).map((e) => `<span class="k-${e.k}">${ico(e.k)}${e.dd === 0 ? '!' : e.dd}</span>`).join(''),
    ticker: (ag) => { const e = ag[st.tick % ag.length]; return `${ico(e.k)}<span>${e.text}</span>`; },
    next: (ag) => { const e = ag.find((x) => x.k !== 'inn'); return e ? e.text : ''; },
  };

  /* ---- ortak HUD tabani: sefer haritasinin bugunku hali (CampaignMapScene.renderHud / renderColumn) ---- */
  function base(h) {
    h = h || {};
    const rows = PARTY.map((p, i) => `<div class="mh-row${p.fallen ? ' fallen' : ''}" style="top:${194 + i * 112}px"><div class="pf"><img src="${MK.av(p.id)}" alt=""></div><span class="bd">${p.lv}</span>${p.pts ? `<span class="call">+${p.pts}</span>` : ''}<span class="nm">${p.name}</span><span class="ro">${p.fallen ? 'Fallen' : p.role}</span><div class="hp"><i style="width:${p.hp * 100}%"></i></div></div>`).join('');
    const hereY = 194 + PARTY.length * 112 + 16;
    const brs = ['4', '4', '2', '0'].map((n) => `<span class="vl-br"><img class="vl-img" src="${MK.brazier(`brazier-${n}`)}" alt=""></span>`).join('');
    return `<div class="dc-hud">
      <div class="dc-top"></div><div class="dc-leftg"></div>
      <div class="dc-c"><div class="dc-ttl"><span class="t">Valdoria${h.titleAfter || ''}</span></div>${h.center || ''}</div>
      <div class="dc-band"><span class="vl-meter"><span class="vl-brs">${brs}</span><span class="vl-lbl">Valor</span></span>${h.band || ''}</div>
      <div class="dc-l">
        <div class="mh-kick" style="left:48px;top:150px">Your party · ${PARTY.length}</div>${h.noKickline ? '' : '<div class="mh-kickline" style="left:48px;width:400px;top:168px"></div>'}${rows}
        <div class="mh-kick" style="left:48px;top:${hereY}px">You are here</div><div class="mh-kickline" style="left:48px;width:400px;top:${hereY + 18}px"></div>
        <div class="mh-here" style="top:${hereY}px"><div class="tile"><img src="${MK.node('battle')}" alt=""></div><span class="n">Ravenwood</span><span class="s">Battle · Outlaw Pack</span></div>
        <div class="dc-info"><div class="rg">I · The Borderlands</div><div class="pb"><i></i></div><div class="cl"><span>Cleared 4/26 · Chapter 1</span></div><div class="md"><span>Normal · Medium</span><span class="gd"><img src="${MK.ui('gold')}" alt="">128</span></div></div>
        <div class="mh-ibtn" style="left:24px;bottom:34px"><img src="${MK.ui('gear')}" alt=""></div><div class="mh-ibtn" style="left:102px;bottom:34px"><img src="${MK.ui('formation')}" alt=""></div>
        ${h.left || ''}
      </div>
      <div class="dc-r">${h.right || ''}<div class="mh-legend">${h.legendTop || ''}<div class="h">Legend <span>hide</span></div><div class="g">${[['battle', 'Battle'], ['elite', 'Elite'], ['boss', 'Boss'], ['town', 'Town'], ['treasure', 'Treasure'], ['event', 'Event'], ['rest', 'Rest point'], ['merchant', 'Merchant']].map(([t, l]) => `<div><img src="${MK.node(t)}" alt="">${l}</div>`).join('')}</div></div></div>
    </div>`;
  }
  const ev = (cls) => `<i class="evdot ${cls || ''}" data-ev></i>`;
  const evn = () => '<span class="evn" data-ev></span>';

  const CARET = '<svg class="car" viewBox="0 0 12 12"><path d="M2 4 L6 8 L10 4"/></svg>';
  const TALLY = '<span class="tally"><i data-step="1"></i><i data-step="2"></i></span>';
  const FL = (s) => `<svg class="fl" data-step="${s}" viewBox="0 0 16 22"><path d="M8 1 C9 6 14 9 14 14 A6 6 0 0 1 2 14 C2 11 4 9.5 5 7 C6 8 6.5 8.5 7 9 C7.5 6 7.5 3.5 8 1 Z"/></svg>`;
  const PH = (t) => `<div class="ph"><span class="k">${t}</span><span class="ex">Example</span></div>`;
  const NX = '<div class="nx"><span class="big">Day <span class="num" data-f="d"></span></span><span class="bar"><i></i><u></u></span><span class="pr"></span></div>';
  const PF = (t) => `<div class="pf">${t || '2 victories = 1 day'}</div>`;
  const fill = (n) => `data-fill="${n}"`;
  const xp = (cls, plate, panel, pos) => anc(`${cls} xp`, `${plate}<div class="pn ${pos}">${panel}</div>`, 'aria-expanded="false"');

  /* U8 referans (day-counter-4) */
  const RL = '<i class="rl"><b data-step="1"></b></i>';
  const RR = '<i class="rl r"><b data-step="2"></b></i>';
  const LAB = '<span class="ul">Day <span class="num" data-f="d"></span></span>';
  const UEV = '<i class="uev" data-ev></i>';

  const V = {
    R1: { n: 'Genişleyen liste', exp: true, note: 'Menu düğmelerinin soluna "DAY 7 + iki çetele + ok" plakası; tıklayınca aşağı açılır: sonraki güne çubuk, Bugün / Yarın / Sonra gruplu renkli olay listesi (Example).', build: () => base({ right: xp('R1', `<button class="cp"><span class="lb">Day</span>${num()}${TALLY}${evn()}${CARET}</button>`, `${PH('Calendar')}${NX}<div ${fill('list')}></div>${PF()}`, 'below-r') }) },
    U8: { n: 'U8 (referans)', note: 'Ömer\'in seçtiği U8 aynen: üst kenar ortada cetvel, altında "Next day 1/2", gün dönüşünde şafak dalgası. Karşılaştırma için.', build: () => base({ center: anc('U u8', RL + LAB + RR + '<i class="wv"></i><span class="cap">Next day <span class="pr"></span></span>' + UEV + pop('below-c')) }) },
    R2: { n: 'Mini takvim (sola açılır)', exp: true, note: 'Sağ kenara yapışık "DAY 7" yer imi (Menu düğmelerinin altı); tıklayınca sola 7 günlük mini takvim açılır, gün hücreleri tıklanır, renkli noktalar olay türünü gösterir, altında seçili günün olayları.', build: () => base({ right: xp('R2', `<button class="cp"><span class="lb">Day</span>${num()}${TALLY}${evn()}</button>`, `${PH('Next 7 days')}<div ${fill('cal')}></div>${PF()}`, 'left') }) },
    R3: { n: 'Zaman çizgisi', exp: true, note: 'Plaka içinde küçük zaman çizgisi önizlemesi (kor elmas = bugün, renkli çentik = olay); tıklayınca dikey zaman çizgisi: Now düğümü ve günlere asılı olaylar.', build: () => base({ right: xp('R3', `<button class="cp"><span class="lb">Day</span>${num()}<span class="mini" ${fill('ticks')}></span>${evn()}${CARET}</button>`, `${PH('Timeline')}<div ${fill('tl')}></div>${PF()}`, 'below-r') }) },
    R4: { n: 'Madalyon + sekmeler', exp: true, note: 'Menu düğmelerinin altında kesik halkalı madalyon (iki yay = iki zafer); tıklayınca aşağı açılır: Agenda / Town / Danger sekmeleri, her sekmede o türün olayları.', build: () => base({ right: xp('R4', `<button class="md"><svg viewBox="0 0 68 68"><circle class="bd" cx="34" cy="34" r="25"/><path class="arc" data-step="1" d="M41.3 6.7 A28.5 28.5 0 0 1 41.3 61.3"/><path class="arc" data-step="2" d="M26.7 61.3 A28.5 28.5 0 0 1 26.7 6.7"/></svg><span class="qd"><small>Day</small>${num()}</span>${evn()}</button>`, `${PH('Calendar')}${NX}<div ${fill('tabs')}></div>${PF()}`, 'below-r') }) },
    R5: { n: 'Olay kartları', exp: true, note: 'İki satırlı plaka: "DAY 7 · 1/2" ve altında sıradaki olay yazısı; tıklayınca aşağı açılır: Quest / Gate / Market / Threat kart plakaları, sağda gün sayacı rakamı.', build: () => base({ right: xp('R5', `<button class="cp"><span class="num" data-f="d"></span><span class="tx"><span class="l1">Day · <span class="pr"></span></span><span class="l2" ${fill('next')}></span></span>${evn()}${CARET}</button>`, `${PH('Coming up')}<div ${fill('cards')}></div>${PF()}`, 'below-r') }) },
    R6: { n: 'Şafak yayı (sabit)', note: 'Sabit zengin pano (Menu altı): büyük "Day 7", gökyüzü yayı üzerinde zafer başına ilerleyen güneş (sol ufuk → tepe → sağ ufuk), alt satırda olay çipleri; gün dönüşünde şafak dalgası; hover = A Band ipucu.', build: () => base({ right: anc('R6 plate', `<span class="wvw"><i class="wv"></i></span><div class="r6h"><span class="big">Day ${num()}</span><span class="nd">Next day <span class="pr"></span></span></div><svg class="arc" viewBox="0 0 300 64"><path class="hz" d="M0 52H300"/><path class="ar" d="M10 52 A140 46 0 0 1 290 52"/><g class="sun"><circle class="halo" r="11"/><circle r="5.5"/></g></svg><div class="chs" ${fill('chips')}></div>${pop('below-r')}`) }) },
    R7: { n: 'Dikey sütun (sabit)', note: 'Sağ kenarda dikey sütun: üstte gün rakamı, ortada iki aşamalı kor çubuğu (alttan dolar, ortada çentik), altında olay simgeleri + kalan gün; hover = ipucu (sola açılır).', build: () => base({ right: anc('R7 plate', `<span class="lb">Day</span>${num()}<span class="rail"><i></i><u></u></span><span class="pr"></span><div class="mk" ${fill('rail')}></div>${pop('left')}`) }) },
    R8: { n: 'Çift satır + akan olay (sabit)', note: 'Menu soluna iki satırlı plaka: "DAY 7" + iki zincir halkası + 1/2; alt satırda her 3 sn değişen örnek olay yazısı (kayarak girer); gün dönüşünde şafak dalgası; hover/dokun = A Band ipucu.', build: () => base({ right: anc('R8 plate', `<span class="wvw"><i class="wv"></i></span><div class="r1"><span class="lb">Day</span>${num()}<span class="lks"><i class="lk" data-step="1"></i><i class="lk" data-step="2"></i></span><span class="pr"></span></div><div class="tick" ${fill('ticker')}></div>${evn()}${pop('below-r')}`) }) },
    R9: { n: 'Mühür + defter', exp: true, note: 'Menu soluna mühür biçimli hap plaka; tıklayınca geniş "defter": solda devasa gün rakamı + iki kor elması + 1/2, sağda gruplu olay listesi.', build: () => base({ right: xp('R9', `<button class="cp"><span class="lb">Day</span>${num()}${evn()}${CARET}</button>`, `<div class="lgl"><div class="k">Day</div>${num()}<div class="ph9"><i data-step="1"></i><i data-step="2"></i></div><div class="pr"></div></div><div>${PH('Chronicle')}<div ${fill('list')}></div></div>${PF()}`, 'below-r') }) },
    R10: { n: 'Alevler + 2x2 pano', exp: true, note: 'Menu altında iki alevli plaka (zafer başına bir alev); tıklayınca 2x2 pano: Quests / Gates / Shops / Threats, her kutuda en yakın olayın geri sayımı büyük rakamla.', build: () => base({ right: xp('R10', `<button class="cp"><span class="lb">Day</span>${num()}${FL(1)}${FL(2)}${evn()}${CARET}</button>`, `${PH('At a glance')}${NX}<div ${fill('grid')}></div>${PF()}`, 'below-r') }) },
  };
  const ORDER = ['R1', 'U8', 'R2', 'R3', 'R4', 'R5', 'R6', 'R7', 'R8', 'R9', 'R10'];

  /* ---- iskele ---- */
  const $ = (s) => document.querySelector(s);
  const ui = $('#ui');
  const chrome = () => `${MK.navBtn('back', 'Back')}${MK.navBtn('fs', 'Fullscreen')}${MK.navBtn('menu', 'Menu')}`;
  function render() {
    const r = document.documentElement;
    r.classList.toggle('u8', st.tab === 'U8'); r.classList.toggle('mk-phone', st.phone); r.classList.toggle('short', st.phone); r.classList.toggle('compact', st.phone);
    r.style.setProperty('--sc', String((st.phone ? 390 : 900) / 1080));
    $('#bg').style.backgroundImage = `url(${MK.bg('valdoria')})`;
    ui.innerHTML = `<div class="mk-stage dc-stage" id="stg">${V[st.tab].build()}</div>${chrome()}`;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === st.tab));
    $('#bDesk').classList.toggle('on', !st.phone); $('#bPhone').classList.toggle('on', st.phone);
    $('#vtag').textContent = `${st.tab} · ${V[st.tab].n}${V[st.tab].exp ? ' · tıkla: açılır' : ''}`; $('#vnote').textContent = V[st.tab].note;
    fit(); sync(false);
    if (st.open) document.querySelectorAll('.anc.xp').forEach((a) => a.classList.add('open'));
    location.hash = st.tab + (st.phone ? '&phone' : '') + (st.open ? '&open' : '');
  }
  function fit() { $('#zoom').style.zoom = String(Math.min(1, $('#zw').clientWidth / (st.phone ? 844 : 1600))); }
  function sync(roll) {
    const stg = $('#stg'); const ag = agenda();
    stg.style.setProperty('--f', String(st.vic / 2));
    const t = st.vic / 2;
    stg.style.setProperty('--sx', `${10 + 280 * t}px`); stg.style.setProperty('--sy', `${52 - 46 * Math.sin(Math.PI * t)}px`);
    stg.querySelectorAll('.num').forEach((e) => {
      const v = String(st.day);
      if (e.textContent !== v) { e.textContent = v; if (roll) { e.classList.remove('roll'); void e.offsetWidth; e.classList.add('roll'); } }
    });
    stg.querySelectorAll('.pr').forEach((e) => { e.textContent = `${st.vic}/2`; });
    stg.querySelectorAll('[data-step]').forEach((e) => {
      const was = e.classList.contains('on'); const on = st.vic >= +e.dataset.step;
      e.classList.toggle('on', on);
      if (on && !was) { e.classList.remove('hit'); void e.getBoundingClientRect(); e.classList.add('hit'); }
    });
    const c = soon(ag);
    stg.querySelectorAll('[data-ev]').forEach((e) => { e.hidden = !c; if (e.classList.contains('evn')) e.textContent = String(c); });
    stg.querySelectorAll('[data-fill]').forEach((e) => { e.innerHTML = FILL[e.dataset.fill](ag); });
    const tp = tipHtml(ag);
    stg.querySelectorAll('.dc-pop').forEach((p) => { p.innerHTML = tp; });
    if (roll) stg.querySelectorAll('.anc').forEach((a) => { a.classList.remove('glow'); void a.offsetWidth; a.classList.add('glow'); });
    $('#ro').textContent = `Day ${st.day} · ${st.vic}/2`;
  }
  function victory() {
    if (st.busy) return;
    if (st.vic === 0) { st.vic = 1; sync(false); return; }
    st.vic = 2; st.busy = true; sync(false);
    st.timer = setTimeout(() => { st.day += 1; st.vic = 0; st.busy = false; if (st.sel < st.day) st.sel = st.day; sync(true); }, 360);
  }
  function reset() { clearTimeout(st.timer); st.day = 7; st.vic = 0; st.busy = false; st.sel = 7; st.sub = 'Agenda'; sync(false); }
  function closeAll(except) { document.querySelectorAll('.anc.open,.anc.tipon').forEach((x) => { if (x !== except) { x.classList.remove('open', 'tipon'); x.setAttribute('aria-expanded', 'false'); } }); st.open = !!document.querySelector('.anc.open'); }

  const tabs = $('#tabs');
  ORDER.forEach((k) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.t = k; b.textContent = k; b.title = V[k].n; b.addEventListener('click', () => { st.tab = k; closeAll(); st.open = false; render(); }); tabs.append(b); });
  $('#bSim').addEventListener('click', victory); $('#bRst').addEventListener('click', reset);
  $('#bDesk').addEventListener('click', () => { st.phone = false; render(); }); $('#bPhone').addEventListener('click', () => { st.phone = true; render(); });
  document.addEventListener('click', (e) => {
    const sub = e.target.closest('[data-tab]'); if (sub) { st.sub = sub.dataset.tab; sync(false); return; }
    const cal = e.target.closest('[data-cal]'); if (cal) { st.sel = +cal.dataset.cal; sync(false); return; }
    if (e.target.closest('.ctl') || e.target.closest('#tabs')) return;
    const a = e.target.closest('.anc');
    closeAll(a);
    if (!a) return;
    if (a.classList.contains('xp')) { if (e.target.closest('.pn')) return; a.classList.toggle('open'); a.setAttribute('aria-expanded', String(a.classList.contains('open'))); st.open = a.classList.contains('open'); }
    else a.classList.toggle('tipon');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
  window.addEventListener('resize', fit);
  setInterval(() => { st.tick += 1; const t = document.querySelector('.tick'); if (t) { t.innerHTML = FILL.ticker(agenda()); t.classList.remove('sw'); void t.offsetWidth; t.classList.add('sw'); } }, 3200);
  function readHash() { const p = location.hash.replace(/^#/, '').split('&'); if (V[p[0]]) st.tab = p[0]; st.phone = p.includes('phone'); st.open = p.includes('open'); }
  window.addEventListener('hashchange', () => { const b = st.tab + st.phone + st.open; readHash(); if (b !== st.tab + st.phone + st.open) render(); });
  readHash(); render();
})();
</script>
</body>
</html>
