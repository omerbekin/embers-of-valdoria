.page { position: relative; z-index: 1; padding: 10px 16px 24px; min-height: 100vh; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; background: rgba(12,8,5,.78); border: 1px solid var(--g-line); border-radius: 8px; padding: 7px 12px; margin-bottom: 8px; }
.top h1 { margin: 0; font: 600 17px var(--g-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--g-gold); }
.top .desc { flex: 1 1 320px; font: 15px/1.25 var(--g-body); color: var(--g-text); }
.nav { display: flex; flex-wrap: wrap; gap: 4px; }
.nav a { font: 600 12px var(--g-disp); letter-spacing: .08em; text-transform: uppercase; color: var(--g-dim); text-decoration: none; border: 1px solid var(--g-line); border-radius: 5px; padding: 4px 9px; background: rgba(0,0,0,.35); }
.nav a.on { color: #1b0f08; background: var(--g-gold); border-color: var(--g-gold); }
.nav .sep { width: 8px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: start; }
.wide { grid-column: 1 / -1; }
@media (min-width: 1000px) { .grid { grid-template-columns: 1fr 1fr; } }
.sec { background: rgba(12,8,5,.0); border-radius: 8px; padding: 2px 0; min-width: 0; }
.sec.panel { background: #1a120c; border: 1px solid var(--g-line); padding: 6px 8px; }
.sec h2 { margin: 0 0 2px; font: 600 11px var(--g-disp); letter-spacing: .14em; text-transform: uppercase; color: var(--g-gold); text-shadow: 0 1px 3px #000, 0 0 6px #000; }
.sec.panel h2 { text-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: flex-end; }
.cell { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; }
.smp { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; font-family: var(--num); font-weight: 700; padding: 2px 2px 0; }
.cap { font: 600 10px/1.15 var(--g-body); letter-spacing: .02em; color: #e9dcc0; background: rgba(8,5,3,.74); border-radius: 4px; padding: 1px 5px; margin-top: 1px; text-align: center; white-space: nowrap; }
.cap i { font-style: normal; color: var(--g-gold); }
.num { display: inline-grid; line-height: 1; padding: .04em .02em; }
.num > span { grid-area: 1 / 1; white-space: nowrap; }
.nb, .nr { paint-order: stroke fill; stroke-linejoin: round; }
.nf { color: transparent; -webkit-text-fill-color: transparent; }
.word { font-family: Cinzel, Georgia, serif; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.ico { display: block; flex: none; overflow: visible; }
.pairs { grid-column: 1 / -1; }
.pgroup { display: inline-flex; flex-direction: column; background: rgba(8,5,3,.55); border: 1px solid var(--g-line); border-radius: 8px; padding: 3px 8px 4px; margin: 0 4px 4px 0; vertical-align: top; }
.pgroup .pt { font: 600 10px var(--g-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--g-dim); }
.pline { display: flex; align-items: center; gap: 4px; }
.pline .tag { font: 700 9px var(--g-disp); letter-spacing: .1em; color: #1b0f08; background: #b8a98a; border-radius: 3px; padding: 1px 4px; width: 34px; text-align: center; flex: none; }
.pline.new .tag { background: var(--g-gold); }
.pline .smp { padding: 0 4px; }
.pgroups { display: flex; flex-wrap: wrap; }
html.short .page { padding: 6px 8px 16px; }
html.short .top h1 { font-size: 14px; }
html.short .top .desc { font-size: 13px; }
</style>

    b: { name: 'B', desc: 'A colours plus a tiny glyph before the number for the clashing types: ice crystal, bolt, holy cross, dark moon, arcane star, shield, magic shield, dodge swish.', col: A, mode: 'plain', glyph: { ice: 'ice', lightning: 'bolt', holy: 'holy', dark: 'dark', arcane: 'arcane', shield: 'shield', mshield: 'mshield', dodge: 'dodge' } },
    c: { name: 'C', desc: 'Shield, magic shield, dodge and miss go neutral white/grey with their own icon, so every blue and purple belongs to an element. Elements: ice stays blue, lightning yellow, holy gold, arcane pink.', col: C, mode: 'plain', glyph: { shield: 'shield', mshield: 'mshield', dodge: 'dodge', miss: 'miss' } },
    d: { name: 'D', desc: 'Two-tone: a pale fill plus a saturated coloured rim inside the dark outline. The rim is a second hue channel, so near fills (ice vs lightning, dark vs arcane) separate by edge colour. No glyphs.', col: D, rim: DRIM, mode: 'dual' }
  };

  function hx(h) { return parseInt(h.replace('#', ''), 16); }
  function lighten(h, a) { var n = hx(h); return '#' + [16, 8, 0].map(function (s) { var v = (n >> s) & 255; return Math.round(v + (255 - v) * a).toString(16).padStart(2, '0'); }).join(''); }
  function darken(h, a) { var n = hx(h); return '#' + [16, 8, 0].map(function (s) { return Math.round(((n >> s) & 255) * (1 - a)).toString(16).padStart(2, '0'); }).join(''); }

  // mirror of floatStyle() in src/game/float-text.ts
  function styleFor(kind, size, hex) {
    var s = { stroke: '#1b0f08', th: Math.max(4, Math.round(size / 5)), top: lighten(hex, 0.45), glow: false, weight: 700 };
    if (kind === 'damage') { s.stroke = darken(hex, 0.86); s.th = Math.max(5, Math.round(size / 4.2)); }
    else if (kind === 'crit') { s.stroke = '#3a1204'; s.th = Math.max(6, Math.round(size / 3.8)); s.top = '#fff6c8'; s.glow = true; }
    else if (kind === 'heal') { s.stroke = '#0c2a16'; s.top = lighten(hex, 0.55); }
    else if (kind === 'shield') { s.stroke = '#0e1a24'; s.top = lighten(hex, 0.5); }
    else if (kind === 'miss') { s.stroke = '#26200f'; s.th = Math.max(3, Math.round(size / 7)); s.top = null; }
    else if (kind === 'dodge') { s.stroke = '#14222f'; s.th = Math.max(3, Math.round(size / 6.5)); s.top = lighten(hex, 0.6); }
    return s;
  }

  function glyphSvg(name, hex, d, line) {
    var base = '<svg class="ico" width="' + d + '" height="' + d + '" viewBox="0 0 24 24">';
    if (name === 'dodge') {
      return base + '<use href="#g-dodge" stroke="#1b0f08" stroke-width="6"/><use href="#g-dodge" stroke="' + hex + '" stroke-width="2.8"/></svg>';
    }
    return base + '<use href="#g-' + name + '" fill="' + hex + '" stroke="#1b0f08" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"/><use href="#g-' + name + '" fill="' + hex + '" stroke="none"/></svg>';
  }

  // one floating text. d = {text, hex, kind, px, rim, glyph, burst, word}
  function sample(d, u) {
    var px = Math.max(10, Math.round(d.px * u));
    var st = styleFor(d.kind, d.px, d.hex);
    var th = Math.max(2, Math.round(st.th * u));
    var fill = st.top ? 'linear-gradient(180deg,' + st.top + ' 0%,' + d.hex + ' 55%,' + d.hex + ' 100%)' : d.hex;
    var sh = Math.max(1, Math.round(px / 14)), bl = Math.max(2, Math.round(px / 8));
    var fx = st.glow ? 'drop-shadow(0 0 ' + Math.max(6, Math.round(px / 4)) + 'px rgba(240,140,40,.9))' : 'drop-shadow(0 ' + sh + 'px ' + bl + 'px rgba(0,0,0,.85))';
    var gap = -Math.round(px * 0.07);
    var out = '<span class="smp" style="font-size:' + px + 'px">';
    var icoD = Math.round(px * 0.66);
    if (d.burst) out += '<img class="ico" alt="" src="' + BURST + '" width="' + icoD + '" height="' + icoD + '" style="margin-right:' + gap + 'px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))">';
    if (d.glyph) out += '<span style="display:inline-flex;filter:drop-shadow(0 ' + sh + 'px ' + bl + 'px rgba(0,0,0,.7));margin-right:' + Math.round(px * 0.06) + 'px">' + glyphSvg(d.glyph, d.hex, Math.round(px * 0.74)) + '</span>';
    var cls = d.word ? ' word' : '';
    var wfs = d.word ? ';font-size:' + Math.round(px * 0.8) + 'px' : '';
    var txt = d.text;
    var spans = '';
    if (d.rim) {
      spans += '<span class="nb' + cls + '" style="-webkit-text-stroke:' + Math.round(th * 1.35) + 'px ' + st.stroke + ';color:' + st.stroke + wfs + '">' + txt + '</span>';
      spans += '<span class="nr' + cls + '" style="-webkit-text-stroke:' + Math.max(2, Math.round(th * 0.8)) + 'px ' + d.rim + ';color:' + d.rim + wfs + '">' + txt + '</span>';
    } else {
      spans += '<span class="nb' + cls + '" style="-webkit-text-stroke:' + th + 'px ' + st.stroke + ';color:' + st.stroke + wfs + '">' + txt + '</span>';
    }
    spans += '<span class="nf' + cls + '" style="background:' + fill + ';-webkit-background-clip:text;background-clip:text' + wfs + '">' + txt + '</span>';
    out += '<span class="num" style="filter:' + fx + '">' + spans + '</span></span>';
    return out;
  }

  function spec(opt, key, crit, px) {
    var isEl = ELS.indexOf(key) >= 0;
    var hex = opt.col[key];
    var d = { hex: hex, px: px, glyph: opt.glyph && opt.glyph[key] ? opt.glyph[key] : null, rim: opt.rim ? opt.rim[key] : null };
    if (isEl) { d.kind = crit ? 'crit' : 'damage'; d.text = crit ? '112' : '58'; d.px = px + (crit ? 9 : 0); d.burst = !!crit; }
    else if (key === 'heal') { d.kind = 'heal'; d.text = '+34'; }
    else if (key === 'shield') { d.kind = 'shield'; d.text = '34'; }
    else if (key === 'mshield') { d.kind = 'shield'; d.text = '34'; }
    else if (key === 'dodge') { d.kind = 'dodge'; d.text = 'Dodge'; d.word = true; }
    else { d.kind = 'miss'; d.text = 'Miss'; d.word = true; }
    return d;
  }

  function cap(opt, key) {
    var s = LABEL[key] + ' <i>' + opt.col[key] + '</i>';
    if (opt.rim) s += ' / <i>' + opt.rim[key] + '</i>';
    return s;
  }

  function rowOf(opt, keys, crit, px, u, showCap) {
    var h = '<div class="row">';
    keys.forEach(function (k) { h += '<div class="cell">' + sample(spec(opt, k, crit, px), u) + (showCap ? '<div class="cap">' + cap(opt, k) + '</div>' : '') + '</div>'; });
    return h + '</div>';
  }

  function sec(title, inner, cls) { return '<div class="sec ' + (cls || '') + '"><h2>' + title + '</h2>' + inner + '</div>'; }

  var GROUPS = [
    ['Ice / shield / dodge', ['ice', 'shield', 'dodge']],
    ['Lightning / ice / physical', ['lightning', 'ice', 'physical']],
    ['Holy / physical / lightning', ['holy', 'physical', 'lightning']],
    ['Dark / arcane / magic shield', ['dark', 'arcane', 'mshield']],
    ['Heal / nature', ['heal', 'nature']]
  ];

  function pairLine(opt, keys, u, px) {
    var h = '';
    keys.forEach(function (k) { h += sample(spec(opt, k, false, px), u); });
    return h;
  }

  function render() {
    var m = /^#?([a-z]+?)(2?)$/.exec(location.hash || '#now') || [];
    var id = OPTS[m[1]] ? m[1] : 'now';
    var cave = m[2] === '2';
    var opt = OPTS[id];
    document.documentElement.classList.toggle('cave', cave);
    document.getElementById('ttl').textContent = id === 'now' ? 'Damage Colours: today' : 'Damage Colours: option ' + opt.name;
    document.getElementById('desc').textContent = opt.desc;
    var nav = '';
    ['now', 'a', 'b', 'c', 'd'].forEach(function (k) { nav += '<a href="#' + k + (cave ? '2' : '') + '" class="' + (k === id ? 'on' : '') + '">' + (k === 'now' ? 'Today' : k.toUpperCase()) + '</a>'; });
    nav += '<span class="sep"></span><a href="#' + id + '" class="' + (cave ? '' : 'on') + '">Sunset</a><a href="#' + id + '2" class="' + (cave ? 'on' : '') + '">Cave</a>';
    document.getElementById('nav').innerHTML = nav;

    var w = window.innerWidth, h = window.innerHeight;
    var u = Math.max(0.42, Math.min(w / 1920, h / 1080, 1));
    var BASE = 52;
    var html = '';
    html += sec('Normal hits (52 px class), crits, other texts', rowOf(opt, ELS, false, BASE, u, true) + '<div style="height:3px"></div>' + rowOf(opt, ELS, true, BASE, u, false) + '<div style="height:3px"></div>' + rowOf(opt, STS, false, BASE, u, true), 'wide');
    html += sec('On a dark UI panel', rowOf(opt, ELS.concat(STS), false, BASE, u, false), 'panel');
    html += sec('2x size', rowOf(opt, ELS, false, BASE * 2, u, false) + '<div style="height:2px"></div>' + rowOf(opt, STS, false, BASE * 2, u, false));
    var pu = '<div class="pgroups">';
    GROUPS.forEach(function (g) {
      pu += '<div class="pgroup"><div class="pt">' + g[0] + '</div>';
      if (id !== 'now') pu += '<div class="pline"><span class="tag">NOW</span>' + pairLine(OPTS.now, g[1], u, 40) + '</div>';
      pu += '<div class="pline new"><span class="tag">' + (id === 'now' ? 'NOW' : opt.name) + '</span>' + pairLine(opt, g[1], u, 40) + '</div></div>';
    });
    pu += '</div>';
    html += '<div class="sec pairs"><h2>Closest pairs: today vs this option</h2>' + pu + '</div>';
    document.getElementById('grid').innerHTML = html;
  }

  function flags() { document.documentElement.classList.toggle('short', window.innerHeight < 480); }
  window.addEventListener('hashchange', render);
  window.addEventListener('resize', function () { flags(); render(); });
  flags();
  render();
})();
</script>
</body>
</html>
