<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta name="darkreader-lock" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gear Unified Mockups</title>
<!--
  Gear + torba BİRLEŞTİRME taslağı v2 (ui-dev, 2026-10-11). Ömer g1 "Refined current"ı seçti; bu sayfa onun düzeltmeleriyle onay taslağıdır.
  Oyun kodu DEĞİL. Ekranlar (adres #ekran, ek seçenekler "&" ile: phone, tip, drag):
    #gear              Gear (g1): skill'ler en altta sol kenardan başlar, kahraman sütunu skill'lerin üstüne kadar uzar (sığmazsa kayar)
    #merchant          Tüccar (g1 ortak torba + kart; Reroll'da altın ikonu)
    #welcome-a/b/c     Tüccar karşılama seçenekleri (A tam ekran parşömen, B savaş alanına giriş + konuşma kutusu, C yarım panel kayıp çekilir)
    #reward            Bugünkü ödül seçimi (DEĞİŞMEDİ) + altta "View bag"
    #reward-bag        Torba açıldı: kartlar üstte küçük ikonlara döner, torba büyür (ikon üstüne gelince / uzun basınca ne verdiği)
    #reward-compare    Karşılaştırma: ödül ikonu seçili, torbadaki item ile yan yana fark
  Taslak içindeki düğmeler (View bag / Close bag / Browse wares / Replay) canlı geçişi oynatır; Reduced motion'da geçiş yok.
  Görseller oyunun asset'leri (gear-unified/); Odo tam boy: assets/source/merchant/82.webp, arka plan: assets/backgrounds/proving-grounds-sunset.
-->
<style>
@font-face { font-family: 'Cinzel'; font-weight: 400 900; font-display: block; src: url('gear-unified/fonts/Cinzel-normal-latin.woff2') format('woff2'); }
@font-face { font-family: 'EB Garamond'; font-weight: 400 800; font-display: block; src: url('gear-unified/fonts/EBGaramond-normal-latin.woff2') format('woff2'); }
@font-face { font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: block; src: url('gear-unified/fonts/EBGaramond-italic-latin.woff2') format('woff2'); }
:root {
  color-scheme: dark;
  --gold: 217, 178, 106;
  --on: #f6dea0; --txt: #efe3c6; --sub: #d6c49c; --muted: #b8a682; --dim: #8f8068;
  --ember: #e0702a; --ember2: #ffb35a; --up: #9be37a; --down: #ff8f78;
  --cin: Cinzel, Georgia, serif; --gar: 'EB Garamond', Georgia, serif;
  --ease: cubic-bezier(.33, 1, .68, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #050403; color: var(--txt); font-family: var(--gar); overflow: hidden; }
button { font: inherit; color: inherit; }

/* --- üst çubuk (taslak kontrolü; oyunda yok) --- */
#bar { position: fixed; left: 0; right: 0; top: 0; height: 56px; z-index: 50; display: flex; align-items: center; gap: 14px; padding: 0 12px;
  background: #0d0a07; border-bottom: 1px solid rgba(var(--gold), .3); font: 600 13px var(--cin); letter-spacing: .06em; overflow-x: auto; }
#bar .grp { display: flex; gap: 3px; align-items: center; flex: none; }
#bar .grp > span { color: var(--muted); margin-right: 5px; font-size: 11px; letter-spacing: .18em; }
#bar button { background: transparent; border: 1px solid rgba(var(--gold), .25); padding: 7px 9px; cursor: pointer; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
#bar button.on { border-color: var(--on); color: var(--on); background: rgba(224,112,42,.12); }
#wrap { position: fixed; left: 0; right: 0; top: 56px; bottom: 0; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #070504; }

#stage.desk { width: 1920px; height: 1080px; --t0: 17px; --t1: 19px; --t2: 22px; --t3: 25px; --t4: 30px; --th: 46px; --g: 18px; --g2: 10px; --cell: 84px; --pad: 30px; --ico: 26px; --btnh: 56px; }
#stage.phone { width: 844px; height: 390px; --t0: 11.5px; --t1: 13px; --t2: 14px; --t3: 15px; --t4: 17px; --th: 20px; --g: 7px; --g2: 4px; --cell: 44px; --pad: 9px; --ico: 16px; --btnh: 44px; }

/* --- ekran çerçevesi (çalışma paneli: başlık sol üst, bağlam sağ üst) --- */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; padding: var(--pad); gap: var(--g);
  background: radial-gradient(ellipse at 30% 0%, rgba(60,40,22,.55), transparent 60%), linear-gradient(180deg, #1c140d, #0c0906); }
.head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(var(--gold), .2); padding-bottom: var(--g2); flex: none; }
.title { font: 600 var(--th) var(--cin); letter-spacing: .12em; text-transform: uppercase; background: linear-gradient(180deg, #fff0c4, #e8c47e 55%, #c0924a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.title small { font-size: .5em; letter-spacing: .2em; color: var(--muted); -webkit-text-fill-color: var(--muted); margin-left: .8em; }
.ctxr { display: flex; align-items: center; gap: 10px; font: 600 var(--t3) var(--cin); color: var(--on); letter-spacing: .06em; }
.ctxr img { width: calc(var(--ico) * 1.3); height: calc(var(--ico) * 1.3); }
.sec { font: 600 var(--t1) var(--cin); letter-spacing: .2em; text-transform: uppercase; color: rgba(236,200,130,.95); padding-bottom: 4px; border-bottom: 1px solid rgba(var(--gold), .2); margin-bottom: var(--g2); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.sec .cnt { margin-left: auto; letter-spacing: .06em; color: var(--sub); }
.sec img { width: var(--ico); height: var(--ico); }
.foot { display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--g) * 1.4); border-top: 1px solid rgba(var(--gold), .2); padding-top: var(--g2); flex: none; }
.hint { font: italic var(--t1) var(--gar); color: var(--sub); margin-right: auto; }
.btn { position: relative; min-height: var(--btnh); padding: 0 calc(var(--g) * 1.4); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  background: linear-gradient(180deg, rgba(34,25,16,.9), rgba(12,9,6,.92)); border: 1px solid rgba(var(--gold), .38); font: 600 var(--t1) var(--cin);
  letter-spacing: .1em; text-transform: uppercase; color: var(--txt); white-space: nowrap; }
.btn.primary { border: 2px solid #d9b26a; color: var(--on); }
.btn.primary::before, .btn.primary::after { content: ''; position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; transform: rotate(45deg); background: var(--ember); box-shadow: 0 0 0 1px var(--ember2), 0 0 10px rgba(240,140,40,.8); }
.btn.primary::before { left: -6px; } .btn.primary::after { right: -6px; }
.btn.danger { border-color: rgba(255,143,120,.55); color: var(--down); }
.btn.off { opacity: .45; }
.btn.sm { min-height: calc(var(--btnh) * .82); font-size: var(--t0); padding: 0 var(--g); }
.btn img { width: var(--ico); height: var(--ico); }
.btn .cost { display: inline-flex; align-items: center; gap: 4px; color: var(--on); }
.chip { min-height: calc(var(--btnh) * .74); padding: 0 calc(var(--g) * .8); border: 1px solid rgba(var(--gold), .3); background: rgba(8,6,4,.6); font: 600 var(--t0) var(--cin); letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; color: var(--sub); white-space: nowrap; }
.chip.on { border-color: var(--on); color: var(--on); }
.scroll { overflow: hidden auto; min-height: 0; scrollbar-width: thin; scrollbar-color: rgba(var(--gold), .4) transparent; }

/* --- item hücresi (TEK bileşen) --- */
.r-common { --rc: #8a8a84; --rl: #c9c6ba; --rt: #cfccc0; }
.r-uncommon { --rc: #5f8f3e; --rl: #9ad46e; --rt: #a6de7c; }
.r-rare { --rc: #3f6fa8; --rl: #7fb2f0; --rt: #8ebcf4; }
.r-epic { --rc: #7a3f9a; --rl: #c48ae6; --rt: #cf9cf0; }
.r-legendary { --rc: #f0a830; --rl: #ffd27a; --rt: #ffcf70; }
.r-gold { --rc: #c9a050; --rl: #f3d999; --rt: #f3d999; }
.r-heal { --rc: #b0503c; --rl: #f09a80; --rt: #f6b09a; }
.it { position: relative; width: var(--cell); height: var(--cell); flex: none; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--rc) 18%, transparent), rgba(10,7,5,.95) 72%);
  border: 1px solid color-mix(in srgb, var(--rc) 80%, transparent); cursor: grab; }
.it.k2, .it.k3, .it.k4 { border-width: 2px; }
.it img.art { width: 82%; height: 82%; object-fit: contain; filter: drop-shadow(0 2px 2px #000); }
.it::before, .it::after, .it .c2, .it .c3 { content: ''; position: absolute; width: 26%; height: 26%; pointer-events: none; }
.it::before { left: -1px; top: -1px; border-left: 2px solid var(--rl); border-top: 2px solid var(--rl); }
.it::after { right: -1px; bottom: -1px; border-right: 2px solid var(--rl); border-bottom: 2px solid var(--rl); }
.it .c2 { right: -1px; top: -1px; border-right: 2px solid var(--rl); border-top: 2px solid var(--rl); }
.it .c3 { left: -1px; bottom: -1px; border-left: 2px solid var(--rl); border-bottom: 2px solid var(--rl); }
.it.k4 { box-shadow: 0 0 calc(var(--cell) * .22) color-mix(in srgb, var(--rc) 55%, transparent); }
.it.no img.art { filter: grayscale(1) brightness(.6); opacity: .55; }
.it.empty { border: 1px dashed rgba(var(--gold), .2); background: rgba(8,6,4,.35); cursor: default; }
.it.empty::before, .it.empty::after { display: none; }
.it.empty img.slotico { width: 56%; height: 56%; opacity: .22; filter: grayscale(1); }
.it.sel { outline: 3px solid var(--rl); outline-offset: 3px; box-shadow: 0 0 calc(var(--cell) * .35) color-mix(in srgb, var(--rl) 60%, transparent); }
.it .dia, .mt .dia { position: absolute; left: 50%; top: -12px; width: 15px; height: 15px; margin-left: -7.5px; transform: rotate(45deg); background: var(--ember); box-shadow: 0 0 0 1px var(--ember2), 0 0 10px rgba(240,140,40,.9); z-index: 2; }
.it.cmp { outline: 2px dashed var(--rl); outline-offset: 3px; }
.it.cmp .vs { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); font: 700 calc(var(--t0) * .8) var(--cin); background: #1a120a; border: 1px solid var(--rl); color: var(--rl); padding: 0 4px; letter-spacing: .1em; z-index: 2; }
.it.drop-ok { outline: 2px dashed var(--up); outline-offset: 3px; box-shadow: 0 0 calc(var(--cell) * .3) rgba(155,227,122,.5); }
.it .lvl { position: absolute; right: 3px; bottom: 1px; font: 600 var(--t0) var(--cin); color: var(--sub); text-shadow: 0 1px 2px #000, 0 0 4px #000; }
.price { display: flex; align-items: center; justify-content: center; gap: 4px; font: 600 var(--t1) var(--cin); color: var(--on); margin-top: 3px; }
.price img { width: calc(var(--ico) * .85); height: calc(var(--ico) * .85); }
.price.bad { color: var(--down); }
.price.sold { color: var(--dim); letter-spacing: .14em; font-size: var(--t0); }
.cellw { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.bag { display: grid; grid-template-columns: repeat(var(--cols, 6), minmax(0, var(--cell))); gap: var(--g2); align-content: start; justify-content: start; }
.bag .it, .bag .cellw { width: 100%; }
.bag .it { height: auto; aspect-ratio: 1; }
.bagwrap { display: flex; flex-direction: column; min-height: 0; }
.baghead { display: flex; align-items: center; gap: var(--g2); margin-bottom: var(--g2); }
.baghead .sec { margin: 0; border: 0; padding: 0; flex: 1; }
.bin { min-height: calc(var(--btnh) * .74); padding: 0 var(--g); border: 1px dashed rgba(255,143,120,.45); color: var(--down); font: 600 var(--t0) var(--cin); letter-spacing: .1em; text-transform: uppercase; display: inline-flex; align-items: center; }
.bin.drop { border-style: solid; background: rgba(255,143,120,.12); box-shadow: 0 0 14px rgba(255,143,120,.35); }

/* item kartı / ipucu */
.card { background: rgba(10,7,5,.82); border: 1px solid rgba(var(--gold), .3); padding: var(--g); display: flex; flex-direction: column; gap: calc(var(--g2) * .8); min-height: 0; }
.card .nm { display: flex; align-items: center; gap: var(--g2); }
.card .nm .it { --cell: calc(var(--cellbase) * .9); cursor: default; }
.card .nm b { font: 600 var(--t3) var(--cin); letter-spacing: .05em; text-transform: uppercase; color: var(--rt); display: block; line-height: 1.1; }
.card .nm em { font: italic var(--t1) var(--gar); color: var(--sub); display: block; }
.afx { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; column-gap: 8px; row-gap: 3px; font-size: var(--t2); }
.afx .tier { font: 700 var(--t0) var(--cin); width: 1.65em; height: 1.65em; display: grid; place-items: center; border: 1px solid; }
.tC { color: #e6d6ae; border-color: rgba(230,214,174,.55); background: rgba(230,214,174,.07); }
.tB { color: #9cc6ff; border-color: rgba(156,198,255,.6); background: rgba(80,130,200,.14); }
.tA { color: #e2acff; border-color: rgba(226,172,255,.6); background: rgba(150,80,200,.16); }
.afx img { width: var(--ico); height: var(--ico); }
.afx .v { color: #c5ecb0; }
.afx .rng { color: var(--muted); font-size: var(--t1); }
.uniq { font: italic var(--t2) var(--gar); color: #ffd99a; border-left: 2px solid rgba(255,210,122,.6); padding-left: 8px; }
.uniq b { font: 600 var(--t1) var(--cin); font-style: normal; letter-spacing: .06em; color: #ffcf70; }
.meta { display: flex; justify-content: space-between; font: italic var(--t1) var(--gar); color: var(--sub); }
.warn { font-size: var(--t1); color: #ffb088; }
.note { font: italic var(--t1) var(--gar); color: var(--sub); }
.acts { display: flex; gap: calc(var(--g) * 1.2); justify-content: flex-end; margin-top: auto; padding-top: var(--g2); }
.tip { position: absolute; z-index: 30; width: calc(var(--cell) * 5.8); background: linear-gradient(180deg, rgba(28,20,13,.98), rgba(10,7,5,.98)); border: 1px solid rgba(var(--gold), .55);
  box-shadow: 0 0 0 3px rgba(5,3,2,.8), 0 14px 30px rgba(0,0,0,.6); padding: calc(var(--g) * .8); display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
.tip .nm b { font: 600 var(--t2) var(--cin); color: var(--rt); text-transform: uppercase; letter-spacing: .05em; }
.tip .nm em { font: italic var(--t0) var(--gar); color: var(--sub); display: block; }
.tip .afx { font-size: var(--t1); }
.tip .cmpline { font: italic var(--t0) var(--gar); color: var(--sub); border-top: 1px solid rgba(var(--gold), .2); padding-top: 4px; }
.tip .big { font: 600 var(--t4) var(--cin); color: var(--rt); }
#stage.phone .tip { width: 260px; }
.up { color: var(--up); } .down { color: var(--down); }

/* kahraman / yuva / stat / skill */
.heroes { display: flex; flex-direction: column; gap: var(--g2); }
.hero { display: flex; align-items: center; gap: var(--g2); padding: calc(var(--g2) * .8); border: 1px solid rgba(var(--gold), .28); background: rgba(8,6,4,.5); min-height: 44px; position: relative; }
.hero img { width: calc(var(--cell) * .95); height: calc(var(--cell) * .95); border: 1px solid rgba(var(--gold), .55); background: #120c08; flex: none; }
.hero b { font: 600 var(--t2) var(--cin); letter-spacing: .05em; text-transform: uppercase; display: block; }
.hero em { font: italic var(--t1) var(--gar); color: var(--sub); display: block; }
.hero.on { border-color: var(--on); background: linear-gradient(90deg, rgba(224,112,42,.18), rgba(8,6,4,.5) 80%); }
.hero.drop-ok { outline: 2px dashed var(--up); outline-offset: 2px; }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--g2); }
.slot { display: flex; align-items: center; gap: var(--g2); padding: calc(var(--g2) * .7); border: 1px solid rgba(var(--gold), .16); background: rgba(8,6,4,.4); min-width: 0; }
.slot .tx { min-width: 0; }
.slot b { font: 600 var(--t1) var(--cin); letter-spacing: .04em; text-transform: uppercase; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--rt, var(--muted)); }
.slot em { font: italic var(--t0) var(--gar); color: var(--sub); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .it { --cell: calc(var(--cellbase) * .86); }
.stats { display: grid; grid-template-columns: repeat(var(--scols, 4), minmax(0, 1fr)); gap: 4px var(--g); }
.st { display: flex; align-items: center; gap: 6px; font-size: var(--t2); white-space: nowrap; min-width: 0; }
.st img { width: var(--ico); height: var(--ico); flex: none; }
.st .k { font: 600 calc(var(--t0) * .95) var(--cin); letter-spacing: .12em; color: var(--muted); }
.st .v { font: 600 var(--t2) var(--cin); }
.st .d { min-width: 2.6em; font-size: var(--t1); }
.skills { display: grid; grid-template-columns: repeat(var(--kcols, 5), minmax(0, 1fr)); gap: var(--g2); }
.sk { border: 1px solid rgba(var(--gold), .26); background: rgba(8,6,4,.45); padding: calc(var(--g2) * .8) var(--g2); min-width: 0; }
.sk.passive { border-style: dashed; }
.sk .h { display: flex; align-items: center; gap: 8px; }
.sk .h img { width: calc(var(--ico) * 1.45); height: calc(var(--ico) * 1.45); flex: none; image-rendering: pixelated; }
.sk .h b { font: 600 var(--t1) var(--cin); letter-spacing: .04em; text-transform: uppercase; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk .h em { font: italic var(--t0) var(--gar); color: var(--sub); display: block; white-space: nowrap; }
.sk .n { font-size: var(--t1); white-space: nowrap; display: flex; gap: 6px; }
.sk .n i { color: var(--sub); }
.sk .n .nv { font: 600 var(--t1) var(--cin); }
.cmp { display: grid; grid-template-columns: auto minmax(0, 1fr) repeat(var(--cc, 3), auto); column-gap: var(--g); row-gap: 3px; align-items: center; font-size: var(--t2); }
.cmp .hd { font: 600 var(--t0) var(--cin); letter-spacing: .12em; color: var(--muted); text-align: right; white-space: nowrap; }
.cmp img { width: var(--ico); height: var(--ico); }
.cmp .num { font: 600 var(--t1) var(--cin); text-align: right; white-space: nowrap; }
.cmp .num small { font: var(--t0) var(--gar); margin-left: 4px; }
.party { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--g2); }
.pc { border: 1px solid rgba(var(--gold), .22); padding: 4px; text-align: center; position: relative; background: rgba(8,6,4,.4); }
.pc img { width: calc(var(--cell) * .8); height: calc(var(--cell) * .8); border: 1px solid rgba(var(--gold), .4); }
.pc b { display: block; font: 600 var(--t0) var(--cin); letter-spacing: .06em; }
.pc span { display: block; font-size: var(--t1); white-space: nowrap; }
.pc.on { border-color: var(--on); }
.pc .best { position: absolute; right: 2px; top: 2px; font: 700 calc(var(--t0) * .85) var(--cin); background: var(--ember2); color: #1a0f06; padding: 0 4px; }
.ghost { position: absolute; z-index: 25; pointer-events: none; transform: translate(-30%, -30%) rotate(-4deg); filter: drop-shadow(0 12px 14px rgba(0,0,0,.7)); opacity: .92; }
.ghost .it { outline: 2px solid var(--rl); }
.dragcap { position: absolute; z-index: 26; font: italic var(--t1) var(--gar); color: var(--up); background: rgba(5,3,2,.88); padding: 2px 8px; border: 1px solid rgba(155,227,122,.45); white-space: nowrap; }
.dragcap.bad { color: var(--down); border-color: rgba(255,143,120,.45); }

/* ===== GEAR (g1 v2): kahramanlar | yuvalar + statlar | torba + kart; skill'ler altta sol kenardan ===== */
.gear .body { flex: 1; min-height: 0; display: grid; gap: var(--g) calc(var(--g) * 1.4);
  grid-template-columns: 290px minmax(0, 1fr) minmax(0, 1.05fr); grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "heroes mid right" "skills skills right"; }
.gear .heroesc { grid-area: heroes; }
.gear .mid { grid-area: mid; display: flex; flex-direction: column; gap: var(--g); }
.gear .right { grid-area: right; display: flex; flex-direction: column; gap: var(--g); min-height: 0; }
.gear .skillsc { grid-area: skills; border-top: 1px solid rgba(var(--gold), .2); padding-top: var(--g2); }
.right > .bagwrap { flex: 1 1 auto; min-height: 0; }
.bagwrap > .bag { flex: 1 1 auto; }
.right > .card { flex: none; }
.phone .gear .body { grid-template-columns: 58px minmax(0, 1fr) minmax(0, 1.08fr); gap: 6px 8px; }
.phone .gear .hero b, .phone .gear .hero em { display: none; }
.phone .gear .hero { padding: 2px; justify-content: center; }
.phone .gear .hero img { width: 48px; height: 48px; }
.phone .skillsc .sec { display: none; }
.phone .skills .sk { padding: 2px 4px; display: flex; align-items: center; gap: 4px; }
.phone .skills .sk .h b, .phone .skills .sk .h em, .phone .skills .sk .n i { display: none; }
.phone .skills .sk .n ~ .n { display: none; }
.phone .skills .sk .n { font-size: 12.5px; gap: 3px; overflow: hidden; }

.parch .hl .afx { font-size: var(--t1); } .parch .hl .afx .v { color: #234d12; } .parch .hl .afx .rng { color: #6a5030; }

.parch .notice { font: 600 var(--t1) var(--cin); letter-spacing: .08em; color: #8a3a08; display: flex; align-items: center; gap: 8px; }
.parch .notice::before { content: ''; width: 10px; height: 10px; transform: rotate(45deg); background: var(--ember); box-shadow: 0 0 8px rgba(240,140,40,.8); }
.parch .purse { font: 600 var(--t2) var(--cin); color: #5a3d16; display: flex; align-items: center; gap: 6px; }
.parch .purse img { width: var(--ico); height: var(--ico); }
.parch .row { display: flex; gap: calc(var(--g) * 1.4); justify-content: flex-end; align-items: center; }
.parch .btn { background: linear-gradient(180deg, #2a1d12, #120c08); }
/* A: tam ekran sıçrama */
.wa { background: radial-gradient(ellipse at 28% 60%, rgba(120,70,30,.45), transparent 55%), linear-gradient(180deg, #1a120b, #070504); }
.wa .odofull { left: 2%; bottom: 0; height: 104%; }

.phone .wa .parch { right: 2.5%; top: 6%; width: 56%; padding: 10px; gap: 6px; }
/* B: savaş alanına giriş + konuşma kutusu */
.wb { background: url('gear-unified/field.webp') center 30% / cover; }

.wb .odofull { right: 6%; bottom: 23%; height: 74%; }
.wb .say { position: absolute; left: 4%; right: 4%; bottom: 4%; min-height: 25%; background: linear-gradient(180deg, rgba(26,19,12,.97), rgba(12,9,6,.97)); border: 1px solid rgba(var(--gold), .55);
  box-shadow: 0 0 0 4px rgba(5,3,2,.7); padding: calc(var(--g) * 1.2) calc(var(--g) * 1.6); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--g) calc(var(--g) * 2); align-items: center; }
.wb .say .tag { position: absolute; left: calc(var(--g) * 1.6); top: -1.1em; font: 600 var(--t2) var(--cin); letter-spacing: .2em; color: var(--on); background: #1a120a; border: 1px solid rgba(var(--gold), .55); padding: 2px 14px; }
.wb .say q { font: italic var(--t4) var(--gar); color: var(--txt); quotes: '"' '"'; display: block; }
.wb .say .line2 { display: flex; gap: var(--g); align-items: center; margin-top: var(--g2); font-size: var(--t2); color: var(--sub); }
.wb .say .line2 b { font: 600 var(--t2) var(--cin); color: var(--rt); }
.wb .say .btns { display: flex; gap: calc(var(--g) * 1.4); }

/* C: yarım panel, kayıp çekilir; arkada tüccar zaten hazır */
.wc .behind { position: absolute; inset: 0; transition: filter .5s var(--ease); filter: brightness(.35) saturate(.6); }
.wc .half { position: absolute; left: 0; top: 0; bottom: 0; width: 56%; background: linear-gradient(90deg, rgba(14,9,6,.98) 60%, rgba(14,9,6,.88)); border-right: 1px solid rgba(var(--gold), .45); box-shadow: 24px 0 50px rgba(0,0,0,.7);
  transition: transform .55s var(--ease), opacity .55s var(--ease); }
.wc .half .odofull { left: -3%; bottom: 0; height: 92%; }
.wc .half .panel { position: absolute; right: 3%; top: 12%; width: 50%; display: flex; flex-direction: column; gap: var(--g); background: rgba(10,7,5,.82); border: 1px solid rgba(var(--gold), .35); padding: calc(var(--g) * 1.2); }
.wc .half .panel h2 { margin: 0; font: 600 var(--th) var(--cin); letter-spacing: .1em; color: var(--on); text-transform: uppercase; }

.wc .half .panel .k { font: 600 var(--t1) var(--cin); letter-spacing: .24em; color: var(--muted); }

.wel em img, .wel .line2 > span img { width: var(--ico); height: var(--ico); vertical-align: -4px; }
.hlrow { display: flex; gap: var(--g); align-items: center; }
.hlrow b { font: 600 var(--t2) var(--cin); color: var(--rt); text-transform: uppercase; display: block; }
.hlrow em { font: italic var(--t1) var(--gar); color: var(--sub); display: block; }
.notice2 { font: 600 var(--t1) var(--cin); letter-spacing: .08em; color: var(--ember2); display: flex; align-items: center; gap: 8px; }
.notice2::before { content: ''; width: 10px; height: 10px; transform: rotate(45deg); background: var(--ember); box-shadow: 0 0 8px rgba(240,140,40,.8); flex: none; }
/* giriş animasyonları (Replay ile yeniden oynar) */
@keyframes odoRise { from { transform: translateY(6%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes odoWalk { from { transform: translateX(45%); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes panelIn { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideIn { from { transform: translateX(-100%); } to { transform: none; } }
.anim .wa .odofull { animation: odoRise .7s var(--ease) both; }
.anim .wa .parch { animation: panelIn .6s .35s var(--ease) both; }
.anim .wb .odofull { animation: odoWalk 1s var(--ease) both; }
.anim .wb .say { animation: panelIn .5s .7s var(--ease) both; }
.anim .wc .half { animation: slideIn .6s var(--ease) both; }

/* ===== ÖDÜL ekranı (bugünkü düzen) + torba açma geçişi ===== */
.rs { background: linear-gradient(180deg, rgba(10,7,5,.5), rgba(10,7,5,.82)), url('gear-unified/field.webp') center 30% / cover; }
.rs .rhead { position: absolute; left: 0; right: 0; text-align: center; top: var(--rh-top); transition: top .45s var(--ease); }
.rs .rhead h1 { margin: 0; font: 600 var(--rh) var(--cin); letter-spacing: .14em; text-transform: uppercase; background: linear-gradient(180deg, #fff0c4, #e8c47e 55%, #c0924a); -webkit-background-clip: text; background-clip: text; color: transparent; transition: font-size .45s var(--ease); }
.rs .rhead p { margin: 4px 0 0; font: italic var(--t3) var(--gar); color: var(--sub); transition: opacity .3s; }
.rs.open .rhead h1 { font-size: calc(var(--rh) * .62); }
.rs.open .rhead p { opacity: 0; }
.rc { position: absolute; transition: left .5s var(--ease), top .5s var(--ease), width .5s var(--ease), height .5s var(--ease); background: rgba(14,10,7,.94); border: 1px solid rgba(var(--gold), .42); cursor: pointer; }
.rc.rich { border-color: color-mix(in srgb, var(--rc) 75%, transparent); }
.rc .big, .rc .mini { position: absolute; inset: 0; transition: opacity .3s var(--ease); }
.rc .big { opacity: 1; padding: calc(var(--g) * 1.1); display: flex; flex-direction: column; align-items: center; gap: calc(var(--g2) * .9); text-align: center; background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 10%, transparent), transparent 40%); }
.rc .mini { opacity: 0; pointer-events: none; display: grid; place-items: center; }
.rs.open .rc .big { opacity: 0; pointer-events: none; }
.rs.open .rc .mini { opacity: 1; pointer-events: auto; }
.rs.open .rc { border-color: color-mix(in srgb, var(--rc) 80%, transparent); border-width: 2px; }
.rc .kick { font: 600 var(--t0) var(--cin); letter-spacing: .24em; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.rc .kick::before, .rc .kick::after { content: ''; width: 50px; height: 1px; background: linear-gradient(90deg, transparent, rgba(var(--gold), .5)); }
.rc .kick::after { transform: scaleX(-1); }
.medal { width: var(--medal); height: var(--medal); border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--rl); background: radial-gradient(circle, color-mix(in srgb, var(--rc) 30%, #120c08), #0b0806 70%); box-shadow: 0 0 22px color-mix(in srgb, var(--rc) 45%, transparent); flex: none; }
.medal img { width: 68%; height: 68%; object-fit: contain; }

.rc .big .sellc img { width: var(--ico); height: var(--ico); }

.mt { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
.mt .medal { --medal: 78%; }
.mt .lab { position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%); font: 600 var(--t0) var(--cin); letter-spacing: .06em; color: var(--rt); white-space: nowrap; text-transform: uppercase; }
.rc.selr { outline: 3px solid var(--rl); outline-offset: 3px; }
.rs .bagp { position: absolute; transition: transform .5s var(--ease), opacity .4s var(--ease); transform: translateY(40%) scale(.9); opacity: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(24,17,11,.97), rgba(12,9,6,.97)); border: 1px solid rgba(var(--gold), .45); box-shadow: 0 0 0 4px rgba(5,3,2,.6);
  padding: var(--g); display: grid; grid-template-columns: minmax(0, 1fr) var(--detw); gap: calc(var(--g) * 1.4); }

  if (rw.kind === 'item') {
    const it = ITEMS[rw.id];
    return `<div class="kick">${rw.kicker}</div><span class="sellc">Sell ${it.sell}${img('ui/gold')}</span><div class="medal">${art(rw.id)}</div><b class="nm">${esc(it.name)}</b><em>${sub(rw.id)}</em>${affixes(rw.id)}${P() ? '' : '<div class="best">Best for Defender: <span class="up">+5 M.ARM, +3 ARM</span></div>'}<div class="blocked">Bag full: make room to take it</div>`;
  }
  if (rw.kind === 'gold') return `<div class="kick">${rw.kicker}</div><div class="medal">${img('ui/gold')}</div><div class="huge">+${rw.amount}</div><em>Added to your purse</em>`;
  return `<div class="kick">${rw.kicker}</div><div class="medal">${img('em/heal')}</div><b class="nm">Field dressing</b><div class="desc">${rw.text}</div>`;
}
function rewardMini(rw, i, selr) {
  const label = rw.kind === 'item' ? 'Epic armor' : rw.kind === 'gold' ? '+60 gold' : 'Heal 30%';
  const inner = rw.kind === 'item' ? art(rw.id) : rw.kind === 'gold' ? img('ui/gold') : img('em/heal');
  return `<div class="mt"><div class="medal">${inner}</div>${selr ? '<i class="dia"></i>' : ''}<span class="lab">${label}</span></div>`;
}
function rewardScreen(mode) {
  const open = mode !== 'normal';
  const cmpMode = mode === 'compare';
  const L = rewardLayout(open);
  const cards = REWARDS.map((rw, i) => { const [x, y, w, h] = L.box(i); const selr = cmpMode && i === 0;
    return `<div class="rc r-${rw.r}${rw.r === 'epic' ? ' rich' : ''}${selr ? ' selr' : ''}" data-ri="${i}" id="rc${i}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="big">${rewardBig(rw)}</div><div class="mini">${rewardMini(rw, i, selr)}</div></div>`; }).join('');
  const [bx, by, bw, bh] = L.bag;
  const detail = cmpMode ? rewardCompareCard() : itemCard('pilgrims_token', 'reward', { party: false });
  const bag = bagHtml({ ctx: 'reward', items: FULLBAG, max: 30, cols: P() ? 6 : 10, sel: cmpMode ? undefined : 'pilgrims_token', cmp: cmpMode ? 'riveted_mail' : undefined, bin: true, binDrop: st.drag });
  const foot = open
    ? `<span class="hint">${cmpMode ? 'Tap a reward icon or a bag item to compare them.' : 'Hover a small icon (long-press on phone) to see the reward.'}</span><span class="btn" data-rb="close">${img('ui/bag')}Close bag</span>`
    : `<span class="btn" data-rb="open">${img('ui/bag')}View bag · 30 / 30</span>`;
  return `<div class="scr rs${open ? ' open' : ''}${cmpMode ? ' cmpmode' : ''}" id="rs" style="padding:0">
    <div class="rhead"><h1>Choose your reward</h1><p>Wave 6 cleared · take one</p></div>
    ${cards}
    <div class="cardhint" style="top:${L.hint}px">Tap a card to take it.</div>
    <div class="bagp" style="left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px">${bag}<div class="scroll">${detail}</div></div>
    <div class="rfoot" style="top:${L.foot}px">${foot}</div>
  </div>`;
}
function rewardCompareCard() {
  // ödül (Warded Hauberk) seçili; torbadaki Riveted Mail ile ve takılıyla yan yana
  const rows = [['armor', 'Armor', '38', '42', '41'], ['hp', 'Max HP', '145', '143', '145'], ['magicArmor', 'Magic armor', '0', '4', '5'], ['hpRegen', 'HP+/t', '3.8', '3.8', '4.8'], ['aura', 'Bulwark Aura', '15', '16', '16']];
  const n = (now, v) => { const d = diff(now, v); return `<span class="num">${v}${d ? `<small class="${dcls(d)}">${d}</small>` : ''}</span>`; };
  return `<div class="card two"><div class="colA">${nameRow('warded_hauberk')}${affixes('warded_hauberk')}${partyBlock('warded_hauberk')}</div><div class="colB">
    <div class="sec" style="margin-top:4px">Defender · armor slot</div><div class="note">Bag item: Riveted Mail · Reward: Warded Hauberk</div>
    <div class="cmp" style="--cc:3"><span></span><span class="hd" style="text-align:left">STAT</span><span class="hd">NOW</span><span class="hd">BAG ITEM</span><span class="hd">REWARD</span>
    ${rows.map(([k, l, a, b, c]) => `${k === 'aura' ? img('skills/aura') : img('stats/' + k)}<span>${l}</span><span class="num">${a}</span>${n(a, b)}${n(a, c)}`).join('')}</div>
    <div class="note">Now: Padded Gambeson. Tap another bag item to compare it instead.</div></div>
    <div class="acts"><span class="btn sm">Clear</span><span class="btn primary off">Take reward (bag full)</span></div></div>`;
}

// ===== çizim =====
const stage = document.getElementById('stage');
function offsetIn(node, anc) { const a = anc.getBoundingClientRect(), r = node.getBoundingClientRect(); const s = a.width / anc.offsetWidth; return { x: (r.left - a.left) / s, y: (r.top - a.top) / s, w: r.width / s, h: r.height / s }; }
function placeTip(html, target, prefer = 'left') {
  stage.insertAdjacentHTML('beforeend', html);
  const t = stage.querySelector('#tip');
  const o = offsetIn(target, stage);
  const W = stage.offsetWidth, H = stage.offsetHeight;
  let x = prefer === 'left' ? o.x - t.offsetWidth - 12 : o.x + o.w + 12;
  if (x < 6 || x + t.offsetWidth > W - 6) x = prefer === 'left' ? o.x + o.w + 12 : o.x - t.offsetWidth - 12;
  let y = prefer === 'below' ? o.y + o.h + 14 : o.y - 10;
  if (prefer === 'below') x = Math.max(6, Math.min(W - t.offsetWidth - 6, o.x + o.w / 2 - t.offsetWidth / 2));
  y = Math.max(6, Math.min(H - t.offsetHeight - 6, y));
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
let renderTok = 0;
function render() {
  stage.className = (st.phone ? 'phone' : 'desk') + (st.anim ? ' anim' : '') + (st.motion ? ' motion-on' : '');
  stage.style.setProperty('--cellbase', st.phone ? '44px' : '84px');
  const s = st.s;
  stage.innerHTML = s === 'gear' ? gearScreen() : s === 'merchant' ? shopScreen() : s === 'welcome-a' ? welcomeA() : s === 'welcome-b' ? welcomeB() : s === 'welcome-c' ? welcomeC()
    : rewardScreen(s === 'reward' ? 'normal' : s === 'reward-bag' ? 'bag' : 'compare');
  fit();
  const tok = ++renderTok;
  requestAnimationFrame(() => tok === renderTok && overlays(tok));
  st.anim = false;
  syncBar();
  wire();
}
function overlays(tok) {
  const s = st.s;
  const later = (fn) => setTimeout(() => tok === renderTok && fn(), 520);
  stage.querySelectorAll('.tip, .ghost, .dragcap').forEach((e) => e.remove());
  if (st.tip && (s === 'gear' || s === 'merchant')) { const c = stage.querySelector('#tipcell'); if (c) placeTip(tipItem(c.dataset.item), c, 'left'); }
  // ödül torbası: küçük ikonun üstüne gelinmiş gibi (reward-bag'de varsayılan açık)
  if (s === 'reward-bag' || (st.tip && s === 'reward-compare')) {
    const c = stage.querySelector('#rc0');
    if (c) later(() => placeTip(tipItem('warded_hauberk', 'Best for Defender: <span class="up">M.ARM +5</span> · <span class="up">ARM +3</span> · <span class="up">HP+/t +1</span>'), c, 'left'));
  }
  if (st.drag) {
    if (s === 'gear') { const t = stage.querySelector('#slot-armor'); if (t) ghost('riveted_mail', t, 'Release to equip on Defender'); }
    if (s === 'merchant') { const t = stage.querySelector('.bag .it.empty'); if (t) t.classList.add('drop-ok'); if (t) ghost('riveted_mail', t, 'Release to buy · 45 gold'); }
    if (s.startsWith('reward')) { const t = stage.querySelector('#bin'); if (t) later(() => ghost('pilgrims_token', t, 'Release to discard Pilgrim\'s Token', true)); }
  }
}
function ghost(id, target, cap, bad) {
  const o = offsetIn(target, stage);
  stage.insertAdjacentHTML('beforeend', `<div class="ghost" style="left:${o.x + o.w * .5}px;top:${o.y + o.h * .4}px">${cell(id)}</div><div class="dragcap${bad ? ' bad' : ''}" style="left:${Math.max(6, o.x - 40)}px;top:${o.y + o.h + 10}px">${cap}</div>`);
}
/** Taslak içi canlı geçişler: View bag / Close bag (ödül), Browse wares (karşılama), Replay. */
function wire() {
  stage.querySelectorAll('[data-rb]').forEach((b) => b.addEventListener('click', () => toggleBag(b.dataset.rb === 'open')));
  stage.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => { st.s = b.dataset.go; writeHash(); render(); }));
  stage.querySelectorAll('[data-slide]').forEach((b) => b.addEventListener('click', () => stage.querySelector('#wc')?.classList.add('gone')));
  stage.querySelectorAll('.rs.open .rc').forEach((c) => c.addEventListener('click', () => { st.s = 'reward-compare'; writeHash(); render(); }));
}
function toggleBag(open) {
  const rs = stage.querySelector('#rs');
  stage.querySelectorAll('.tip, .ghost, .dragcap').forEach((e) => e.remove());
  const L = rewardLayout(open);
  rs.classList.toggle('open', open);
  rs.querySelectorAll('.rc').forEach((c, i) => { const [x, y, w, h] = L.box(i); Object.assign(c.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); c.classList.remove('selr'); });
  rs.querySelector('.rfoot').style.top = L.foot + 'px';
  // geçiş bitince o durumun tam çizimi (adres de güncellenir)
  setTimeout(() => { st.s = open ? 'reward-bag' : 'reward'; writeHash(); render(); }, reduced() ? 0 : 560);
}
function fit() {
  const w = document.getElementById('wrap');
  const W = st.phone ? 844 : 1920, H = st.phone ? 390 : 1080;
  const sc = Math.min(w.clientWidth / W, w.clientHeight / H, st.phone ? 1.6 : 1);
  stage.style.transform = `scale(${sc})`;
  stage.style.left = Math.max(0, (w.clientWidth - W * sc) / 2) + 'px';
  stage.style.top = Math.max(0, (w.clientHeight - H * sc) / 2) + 'px';
}
function mk(gid, items) {
  const g = document.getElementById(gid);
  for (const [label, on, act] of items) { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', () => { act(); writeHash(); render(); }); b._on = on; g.append(b); }
}
mk('gscr', SCREENS.map(([k, l]) => [l, () => st.s === k, () => { st.s = k; st.anim = k.startsWith('welcome'); }]));
mk('gs', [['Desktop', () => !st.phone, () => (st.phone = false)], ['Phone', () => st.phone, () => (st.phone = true)]]);
mk('gt', [['Tooltip', () => st.tip, () => (st.tip = !st.tip)], ['Drag', () => st.drag, () => (st.drag = !st.drag)], ['Replay', () => false, () => (st.anim = true)], ['Force motion', () => st.motion, () => (st.motion = !st.motion)]]);
function syncBar() { document.querySelectorAll('#bar button').forEach((b) => b.classList.toggle('on', b._on())); }
window.addEventListener('hashchange', () => { readHash(); render(); });
window.addEventListener('resize', fit);
readHash();
st.anim = st.s.startsWith('welcome');
document.fonts.ready.then(() => { st.anim = false; render(); });
render();
</script>
</body>
</html>
