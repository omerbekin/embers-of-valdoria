<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Form your company - mockups</title>
<!-- TASLAK (ui-dev, 2026-10-23). Oyun kodu DEGIL. Adres: #a | #b | #c. Gercek portre/stat/fontlar kit-v2/ altindan. -->
<style>
@font-face{font-family:Cinzel;font-weight:400 900;src:url(../kit-v2/fonts/Cinzel-normal-latin.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-weight:400 700;src:url(../kit-v2/fonts/EBGaramond-normal-latin.woff2) format('woff2')}
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:400 700;src:url(../kit-v2/fonts/EBGaramond-italic-latin.woff2) format('woff2')}
:root{--gold:#f3d999;--text:#d9c8a2;--dim:#a8977a;--edge:rgba(217,178,106,.42);--line:rgba(217,178,106,.16);--line2:rgba(217,178,106,.3);--ember:#e0702a;--ember2:#ffb35a;--disp:Cinzel,Georgia,serif;--body:'EB Garamond',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;background:#070504;color:var(--text);font-family:var(--body)}
html,body{height:100%;overflow:hidden}body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.tabs{display:flex;gap:6px;justify-content:center;padding:4px 0 4px}
.tabs button{background:none;border:0;border-bottom:1px solid transparent;padding:4px 18px;font:600 16px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);transition:color .2s,border-color .2s}
.tabs button:hover{color:var(--gold)}.tabs button.on{color:var(--gold);border-color:var(--edge)}
.tabs small{display:block;font:400 13px var(--body);letter-spacing:0;text-transform:none;color:var(--dim);margin-top:2px}
.stagewrap{position:relative;margin:0 auto;overflow:hidden}
.stage{position:relative;width:1600px;height:900px;transform-origin:top left;position:absolute;left:0;top:0;background:#0b0806 url(../kit-v2/bg/castle-hall.webp) center/cover;overflow:hidden;border:1px solid var(--line)}
.stage::before{content:'';position:absolute;inset:0;background:rgba(6,4,3,.72)}
.modal{position:absolute;left:50px;top:0;width:1500px;height:900px;background:linear-gradient(180deg,#17110b,#0f0a07);border:1px solid var(--edge);box-shadow:0 0 0 3px rgba(8,6,4,.8),0 20px 60px #000;display:flex;flex-direction:column;padding:26px 40px 22px}
.modal::before{content:'';position:absolute;inset:6px;border:1px solid var(--line);pointer-events:none}
h1{margin:0;text-align:center;font:600 34px var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.sub{text-align:center;color:var(--dim);font-size:19px;margin:6px 0 0}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--edge),transparent);margin:14px 0}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:12px;border-top:1px solid var(--line)}
.count{font:500 20px var(--body);color:var(--text)}.count b{font:600 20px var(--disp);color:var(--gold)}
.go{position:relative;background:none;border:1px solid var(--edge);padding:12px 44px;font:600 20px var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);transition:.2s}
.go:hover{border-color:var(--gold);box-shadow:0 0 22px rgba(243,217,153,.25)}
.go::before{content:'';position:absolute;left:-6px;top:50%;width:10px;height:10px;transform:translateY(-50%) rotate(45deg);background:var(--ember);border:1px solid var(--ember2);box-shadow:0 0 8px rgba(240,140,40,.8)}
.go.off{opacity:.4}.go.off::before{background:#4a3a2a;border-color:#6a5a40;box-shadow:none}
.link{background:none;border:0;font:600 15px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}.link:hover{color:var(--gold)}
.mock{position:fixed;left:10px;bottom:10px;z-index:9;font:600 11px var(--disp);letter-spacing:.15em;color:#6c5d44;border:1px dashed #4a3d2a;padding:4px 8px;background:#0a0705}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.05em .7em .05em .5em;font:600 12px var(--disp);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);color:var(--text);min-height:22px;white-space:nowrap}
.chip img{width:16px;height:16px}.chip.role{color:#1a1109;border-color:transparent;background:var(--ac);padding-left:.8em}
.mc{--ac:#cdb67f;position:relative;display:flex;flex-direction:column;background:#120c08;border:1px solid var(--line2);cursor:pointer;text-align:center;padding:0 0 10px;gap:7px;align-items:center;transition:translate .2s,border-color .2s,box-shadow .2s;animation:rise .26s ease-out both;animation-delay:calc(var(--i)*45ms)}
.noanim .mc,.noanim .cc,.noanim .bc{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mc:hover{translate:0 -4px;border-color:var(--ac);box-shadow:0 0 0 3px rgba(8,6,4,.75),0 0 18px rgba(243,217,153,.22)}
.mc.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(8,6,4,.75),0 0 22px rgba(243,217,153,.3),inset 0 0 26px color-mix(in srgb,var(--ac) 12%,transparent)}
.mc.sel::before{content:'';position:absolute;left:50%;top:0;width:10px;height:10px;transform:translate(-50%,-50%) rotate(45deg);background:var(--ember);border:1px solid var(--ember2);z-index:3;box-shadow:0 0 8px rgba(240,140,40,.8)}
.pt{position:relative;width:100%;aspect-ratio:1/.78;overflow:hidden;border-bottom:1px solid var(--line2)}
.pt img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.pt::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(13,9,6,.85))}
.pt .bl{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;padding:8px 10px;font-size:15px;line-height:1.2;color:#e6d6ae;background:rgba(10,7,4,.86);opacity:0;transition:opacity .2s;text-align:left}
.mc:hover .bl{opacity:1}
.nm{font:600 17px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.ord{position:absolute;left:8px;top:8px;z-index:3;font:700 14px var(--disp);color:var(--gold);width:26px;height:26px;display:grid;place-items:center;background:#140e09;border:1px solid var(--gold);transform:rotate(45deg)}
.ord i{transform:rotate(-45deg);font-style:normal}
.crown{position:absolute;right:8px;top:8px;z-index:3;width:26px;color:var(--gold);filter:drop-shadow(0 1px 2px #000)}
.crown svg,.slot .ld svg{width:100%;height:100%;fill:currentColor}
.tut{font-size:13px;color:var(--dim)}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:16px 14px}
.slots{display:flex;gap:16px;justify-content:center}
.slot{position:relative;display:flex;align-items:center;gap:14px;width:420px;height:100px;border:1px dashed var(--line2);padding:8px 14px;transition:.2s}
.slot.over{border-color:var(--gold);background:rgba(243,217,153,.07)}
.slot.full{border-style:solid;border-color:var(--edge);background:#120c08}
.slot img.av{width:80px;height:80px;object-fit:cover;object-position:50% 18%;border:1px solid var(--line2)}
.slot .em{flex:1;color:var(--dim);font-size:18px;text-align:center}
.slot .nm{font-size:19px}.slot .rl{font-size:15px;color:var(--dim)}
.slot .num{font:600 13px var(--disp);color:var(--dim);letter-spacing:.14em}
.slot .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--dim);font-size:22px;width:30px;height:30px}.slot .x:hover{color:var(--gold)}
.slot .ld{position:absolute;right:38px;top:4px;background:none;border:0;width:30px;height:30px;color:#6c5d44;padding:4px}.slot .ld:hover,.slot .ld.on{color:var(--gold)}
.slot.lead{border-color:var(--gold)}
.bsplit{display:flex;gap:26px;flex:1;min-height:0}
.bgrid{width:700px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-content:start}
.bc{--ac:#cdb67f;position:relative;background:#120c08;border:1px solid var(--line2);cursor:pointer;padding-bottom:6px;text-align:center;transition:translate .2s,border-color .2s,box-shadow .2s;animation:rise .26s ease-out both;animation-delay:calc(var(--i)*40ms)}
.bc img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 18%;display:block;border-bottom:1px solid var(--line2)}
.bc .nm{font-size:14px;display:block;margin-top:6px}
.bc:hover{translate:0 -3px;border-color:var(--ac)}.bc.focus{border-color:var(--ac);box-shadow:0 0 14px color-mix(in srgb,var(--ac) 40%,transparent)}
.bc.sel{border-color:var(--gold)}.bc.sel::before{content:'';position:absolute;left:50%;top:0;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);background:var(--ember);border:1px solid var(--ember2);z-index:2}
.bc .ord{width:22px;height:22px;font-size:12px;left:6px;top:6px}
.det{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.dhead{display:flex;gap:20px;align-items:center}
.dhead img{width:170px;height:170px;object-fit:cover;object-position:50% 18%;border:1px solid var(--edge)}
.dhead h2{margin:0 0 8px;font:600 32px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.dhead p{margin:10px 0 0;font-size:20px;line-height:1.3}
.plates{display:flex;gap:6px;flex-wrap:wrap}
.plate{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:5px 12px 5px 6px;background:linear-gradient(90deg,rgba(217,178,106,.07),transparent)}
.plate img{width:44px;height:44px;border:1px solid var(--line2)}
.plate .t{font:600 15px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--text)}.plate .d{font-size:15px;color:var(--dim)}
.plate.pas{border-color:var(--edge)}.plate.pas .t{color:var(--gold)}
.lbl{font:600 12px var(--disp);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.cslots{display:flex;gap:18px;justify-content:center;padding-top:14px}
.cslots .slot{width:400px}
.cov{display:flex;gap:10px;justify-content:center;margin:12px 0 0;align-items:center;font-size:17px;color:var(--dim)}
.cov .chip.has{border-color:var(--gold);color:var(--gold)}
.grp{display:flex;align-items:stretch;gap:16px;margin-top:10px}
.gl{width:170px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line2);padding-right:12px}
.gl b{font:600 18px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.gl span{font-size:15px;color:var(--dim)}
.rows{display:flex;gap:12px;flex:1}
.cc{--ac:#cdb67f;position:relative;display:flex;gap:12px;align-items:center;width:268px;padding:8px;background:#120c08;border:1px solid var(--line2);cursor:pointer;transition:translate .2s,border-color .2s,box-shadow .2s;animation:rise .26s ease-out both;animation-delay:calc(var(--i)*50ms)}
.cc img{width:76px;height:76px;object-fit:cover;object-position:50% 18%;border:1px solid var(--line2)}
.cc .nm{font-size:15px;display:block;margin-bottom:5px}.cc .tut{display:block;margin-top:3px}
.cc:hover{translate:0 -3px;border-color:var(--ac);box-shadow:0 0 16px rgba(243,217,153,.18)}
.cc.sel{border-color:var(--gold)}.cc.sel::before{content:'';position:absolute;left:-5px;top:50%;width:9px;height:9px;transform:translateY(-50%) rotate(45deg);background:var(--ember);border:1px solid var(--ember2)}
.cc .ord{width:22px;height:22px;font-size:12px;left:auto;right:8px;top:8px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#140e09;border:1px solid var(--edge);padding:8px 20px;font-size:18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}.toast.show{opacity:1}
@media (max-height:640px){.tabs small{display:none}.tabs button{font-size:13px}}
</style></head><body>
<div class="tabs" id="tabs"></div>
<div class="stagewrap"><div class="stage" id="stage"><div class="modal" id="modal"></div><div class="toast" id="toast"></div></div></div>
<div class="mock">MOCKUP · NOT THE GAME</div>
<script src="data.js"></script>
<script>
const K='../kit-v2/';
const CL=window.CLASSES,BY=Object.fromEntries(CL.map(c=>[c.id,c]));
const ORDER=['warrior','defender','archer','cutthroat','mage','druid','paladin','undead','antimage','gambler','hexer'];
const TUT=new Set(['warrior','druid']);
const STAT={str:'STR',dex:'DEX',int:'INT',luck:'LUCK'};
const GROUPS=[['Frontline','Soak and strike up close',['warrior','defender','cutthroat']],['Ranged','Hits from the back rows',['archer','gambler']],['Caster','Spells and curses',['mage','antimage','undead','hexer']],['Support','Heal, summon, mend',['paladin','druid']]];
const SIZE=3;
const CROWN='<svg viewBox="0 0 24 24"><path d="M3 18h18v2H3zM3 7l4.5 4L12 4l4.5 7L21 7l-2 9H5z"/></svg>';
let slots=[null,null,null],leader=null,focus='warrior',variant=(location.hash||'#a').slice(1)[0]||'a',enter=true;
const $=s=>document.querySelector(s);
const picks=()=>slots.filter(Boolean);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function fixLeader(){const p=picks();if(!p.length)leader=null;else if(!p.includes(leader))leader=p[0]}
function toggle(id){const i=slots.indexOf(id);
 if(i<0){const e=slots.indexOf(null);if(e<0)return toast('You already have 3 heroes. Tap one to remove it.');slots[e]=id;if(!leader)leader=id}
 else if(leader!==id)leader=id; else{slots[i]=null}
 fixLeader();render()}
function place(id,si){const from=slots.indexOf(id);const prev=slots[si];slots[si]=id;if(from>=0)slots[from]=prev;fixLeader();render()}
function remove(si){slots[si]=null;fixLeader();render()}
const ord=id=>{const i=picks().indexOf(id);return i<0?'':`<span class="ord"><i>${['I','II','III'][i]}</i></span>`};
const stat=c=>`<span class="chip"><img src="${K}stat/${c.primary}.webp" alt="">${STAT[c.primary]}</span>`;
const role=c=>`<span class="chip role">${c.role}</span>`;
function slotHTML(i){const id=slots[i],c=id&&BY[id];
 if(!c)return `<div class="slot" data-slot="${i}"><span class="num">${['I','II','III'][i]}</span><span class="em">Empty · tap or drag a hero here</span></div>`;
 return `<div class="slot full ${leader===id?'lead':''}" data-slot="${i}" style="--ac:${c.color}" draggable="true" data-sid="${id}"><img class="av" src="${K}av/${id}.webp" alt=""><div><div class="nm">${c.name}</div><div class="rl">${leader===id?'Leader · ':''}${c.role}</div></div>
 <button class="ld ${leader===id?'on':''}" data-lead="${id}" title="Make leader">${CROWN}</button><button class="x" data-rm="${i}" title="Remove">×</button></div>`}
function foot(){const n=picks().length;return `<div class="foot"><button class="link" data-act="rand">Random company</button><div class="count"><b>${n} / ${SIZE}</b> chosen${leader?` &nbsp;·&nbsp; Leader: ${BY[leader].name}`:''}</div><button class="go ${n<SIZE?'off':''}" data-act="go">Set out</button></div>`}
const head=`<h1>Form your company</h1><p class="sub">Choose ${SIZE} heroes. The first one you pick leads the company (tap a chosen hero again to make them the leader).</p><div class="rule"></div>`;
function cardA(c,i){const s=slots.includes(c.id);return `<div class="mc ${s?'sel':''}" style="--ac:${c.color};--i:${i}" data-id="${c.id}" draggable="true"><div class="pt"><img src="${K}av/${c.id}.webp" alt="">${ord(c.id)}${leader===c.id?`<span class="crown">${CROWN}</span>`:''}<div class="bl">${c.blurb}</div></div><div class="nm">${c.name}</div><div class="chips">${role(c)}${stat(c)}</div>${TUT.has(c.id)?'<div class="tut">Played in the tutorial</div>':'<div class="tut">&nbsp;</div>'}</div>`}
function vA(){return head+`<div class="body"><div class="grid6">${ORDER.map((id,i)=>cardA(BY[id],i)).join('')}</div>
<div style="margin-top:auto"><div class="lbl" style="text-align:center;margin-bottom:8px">Your company</div><div class="slots">${[0,1,2].map(i=>slotHTML(i)).join('')}</div></div></div>`+foot()}
function vB(){const c=BY[focus],s=slots.includes(focus);
 return head+`<div class="body"><div class="bsplit"><div class="bgrid">${ORDER.map((id,i)=>`<div class="bc ${slots.includes(id)?'sel':''} ${id===focus?'focus':''}" style="--ac:${BY[id].color};--i:${i}" data-id="${id}" draggable="true"><img src="${K}av/${id}.webp" alt="">${ord(id)}<span class="nm" style="color:${BY[id].color}">${BY[id].name}</span></div>`).join('')}</div>
 <div class="det" style="--ac:${c.color}"><div class="dhead"><img src="${K}av/${c.id}.webp" alt=""><div><h2>${c.name}</h2><div class="chips" style="justify-content:flex-start">${role(c)}${stat(c)}<span class="chip">${c.range>=4?'Long range':c.range>1?'Mid range':'Melee'}</span></div><p>${c.blurb}</p></div></div>
 <div class="lbl">Passive</div><div class="plate pas"><img src="${c.passive.i||''}" alt=""><div><div class="t">${c.passive.n}</div><div class="d">${c.passive.t.length>120?c.passive.t.slice(0,117)+'…':c.passive.t}</div></div></div>
 <div class="lbl">Skills</div><div class="plates">${c.skills.map(x=>`<div class="plate" style="flex:1 1 45%"><img src="${x.i||''}" alt=""><div class="t">${x.n}</div></div>`).join('')}</div>
 <div style="margin-top:auto"><button class="link" data-act="addfocus" style="color:var(--gold)">${s?(leader===c.id?'Remove from company':'Make leader'):'Add to company'}</button></div></div></div>
 <div class="slots" style="margin:10px 0">${[0,1,2].map(i=>slotHTML(i)).join('')}</div></div>`+foot()}
function vC(){const has=g=>g[2].some(id=>slots.includes(id));
 const card=(id,i)=>{const c=BY[id];return `<div class="cc ${slots.includes(id)?'sel':''}" style="--ac:${c.color};--i:${i}" data-id="${id}" draggable="true"><img src="${K}av/${id}.webp" alt=""><div><span class="nm" style="color:${c.color}">${c.name}</span><div class="chips" style="justify-content:flex-start">${stat(c)}</div>${TUT.has(id)?'<span class="tut">Played in the tutorial</span>':''}</div>${ord(id)}</div>`};
 let n=0;
 return `<h1>Form your company</h1><p class="sub">Choose ${SIZE} heroes. Tap a chosen hero again to make them the leader.</p><div class="cslots">${[0,1,2].map(i=>slotHTML(i)).join('')}</div>
 <div class="cov"><span>Roles covered</span>${GROUPS.map(g=>`<span class="chip ${has(g)?'has':''}">${g[0]}</span>`).join('')}</div><div class="rule"></div>
 <div class="body">${GROUPS.map(g=>`<div class="grp"><div class="gl"><b>${g[0]}</b><span>${g[1]}</span></div><div class="rows">${g[2].map(id=>card(id,n++)).join('')}</div></div>`).join('')}</div>`+foot()}
function render(){const m=$('#modal');m.className='modal '+(enter?'':'noanim');m.innerHTML={a:vA,b:vB,c:vC}[variant]();bind();setTimeout(()=>enter=false,900)}
function bind(){const m=$('#modal');
 m.querySelectorAll('[data-id]').forEach(e=>{e.onclick=()=>{if(variant==='b'&&focus!==e.dataset.id){focus=e.dataset.id;return render()}toggle(e.dataset.id)};e.ondragstart=ev=>ev.dataTransfer.setData('text/plain',e.dataset.id)});
 m.querySelectorAll('.slot').forEach(e=>{const si=+e.dataset.slot;e.ondragover=ev=>{ev.preventDefault();e.classList.add('over')};e.ondragleave=()=>e.classList.remove('over');e.ondrop=ev=>{ev.preventDefault();const id=ev.dataTransfer.getData('text/plain');if(id)place(id,si)};
  if(e.dataset.sid)e.ondragstart=ev=>ev.dataTransfer.setData('text/plain',e.dataset.sid);
  else e.onclick=()=>{if(variant==='b'&&!slots.includes(focus))place(focus,si);else toast('Tap a hero above, or drag one here.')}});
 m.querySelectorAll('[data-rm]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();remove(+e.dataset.rm)});
 m.querySelectorAll('[data-lead]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();leader=e.dataset.lead;render()});
 m.querySelectorAll('[data-act]').forEach(e=>e.onclick=()=>{const a=e.dataset.act;
  if(a==='go'){picks().length<SIZE?toast('Pick 3 heroes.'):toast('Set out! (mockup)')}
  if(a==='rand'){const r=[...ORDER].sort(()=>Math.random()-.5).slice(0,3);slots=r;leader=r[0];render()}
  if(a==='addfocus')toggle(focus)})}
function tabs(){const t={a:['A · Company strip','Cards with chips, 3-slot strip'],b:['B · Detail panel','Pick left, read right'],c:['C · By role','Grouped rows, leader crown on top']};
 $('#tabs').innerHTML=Object.entries(t).map(([k,v])=>`<button class="${k===variant?'on':''}" data-v="${k}">${v[0]}<small>${v[1]}</small></button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{variant=b.dataset.v;location.hash=variant;enter=true;tabs();render()})}
function fit(){const th=$('#tabs').offsetHeight,s=Math.min((innerWidth)/1600,(innerHeight-th)/900);const w=$('.stagewrap');w.style.width=1600*s+'px';w.style.height=900*s+'px';$('#stage').style.transform=`scale(${s})`}
addEventListener('resize',fit);addEventListener('hashchange',()=>{variant=(location.hash||'#a').slice(1)[0]||'a';enter=true;tabs();render()});
tabs();render();fit();
</script></body></html>
