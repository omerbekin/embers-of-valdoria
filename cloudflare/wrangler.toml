# Embers of Valdoria: tek Cloudflare Worker, tek adres https://embersofvaldoria.com (ücretsiz plan). Kurulum: README.md
# - Oyun:  /           -> ../dist (npm run build çıktısı), Workers Static Assets. Statik dosya istekleri Worker'ı çalıştırmaz, ücretsiz ve sınırsızdır.
# - Lobi:  /lobby/...   -> src/index.ts (WebSocket signaling) + Durable Object. Oyundaki adres: wss://embersofvaldoria.com/lobby
name = "embers-of-valdoria"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Kullanım verisi gönderilmez
send_metrics = false
# Custom Domain: embersofvaldoria.com için DNS kaydı ve SSL sertifikasını Cloudflare deploy sırasında kendisi kurar (panelde elle ekleme yok).
# Kök alan adı (apex): ücretsiz Universal SSL embersofvaldoria.com ve *.embersofvaldoria.com'u kapsar.
routes = [
  { pattern = "embersofvaldoria.com", custom_domain = true, zone_name = "embersofvaldoria.com" }
]
# workers.dev / önizleme adresleri kapalı: tek adres yukarıdaki (ilk deploy'da "workers.dev alt alan adı seç" sorusu da çıkmaz)
workers_dev = false
preview_urls = false

[assets]
# Yalnızca derleme çıktısı yüklenir (assets/source, voice-candidates gibi kaynak klasörler dist'e girmez)
directory = "../dist"
binding = "ASSETS"
# Yalnızca /lobby yolları ve /diag (hata raporu POST) Worker koduna gider; geri kalan her şey doğrudan statik dosyadır (Worker isteği sayılmaz)
run_worker_first = ["/lobby", "/lobby/*", "/diag", "/auth/*", "/save", "/save/*", "/account", "/account/*"]
# "/" -> index.html; gallery.html?embed=1 (wiki iframe'i) da çalışır
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Kod başına bir Durable Object. ÜCRETSİZ PLAN ŞARTI: SQLite tabanlı olmalı (new_sqlite_classes; "new_classes" ücretli plan ister)
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

# Hata raporları (opt-in; docs/arch/diagnostics.md): KV, ücretsiz plan (günde 1.000 yazma; rapor başına 2 yazma), 30 gün TTL.
# BİR KEZ: npm --prefix cloudflare exec -- wrangler kv namespace create eov-diag  -> çıkan id'yi aşağıya yaz (yazılmazsa deploy hata verir).
[[kv_namespaces]]
binding = "DIAG"
id = "25eccdc0fbe74ff6b266d0050d849f3b"

# Hesap ve bulut kaydı (docs/arch/accounts-plan.md): D1 `eov-accounts` (panelden oluşturuldu 2026-10-24; tablolar migrations/0001_accounts.sql ile kuruldu).
[[d1_databases]]
binding = "DB"
database_name = "eov-accounts"
database_id = "d1261f00-de57-4b6d-bbd2-e158c64d1f69"
migrations_dir = "migrations"

# 24 aydır girmeyen hesapları siler (auth.ts > deleteInactiveAccounts), günde bir kez
[triggers]
crons = ["17 3 * * *"]

[vars]
# OAuth istemci kimlikleri (gizli değil). Boşken ilgili sağlayıcı kapalıdır (503, oyunda giriş gizlenir).
# Gizli anahtarlar wrangler.toml'a YAZILMAZ: wrangler secret put GOOGLE_CLIENT_SECRET / DISCORD_CLIENT_SECRET / SESSION_HMAC_KEY
GOOGLE_CLIENT_ID = ""
DISCORD_CLIENT_ID = ""
# Yalnızca bu adreslerden açılan oyun bağlanabilir (virgülle ayrılır; ":*" herhangi bir port)
ALLOWED_ORIGINS = "https://embersofvaldoria.com,https://eov.backinn.com.tr,https://omerbekin.github.io,http://localhost:*,http://127.0.0.1:*"
